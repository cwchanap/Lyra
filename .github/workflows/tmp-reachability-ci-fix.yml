name: Temporary reachability CI fix

on:
  push:
    branches: [codex/hpa-265-beat-85]
    paths:
      - .github/workflows/tmp-reachability-ci-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hpa-265-beat-85

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch authorization guarantee analysis
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/scripts/compile-scenes/reachability.ts")
          text = path.read_text()

          before = (
              "      if (groupMembers.length === 1) {\n"
              "        // Standalone producer: the grant is absent from mustAtoms, so this\n"
              "        // reachable producer is only may-reachable. An optional producer can\n"
              "        // be skipped directly; a mandatory producer can be missed when its\n"
              "        // own predecessor is optional. Either way the grant is unguaranteed.\n"
              "        unguaranteed = true;\n"
              "        break;\n"
              "      } else {"
          )
          after = (
              "      if (groupMembers.length === 1) {\n"
              "        const nodesByKey = new Map(\n"
              "          input.nodes.map((candidate) => [candidate.key, candidate]),\n"
              "        );\n"
              "        const producerKeysByAtom = buildPositiveProducerIndex(input.nodes);\n"
              "        const prerequisiteAtoms = unique(\n"
              "          [\n"
              "            ...requiredExpressionPredicates(producer.condition),\n"
              "            ...producer.implicitPrerequisites,\n"
              "          ].map((predicate) => predicate.atom),\n"
              "        );\n"
              "        const hasOptionalStrictPredecessor = producer.strictPredecessorKeys.some(\n"
              "          (key) => nodesByKey.get(key)?.requirement === \"optional\",\n"
              "        );\n"
              "        const hasOnlyOptionalPrerequisiteProducers = prerequisiteAtoms.some(\n"
              "          (atom) => {\n"
              "            const keys = producerKeysByAtom.get(atom) ?? [];\n"
              "            return (\n"
              "              keys.length > 0 &&\n"
              "              keys.every(\n"
              "                (key) => nodesByKey.get(key)?.requirement === \"optional\",\n"
              "              )\n"
              "            );\n"
              "          },\n"
              "        );\n"
              "        if (\n"
              "          producer.requirement === \"optional\" ||\n"
              "          hasOptionalStrictPredecessor ||\n"
              "          hasOnlyOptionalPrerequisiteProducers\n"
              "        ) {\n"
              "          unguaranteed = true;\n"
              "          break;\n"
              "        }\n"
              "      } else {"
          )
          if before not in text:
              raise SystemExit("standalone producer block not found")
          text = text.replace(before, after, 1)

          old_comment = (
              "    // A grant is unguaranteed when the player can reach the predecessor\n"
              "    // without producing the grant — i.e., the grant sits on an optional path\n"
              "    // or only some mutually-exclusive alternatives produce it. If the grant\n"
              "    // were guaranteed on every path it would be in mustAtoms (checked above);\n"
              "    // reaching here means at least one reachable matching producer is only\n"
              "    // may-reachable. For a standalone producer this holds whether the producer\n"
              "    // itself is optional (the player skips it) or mandatory (the player skips\n"
              "    // its own optional predecessor) — in both cases the player can complete\n"
              "    // the predecessor without granting the authorization."
          )
          new_comment = (
              "    // A grant is unguaranteed when its authored trigger is actually skippable:\n"
              "    // the producer itself is optional, a required prerequisite is supplied only\n"
              "    // by optional nodes, or only some mutually-exclusive alternatives grant it.\n"
              "    // Do not infer skippability from global mustAtoms alone: later mandatory\n"
              "    // content can be absent from the must fixed point after an earlier modeled\n"
              "    // branch even when this producer's own path is structurally mandatory."
          )
          if old_comment not in text:
              raise SystemExit("authorization guarantee comment not found")
          path.write_text(text.replace(old_comment, new_comment, 1))
          PY

      - name: Verify focused compiler behavior
        run: |
          bun run test:scripts -- packages/scripts/compile-scenes/reachability.test.ts
          bun run scenes:compile
          bun run check:scripts
          git diff --check

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/scripts/compile-scenes/reachability.ts
          git rm .github/workflows/tmp-reachability-ci-fix.yml
          git commit -m "fix: scope authorization guarantee to skippable prerequisites"
          git push origin HEAD:codex/hpa-265-beat-85
