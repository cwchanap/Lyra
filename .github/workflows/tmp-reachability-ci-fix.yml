name: Temporary reachability CI trace

on:
  push:
    branches: [codex/hpa-265-beat-85]
    paths:
      - .github/workflows/tmp-reachability-ci-fix.yml

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hpa-265-beat-85

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Instrument authorization reachability
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/scripts/compile-scenes/reachability.ts")
          text = path.read_text()

          replacements = [
              (
                  "    const authorizationFailure = mandatoryAuthorizationFailure({\n"
                  "      nodes,\n"
                  "      node,\n"
                  "      reachableNodeKeys,\n"
                  "      mustAtoms,\n"
                  "      authorizationDefinitions,\n"
                  "    });",
                  "    const authorizationFailure = mandatoryAuthorizationFailure({\n"
                  "      nodes,\n"
                  "      node,\n"
                  "      reachableNodeKeys,\n"
                  "      mustReachableNodeKeys,\n"
                  "      mustAtoms,\n"
                  "      authorizationDefinitions,\n"
                  "    });",
              ),
              (
                  "function mandatoryAuthorizationFailure(input: {\n"
                  "  node: ReachabilityNode;\n"
                  "  nodes: readonly ReachabilityNode[];\n"
                  "  reachableNodeKeys: ReadonlySet<string>;\n"
                  "  mustAtoms: ReadonlySet<ReachabilityAtom>;",
                  "function mandatoryAuthorizationFailure(input: {\n"
                  "  node: ReachabilityNode;\n"
                  "  nodes: readonly ReachabilityNode[];\n"
                  "  reachableNodeKeys: ReadonlySet<string>;\n"
                  "  mustReachableNodeKeys: ReadonlySet<string>;\n"
                  "  mustAtoms: ReadonlySet<ReachabilityAtom>;",
              ),
              (
                  "    if (nonLegacyMatching.length === 0) continue;\n",
                  "    if (nonLegacyMatching.length === 0) continue;\n"
                  "    if (authorizationId === \"narrow_lock_export\") {\n"
                  "      const byKey = new Map(input.nodes.map((candidate) => [candidate.key, candidate]));\n"
                  "      const details = nonLegacyMatching.map((producer) => ({\n"
                  "        key: producer.key,\n"
                  "        requirement: producer.requirement,\n"
                  "        reachable: input.reachableNodeKeys.has(producer.key),\n"
                  "        mustReachable: input.mustReachableNodeKeys.has(producer.key),\n"
                  "        condition: producer.condition,\n"
                  "        implicitPrerequisites: producer.implicitPrerequisites,\n"
                  "        predecessors: producer.strictPredecessorKeys.map((key) => {\n"
                  "          const predecessor = byKey.get(key);\n"
                  "          return predecessor === undefined\n"
                  "            ? { key, missing: true }\n"
                  "            : {\n"
                  "                key,\n"
                  "                requirement: predecessor.requirement,\n"
                  "                reachable: input.reachableNodeKeys.has(key),\n"
                  "                mustReachable: input.mustReachableNodeKeys.has(key),\n"
                  "                condition: predecessor.condition,\n"
                  "                implicitPrerequisites: predecessor.implicitPrerequisites,\n"
                  "              };\n"
                  "        }),\n"
                  "      }));\n"
                  "      console.error(\"[reachability-debug]\", JSON.stringify(details, null, 2));\n"
                  "    }\n",
              ),
          ]

          for before, after in replacements:
              if before not in text:
                  raise SystemExit(f"trace patch target missing: {before[:100]!r}")
              text = text.replace(before, after, 1)

          path.write_text(text)
          PY

      - name: Compile with trace
        run: bun run scenes:compile
