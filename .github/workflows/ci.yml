name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-revision-golden:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Content revision golden (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify content revision contract
        run: bunx vitest run --config vitest.scripts.config.ts packages/scripts/compile-scenes/semantic-defaults.test.ts packages/scripts/compile-scenes/save-content-references.test.ts packages/scripts/compile-scenes/save-content-manifest.test.ts

  lint-frontend:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Frontend – check & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile scenes
        run: bun run scenes:compile

      - name: Verify Reader real-content projection
        run: bun run --cwd apps/layout-editor verify:reader-real-content

      - name: Verify Asset real-content projection
        run: bun run --cwd apps/layout-editor verify:asset-real-content

      - name: Verify Plan real-content projection
        run: bun run --cwd apps/layout-editor verify:plan-real-content

      - name: Verify AI review real-content projection
        run: bun run --cwd apps/layout-editor verify:ai-review-real-content

      - name: Evidence source audit
        run: bun run evidence-sources:audit

      - name: Type-check (svelte-check)
        run: bun run check

      - name: Type-check Tauri e2e specs (tsc)
        run: bun run --cwd apps/game check:e2e

      - name: Run surviving E2E contract tests
        run: |
          node --test \
            apps/game/scripts/e2e-suite-registry.test.mjs \
            apps/game/scripts/e2e-runner-lifecycle.test.mjs \
            apps/game/scripts/save-e2e-paths.test.mjs \
            apps/game/scripts/e2e-ci-workflow.test.mjs

      - name: Type-check scripts (tsc)
        run: bun run check:scripts

      - name: Build frontend
        run: bun run build

  lint-rust:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Rust – check & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/game/src-tauri
            apps/layout-editor/src-tauri

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo check game
        run: cargo check --manifest-path apps/game/src-tauri/Cargo.toml

      - name: Cargo check editor
        run: cargo check --manifest-path apps/layout-editor/src-tauri/Cargo.toml

      - name: Clippy game
        run: cargo clippy --manifest-path apps/game/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Clippy editor
        run: cargo clippy --manifest-path apps/layout-editor/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      # rustdoc with --document-private-items resolves intra-doc links to
      # pub(super)/private items, so broken doc links (e.g. a `[`Self::foo`]`
      # whose target was relocated out of scope) surface as warnings. -D
      # warnings fails CI on them. Catches the orphaned-intra-doc-link defect
      # class that survived review of HPA-55 (commit f429a95).
      - name: Rustdoc game (deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --document-private-items --manifest-path apps/game/src-tauri/Cargo.toml

      - name: Rustdoc editor (deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --document-private-items --manifest-path apps/layout-editor/src-tauri/Cargo.toml

  unit-tests-frontend:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync SvelteKit generated tsconfig
        run: bun run --cwd apps/game sync

      - name: Run compiler and workspace layout tests
        run: bun run test:scripts

      - name: Run shared package Vitest with coverage
        run: bun run --cwd packages/shared test -- --coverage.enabled

      - name: Run editor Vitest
        run: bun run --cwd apps/layout-editor test

      - name: Run game Vitest with coverage
        run: bun run --cwd apps/game test -- --coverage.enabled

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: |
            apps/game/coverage/lcov.info
            packages/shared/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: frontend

  unit-tests-rust:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/game/src-tauri
            apps/layout-editor/src-tauri

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run editor Rust tests
        run: cargo test --manifest-path apps/layout-editor/src-tauri/Cargo.toml

      - name: Generate Rust coverage
        run: cargo llvm-cov --manifest-path apps/game/src-tauri/Cargo.toml --lcov --output-path lcov-rust.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov-rust.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: rust

  audio-boundary-check:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: BGM loop boundary regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # audio-boundary.test.ts shells out to ffmpeg to decode the committed
      # Vorbis loop OGGs. It is deliberately excluded from test:scripts (which
      # runs in environments that may lack ffmpeg), so it gets its own
      # ffmpeg-capable job. Ubuntu runners ship ffmpeg with the native Vorbis
      # decoder; install explicitly to make the dependency visible and keep the
      # job robust against runner image changes.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg is available
        run: ffmpeg -version

      - name: Run BGM loop boundary checks
        run: bun run audio:check-boundaries

  tauri-e2e-pr-smoke:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && !contains(github.event.pull_request.labels.*.name, 'ci:full-e2e') }}
    name: Tauri E2E
    runs-on: ubuntu-latest
    # The first run under the tauri-e2e-v2 cache prefix is cold by
    # definition, so this ceiling must cover a cold target-e2e cargo build
    # (observed ~20+ min on a cache miss), not the warm setup sample.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Dedicated target dir for e2e builds so rust-cache caches it
      # separately from the normal debug target used by other jobs.
      CARGO_TARGET_DIR: apps/game/src-tauri/target-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Shared prefix with tauri-e2e-full so the nightly/tag run warms the
      # cache that PR smoke branches restore.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/game/src-tauri -> target-e2e
          prefix-key: tauri-e2e-v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run packaged E2E smoke suite
        run: xvfb-run -a bun run --cwd apps/game test:e2e:smoke

      - name: Upload E2E evidence
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tauri-e2e-smoke
          path: |
            apps/game/*.log
            apps/game/logs/
            apps/game/e2e-artifacts/
          retention-days: 7
          if-no-files-found: warn
          # A failed run re-reaching this always() step re-uploads the same
          # name; overwrite avoids a duplicate-name error on the rerun.
          overwrite: true

  tauri-e2e-full:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ci:full-e2e')) }}
    name: Tauri E2E
    runs-on: ubuntu-latest
    # Must exceed smoke's budget with headroom for the full registry on a
    # cold cache.
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # Dedicated target dir for e2e builds so rust-cache caches it
      # separately from the normal debug target used by other jobs.
      CARGO_TARGET_DIR: apps/game/src-tauri/target-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Shared prefix with tauri-e2e-pr-smoke so this run warms the cache
      # that PR smoke branches restore.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/game/src-tauri -> target-e2e
          prefix-key: tauri-e2e-v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run packaged E2E full registry
        run: xvfb-run -a bun run --cwd apps/game test:e2e:all

      - name: Upload E2E evidence
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tauri-e2e-full
          path: |
            apps/game/*.log
            apps/game/logs/
            apps/game/e2e-artifacts/
          retention-days: 7
          if-no-files-found: warn
          # A failed run re-reaching this always() step re-uploads the same
          # name; overwrite avoids a duplicate-name error on the rerun.
          overwrite: true
