name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-revision-golden:
    name: Content revision golden (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify content revision contract
        run: bunx vitest run --config vitest.scripts.config.ts packages/scripts/compile-scenes/semantic-defaults.test.ts packages/scripts/compile-scenes/save-content-references.test.ts packages/scripts/compile-scenes/save-content-manifest.test.ts

  lint-frontend:
    name: Frontend – check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile scenes
        run: bun run scenes:compile

      - name: Evidence source audit
        run: bun run evidence-sources:audit

      - name: Type-check (svelte-check)
        run: bun run check

      - name: Type-check Tauri e2e specs (tsc)
        run: bun run --cwd apps/game check:e2e

      - name: Type-check scripts (tsc)
        run: bun run check:scripts

      - name: Build frontend
        run: bun run build

  lint-rust:
    name: Rust – check & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/game/src-tauri
            apps/layout-editor/src-tauri

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Cargo check game
        run: cargo check --manifest-path apps/game/src-tauri/Cargo.toml

      - name: Cargo check editor
        run: cargo check --manifest-path apps/layout-editor/src-tauri/Cargo.toml

      - name: Clippy game
        run: cargo clippy --manifest-path apps/game/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Clippy editor
        run: cargo clippy --manifest-path apps/layout-editor/src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      # rustdoc with --document-private-items resolves intra-doc links to
      # pub(super)/private items, so broken doc links (e.g. a `[`Self::foo`]`
      # whose target was relocated out of scope) surface as warnings. -D
      # warnings fails CI on them. Catches the orphaned-intra-doc-link defect
      # class that survived review of HPA-55 (commit f429a95).
      - name: Rustdoc game (deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --document-private-items --manifest-path apps/game/src-tauri/Cargo.toml

      - name: Rustdoc editor (deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --document-private-items --manifest-path apps/layout-editor/src-tauri/Cargo.toml

  unit-tests-frontend:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync SvelteKit generated tsconfig
        run: bun run --cwd apps/game sync

      - name: Run compiler and workspace layout tests
        run: bun run test:scripts

      - name: Run shared package Vitest with coverage
        run: bun run --cwd packages/shared test -- --coverage.enabled

      - name: Run editor Vitest
        run: bun run --cwd apps/layout-editor test

      - name: Run game Vitest with coverage
        run: bun run --cwd apps/game test -- --coverage.enabled

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: |
            apps/game/coverage/lcov.info
            packages/shared/coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: frontend

  unit-tests-rust:
    name: Rust Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/game/src-tauri
            apps/layout-editor/src-tauri

      - name: Install system dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run editor Rust tests
        run: cargo test --manifest-path apps/layout-editor/src-tauri/Cargo.toml

      - name: Generate Rust coverage
        run: cargo llvm-cov --manifest-path apps/game/src-tauri/Cargo.toml --lcov --output-path lcov-rust.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov-rust.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: rust

  e2e-plan:
    name: Plan Tauri E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.plan.outputs.should_run }}
      forced_full: ${{ steps.plan.outputs.forced_full }}
      matrix: ${{ steps.plan.outputs.matrix }}
      expected_chain_ids: ${{ steps.plan.outputs.expected_chain_ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run E2E CI contracts
        run: bun run --cwd apps/game test:e2e:ci-contracts

      - name: Collect changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed_paths="$RUNNER_TEMP/e2e-changed-paths.txt"
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"
          else
            git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > "$changed_paths"
          fi

      - id: plan
        name: Select packaged E2E suites
        env:
          FORCE_FULL_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full-e2e') }}
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-plan"
          selector_args=()
          if [[ "$FORCE_FULL_LABEL" == "true" ]]; then
            selector_args+=(--force-full)
          fi
          node apps/game/scripts/plan-e2e-ci.mjs \
            --changed-paths-file "$RUNNER_TEMP/e2e-changed-paths.txt" \
            --suite-file "$RUNNER_TEMP/e2e-plan/e2e-suites.json" \
            --report-file "$RUNNER_TEMP/e2e-plan/e2e-plan.json" \
            --matrix-file "$RUNNER_TEMP/e2e-plan/e2e-matrix.json" \
            --chain-directory "$RUNNER_TEMP/e2e-plan/chains" \
            --event-name "$GITHUB_EVENT_NAME" \
            --ref "$GITHUB_REF" \
            "${selector_args[@]}"

      - name: Upload E2E plan
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: e2e-plan
          path: ${{ runner.temp }}/e2e-plan/
          retention-days: 7
          if-no-files-found: ignore

  e2e-execution:
    name: Tauri E2E execution (${{ matrix.chainId }})
    needs: e2e-plan
    if: ${{ needs.e2e-plan.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.e2e-plan.outputs.matrix) }}
    env:
      # Dedicated target dir for e2e builds so rust-cache caches it
      # separately from the normal debug target used by other jobs.
      CARGO_TARGET_DIR: apps/game/src-tauri/target-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Initialize chain metrics
        env:
          CHAIN_ID: ${{ matrix.chainId }}
        run: |
          node apps/game/scripts/e2e-ci-metrics.mjs initialize \
            --file "$RUNNER_TEMP/e2e-metrics/$CHAIN_ID.json" \
            --chain-id "$CHAIN_ID"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/game/src-tauri -> target-e2e
          prefix-key: ${{ matrix.cacheKey }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Record setup and restored cache
        env:
          CHAIN_ID: ${{ matrix.chainId }}
          RUST_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          node apps/game/scripts/e2e-ci-metrics.mjs setup \
            --file "$RUNNER_TEMP/e2e-metrics/$CHAIN_ID.json" \
            --cache-directory "$PWD/apps/game/src-tauri/target-e2e" \
            --cache-hit "$RUST_CACHE_HIT"

      - name: Download E2E plan
        uses: actions/download-artifact@v4
        with:
          name: e2e-plan
          path: ${{ runner.temp }}/e2e-plan

      - name: Build Tauri E2E binary
        env:
          CHAIN_ID: ${{ matrix.chainId }}
        run: |
          node apps/game/scripts/e2e-ci-metrics.mjs run \
            --file "$RUNNER_TEMP/e2e-metrics/$CHAIN_ID.json" \
            --stage build \
            -- node apps/game/scripts/build-e2e.mjs

      - name: Run selected Tauri E2E chain
        env:
          CHAIN_ID: ${{ matrix.chainId }}
          SUITE_FILE: ${{ matrix.suiteFile }}
        run: |
          node apps/game/scripts/e2e-ci-metrics.mjs run \
            --file "$RUNNER_TEMP/e2e-metrics/$CHAIN_ID.json" \
            --stage test \
            -- xvfb-run -a node apps/game/scripts/run-save-e2e.mjs \
              --suite-file "$RUNNER_TEMP/e2e-plan/$SUITE_FILE" \
              --chain-id "$CHAIN_ID" \
              --plan-file "$RUNNER_TEMP/e2e-plan/e2e-plan.json" \
              --attempts 2

      - name: Run guarded post-cleanup
        if: ${{ always() }}
        run: |
          while IFS= read -r ownership; do
            node apps/game/scripts/cleanup-e2e-roots.mjs "$ownership"
          done < <(find "$PWD/apps/game/e2e-artifacts/save-e2e/runs" -name run-ownership.json -type f -print 2>/dev/null || true)

      - name: Upload chain evidence
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: ${{ matrix.artifactName }}
          path: |
            apps/game/*.log
            apps/game/logs/
            apps/game/e2e-artifacts/
            ${{ runner.temp }}/e2e-metrics/
          retention-days: 7
          if-no-files-found: warn

  e2e:
    name: Tauri E2E
    needs: [e2e-plan, e2e-execution]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download E2E plan
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: e2e-plan
          path: ${{ runner.temp }}/e2e-plan

      - name: Download chain evidence
        uses: actions/download-artifact@v4
        if: ${{ needs.e2e-plan.outputs.should_run == 'true' }}
        continue-on-error: true
        with:
          pattern: tauri-e2e-*
          path: ${{ runner.temp }}/e2e-results

      - name: Validate E2E manifests and routing
        env:
          PLAN_RESULT: ${{ needs.e2e-plan.result }}
          SHOULD_RUN: ${{ needs.e2e-plan.outputs.should_run }}
          EXECUTION_RESULT: ${{ needs.e2e-execution.result }}
        run: |
          validator_status=0
          node apps/game/scripts/e2e-ci-results.mjs \
            --plan-file "$RUNNER_TEMP/e2e-plan/e2e-plan.json" \
            --results-directory "$RUNNER_TEMP/e2e-results" \
            --analysis-file "$RUNNER_TEMP/e2e-analysis/e2e-analysis.json" || validator_status=$?
          if [[ "$PLAN_RESULT" != "success" ]]; then
            echo "E2E planning did not complete successfully: $PLAN_RESULT"
            exit 1
          fi
          if [[ "$SHOULD_RUN" == "true" && "$EXECUTION_RESULT" != "success" ]]; then
            echo "E2E matrix execution did not complete successfully: $EXECUTION_RESULT"
            exit 1
          fi
          exit "$validator_status"

      - name: Upload E2E aggregate analysis
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tauri-e2e-analysis
          path: ${{ runner.temp }}/e2e-analysis/
          retention-days: 7
          if-no-files-found: warn
