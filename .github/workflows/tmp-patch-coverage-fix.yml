name: Temporary patch coverage fix

on:
  push:
    branches: [codex/hpa-265-beat-85]
    paths:
      - .github/workflows/tmp-patch-coverage-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/hpa-265-beat-85

      - name: Exercise interrogation unlock-context isolation
        shell: python
        run: |
          from pathlib import Path

          path = Path("apps/game/src-tauri/src/game/scenes/interrogation.rs")
          text = path.read_text()

          local_marker = "        let local = NoInterrogationUnlockContext;\n"
          local_assertions = (
              "        assert!(!local.evidence_collected(\"unused\"));\n"
              "        assert!(!local.statement_acquired(\"unused\"));\n"
              "        assert!(!local.question_answered(\"unused\"));\n"
          )
          if local_marker not in text:
              raise SystemExit("authorization-fence local context insertion point not found")
          text = text.replace(local_marker, local_marker + local_assertions, 1)

          story_marker = (
              "        let story_without_grant = StoryAuthorizationContext {\n"
              "            granted: false,\n"
              "            objective_completed: false,\n"
              "        };\n"
          )
          story_assertions = (
              "        assert!(!story_without_grant.fact_asserted(\"unused\"));\n"
              "        assert!(!story_without_grant.question_resolved(\"unused\"));\n"
              "        assert!(!story_without_grant.analysis_scene_completed(\"chapter_1\", \"analysis_scene\"));\n"
              "        assert!(!story_without_grant.analysis_board_completed(\n"
              "            \"chapter_1\",\n"
              "            \"analysis_scene\",\n"
              "            \"board\",\n"
              "        ));\n"
          )
          if story_marker not in text:
              raise SystemExit("authorization-fence story context insertion point not found")
          text = text.replace(story_marker, story_marker + story_assertions, 1)

          p3_marker = "        let local = PhaseP3UnlockContext;\n"
          p3_assertions = (
              "        assert!(!local.evidence_collected(\"unused\"));\n"
              "        assert!(!local.statement_acquired(\"unused\"));\n"
              "        assert!(!local.question_answered(\"unused\"));\n"
          )
          if p3_marker not in text:
              raise SystemExit("hearing-gate local context insertion point not found")
          path.write_text(text.replace(p3_marker, p3_marker + p3_assertions, 1))

      - name: Verify patch
        run: |
          git diff --check
          git diff -- apps/game/src-tauri/src/game/scenes/interrogation.rs

      - name: Commit patch and dispatch CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/src-tauri/src/game/scenes/interrogation.rs
          git rm .github/workflows/tmp-patch-coverage-fix.yml
          git commit -m "test: cover interrogation unlock context isolation"
          git push origin HEAD:codex/hpa-265-beat-85
          gh workflow run ci.yml --ref codex/hpa-265-beat-85
