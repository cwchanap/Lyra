name: E2E Full

# The full packaged E2E registry (about an hour, mostly the production
# journey) runs only when started by hand: Actions tab, "E2E Full",
# Run workflow. CI's smoke job covers pull requests.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-e2e-full:
    name: Tauri E2E
    runs-on: ubuntu-latest
    # Must cover the measured cold path plus the configured retry: ~24 min
    # cold target-e2e build + setup + two ~34-38 min sequential passes +
    # artifact upload (~100 min worst case), with headroom.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # Dedicated target dir for e2e builds so rust-cache caches it
      # separately from the normal debug target used by other jobs.
      CARGO_TARGET_DIR: apps/game/src-tauri/target-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            xvfb

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # shared-key replaces rust-cache's default job-id key component, so
      # this run resolves the same entry CI's PR smoke job restores. Keep
      # both keys identical to ci.yml's smoke job. prefix-key stays the
      # manual bust knob.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/game/src-tauri -> target-e2e
          prefix-key: tauri-e2e-v2
          shared-key: tauri-e2e-v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run packaged E2E full registry
        run: xvfb-run -a bun run --cwd apps/game test:e2e:all

      - name: Upload E2E evidence
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tauri-e2e-full
          path: |
            apps/game/*.log
            apps/game/logs/
            apps/game/e2e-artifacts/
          retention-days: 7
          if-no-files-found: warn
          # A failed run re-reaching this always() step re-uploads the same
          # name; overwrite avoids a duplicate-name error on the rerun.
          overwrite: true
