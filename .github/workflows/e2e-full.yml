name: E2E Full

# The full packaged E2E registry (about an hour, mostly the production
# journey) runs only when started by hand: Actions tab, "E2E Full",
# Run workflow. CI's smoke job covers pull requests.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-e2e-full:
    name: Tauri E2E
    runs-on: ubuntu-latest
    # HPA-831 lengthened the production journey: two accepted local runs
    # took 2h20m-2h26m for that suite alone (ARM, software rendering). The
    # hosted budget must also cover setup, the cold target-e2e build, the
    # remaining suites, and artifact upload — 120 min cannot fit it. The
    # journey runs ONE attempt in its own step: a retry of it alone would
    # not fit this ceiling alongside everything else, and a platform-level
    # kill could take the always() artifact upload with it. 360 is the
    # GitHub-hosted job ceiling.
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      # Dedicated target dir for e2e builds so rust-cache caches it
      # separately from the normal debug target used by other jobs.
      CARGO_TARGET_DIR: apps/game/src-tauri/target-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            xvfb \
            xdotool \
            x11-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # shared-key replaces rust-cache's default job-id key component, so
      # this run resolves the same entry CI's PR smoke job restores. Keep
      # both keys identical to ci.yml's smoke job. prefix-key stays the
      # manual bust knob.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/game/src-tauri -> target-e2e
          prefix-key: tauri-e2e-v2
          shared-key: tauri-e2e-v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the packaged E2E binary
        run: node apps/game/scripts/build-e2e.mjs

      - name: Run packaged E2E suites (production-journey excluded)
        # Keep this suite list in sync with scripts/e2e-suite-registry.mjs —
        # every id except production-journey, which runs once below.
        run: >-
          xvfb-run -a node apps/game/scripts/run-save-e2e.mjs
          --suite smoke --suite gameplay --suite analysis-beat85
          --suite capture-proof --suite save-core --suite save-management
          --suite exit-lifecycle --attempts 2

      - name: Run the production journey once
        # always(): an earlier suite's Red must not skip the journey — its
        # evidence uploads independently. Opt ONLY this step's private
        # xvfb-run display into the scoped XTEST trusted-keys path (HPA-831
        # production-journey focus segment): xdotool/xprop/xdpyinfo prove
        # display privacy, exact process and window ownership before every
        # key and fail closed on any uncertainty. The smoke job and every
        # other suite keep the default synthetic WebDriver keys — no
        # OS-global input without an explicit opt-in.
        if: ${{ always() }}
        env:
          LYRA_E2E_XVFB_TRUSTED_KEYS: "1"
        run: >-
          xvfb-run -a node apps/game/scripts/run-save-e2e.mjs
          --suite production-journey --attempts 1

      - name: Upload E2E evidence
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: tauri-e2e-full
          path: |
            apps/game/*.log
            apps/game/logs/
            apps/game/e2e-artifacts/
          retention-days: 7
          if-no-files-found: warn
          # A failed run re-reaching this always() step re-uploads the same
          # name; overwrite avoids a duplicate-name error on the rerun.
          overwrite: true
