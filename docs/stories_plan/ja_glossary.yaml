    note: The cafe. 雨鐘咖啡館 → カフェ「雨鐘」 or 雨鐘 alone.
  - zh: 吉祥寺
    ja: 吉祥寺
    reading: きちじょうじ
  - zh: 金木犀拿鐵
    ja: 金木犀ラテ
    reading: きんもくせいラテ
  - zh: 雨宮
    ja: 雨宮
    reading: あまみや
    note: Signature on the anonymous message.
  - zh: 如月真白
    ja: 如月真白
    reading: きさらぎ ましろ
  - zh: 青葉記憶研究所
    ja: 青葉記憶研究所
    reading: あおばきおくけんきゅうじょ
  - zh: 證據摘要審查會
    ja: 証拠サマリー審査会
    reading: しょうこサマリーしんさかい
    note: Usually just 審査会 (審查會).
  - zh: 摘要
    ja: サマリー
    note: The KAGAMI evidence summary. Always サマリー, never 要約, so the system's product reads as one thing.
  - zh: 主時間線
    ja: 主タイムライン
    reading: しゅタイムライン
    note: The summary's main timeline. 時間線 alone → タイムライン.
  - zh: 核准片段
    ja: 承認済み抜粋
    reading: しょうにんずみ ばっすい
    note: Record excerpt the review board approves for release. 限定片段 → 限定抜粋. After the first mention in a line, 抜粋 alone is fine.
  - zh: 本機順序
    ja: 本体の記録順
    reading: ほんたいのきろくじゅん
    note: Event order stored on the door-lock unit itself.
  - zh: 合併時間
    ja: 統合時刻
    reading: とうごうじこく
    note: When the summary merged the records; 合併完成的時間 → 統合が完了した時刻. 同步 → 同期, 同步完成 → 同期完了.
  - zh: 憑證
    ja: 認証
    note: Door credential. 員工憑證 → 従業員認証, 外包憑證 → 外注認証, 外部憑證 → 外部認証.
  - zh: 外包
    ja: 外注
    reading: がいちゅう
    note: 外包的人 → 外注の人, 外包帳號 → 外注アカウント.
  - zh: 承包商
    ja: 委託業者
    reading: いたくぎょうしゃ
    note: 承包商動線 → 業者側の動線, 承包帳號 → 業者アカウント.
  - zh: 工單
    ja: 作業票
    reading: さぎょうひょう
    note: 臨時維護工單 → 臨時のメンテナンス作業票.
  - zh: 維護模式
    ja: メンテナンスモード
    note: 維護頁 / 維護頁面 → メンテナンス画面, 維護紀錄冊 → メンテナンス記録簿, 維護紀錄 → メンテナンス記録, 面板 → パネル.
  - zh: 打卡紀錄
    ja: 打刻記録
    reading: だこくきろく
  - zh: 監視器
    ja: 防犯カメラ
    note: 監視器截圖 → 防犯カメラの静止画.
  - zh: 截圖
    ja: スクリーンショット
    note: Kurose may shorten it to スクショ.
  - zh: 鑑識
    ja: 鑑識
    reading: かんしき
  - zh: 固定
    ja: 保全
    reading: ほぜん
    note: Fixing evidence by procedure. 讓鑑識固定 → 鑑識に保全させろ; 正式固定 → 正式に保全.
  - zh: 證物鏈
    ja: 証拠の保管記録
    reading: しょうこのほかんきろく
    note: Chain of custody.
  - zh: 待確認項
    ja: 要確認の項目
    reading: ようかくにんのこうもく
  - zh: 審查會
    ja: 審査会
    reading: しんさかい
  - zh: 辯方
    ja: 弁護側
    reading: べんごがわ
    note: 檢方 → 検察側, 辯方聘任書 → 弁護人の選任書, 法院核准函 → 裁判所の承認書, 第三方資料分析人 → 第三者データ分析人.
  - zh: 主嫌
    ja: 主たる被疑者
    reading: しゅたるひぎしゃ
    note: 嫌疑人 → 被疑者, 主要嫌疑人 → 主たる被疑者.
  - zh: 重新調查
