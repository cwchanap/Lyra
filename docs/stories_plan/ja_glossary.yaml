  - zh: 後場
    ja: バックヤード
    note: 前場 → 店内, 內側倉庫 → 奥の倉庫, 後巷 → 裏路地, 走廊 → 廊下, 後走廊 → 裏の廊下, 後門 → 裏口.
  - zh: 閉店流程
