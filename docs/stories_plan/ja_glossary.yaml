# Japanese glossary and style guide for the locale scripts under
# docs/stories_plan/<chapter>/ja/. Translators follow it; `voice:validate`
# checks that every speaker has a `characters` entry. `reading` is the kana a
# voice needs (it feeds the ElevenLabs pronunciation dictionary later); it is
# never written into a line.
schemaVersion: 1
locale: ja
styleRules:
  - Translate meaning and voice, not word order. Each `ja` is one spoken line that sounds natural to a Japanese player, about as long as the Chinese line, so it fits the same dialogue box and pacing.
  - One entry, one line. Never merge, split or drop entries, and never add stage directions, parentheses, furigana or speaker names inside `ja`.
  - Names and fixed terms come from this glossary, in shinjitai (黒瀬, 高瀬, 片瀬, 増田). Keep the glossary's choice even where another word would also be right; consistency across scenes matters more.
  - Punctuation is Japanese full-width. Quotes are 「」 (nested 『』), the ellipsis is …… and a cut-off line ends in ――. Keep ？ and ！ only where the Chinese has them.
  - Clock times stay in the form the Chinese uses. Digits stay digits (22:58, 23:07:50, 1842); spelled-out Chinese times become Japanese kanji readings (十七點四十二分 → 十七時四十二分, 二十三點零七分五十秒 → 二十三時七分五十秒). The voice step normalizes digits for speech.
  - Latin text that the Chinese keeps (KAGAMI, REPRINT, K., USB, L 型) stays as written; L 型 becomes L字.
  - Address forms follow each character's `register`. By default, use 〜さん for adults by surname, 先生 for a lawyer (早坂律師 → 早坂先生), 刑事 for Kurose (黑瀨刑警 → 黒瀬刑事), 探偵さん for 偵探先生, お母さん when Hayasaka addresses Miyake's mother (阿姨). Soma, Hayasaka and Kamiya say 三宅さん and 増田さん; Takase, Kurose and narration use the bare surname. Soma and Hayasaka name a suspect bare between themselves (北見) but say 北見さん in the hearing.
  - Keep the restraint of the Chinese. No added jokes, slang, dialect, exclamations or role-language (no ござる, no heavy わ/のよ). Narration (旁白) is terse written Japanese in plain form.
  - Do not explain or foreshadow beyond the Chinese line; chapter seals in docs/stories_plan/characters.md still apply.
characters:
  - zh: 相馬律
    ja: 相馬律
    reading: そうま りつ
    firstPerson: 僕
    register: 26-year-old detective. Short conclusions, orderly, no swagger. Casual plain speech with Hayasaka (calls her 早坂さん) and when thinking aloud; polite です/ます with Kurose, clients, witnesses, the clerk and in the review hearing (calls Kamiya 神谷検事 only when the line names her). Gentle plain speech with Miyake Sota.
  - zh: 早坂茜
    ja: 早坂茜
    reading: はやさか あかね
    firstPerson: 私
    register: Defense lawyer in her early thirties. Short, hard, practical; procedural words over slogans. Plain speech with Soma (calls him 相馬), often clipped imperatives (座って。水。). Polite です/ます with clients, the clerk, Kamiya and witnesses. Neutral endings, no feminine softeners.
  - zh: 神谷澪
    ja: 神谷澪
    reading: かみや みお
    firstPerson: 私
    register: Prosecutor presiding over the review hearing. Cool, precise, sentences cleanly closed. Formal です/ます with no contractions and no sentence-final particles; authority comes from calm, never volume or sarcasm. Short procedural rulings may drop to a clipped noun or plain form (始めましょう。/ 本日はここまで。). Calls Soma 相馬さん.
  - zh: 黑瀨徹
    ja: 黒瀬徹
    reading: くろせ とおる
    firstPerson: 俺
    register: Field detective near fifty. Blunt, short, grounded; plain rough speech (〜だ, 〜ん, 受け取らん) without dialect. Not technical. Calls Soma 探偵 when he must address him.
  - zh: 三宅蒼太
    ja: 三宅蒼太
    reading: みやけ そうた
    firstPerson: 僕
    register: Part-time cafe worker in his early twenties. Nervous, trailing sentences, quiet omissions rather than protests. Polite です/ます to Soma (相馬さん), Hayasaka (早坂さん) and the manager (店長); calls his mother 母さん.
  - zh: 三宅母親
    ja: 三宅の母
    reading: みやけのはは
    firstPerson: 私
    register: Miyake's mother. Plain, restrained, everyday detail instead of tears. Polite です/ます to Soma (探偵さん); refers to her son as あの子.
  - zh: 店長高瀨
    ja: 高瀬店長
    reading: たかせ てんちょう
    firstPerson: 私
    register: Rain Bell cafe manager, late thirties to early forties. Tired, everyday, not technical. Light polite speech to Soma and Hayasaka; plain and warm with Miyake, whom she calls 三宅.
  - zh: 片瀨美咲
    ja: 片瀬美咲
    reading: かたせ みさき
    firstPerson: 私
    register: Young cafe employee always racing the last train. Quick, casual-polite (すみません、終電なので). Calls Hayasaka 早坂先生.
  - zh: 增田圭
    ja: 増田圭
    reading: ますだ けい
    firstPerson: 僕
    register: The victim, seen only in the prologue as a quiet regular. Very few words, mild and reserved.
  - zh: 北見修一
    ja: 北見修一
    reading: きたみ しゅういち
    firstPerson: 私
    register: Outsourced data worker in his early forties. Timid, self-protective, mumbled; bitterness in one short line, never a speech. Polite but evasive です/ます; drops to plain speech only when cornered.
  - zh: 書記官
    ja: 書記官
    reading: しょきかん
    firstPerson: 私
    register: Review-board clerk. Formal, procedural keigo, gatekeeping distance.
  - zh: 承包商主管
    ja: 委託業者の主任
    reading: いたくぎょうしゃのしゅにん
    firstPerson: 私
    register: Contractor records supervisor. Bureaucratic, curt です/ます; does exactly his job and no more.
  - zh: 店主
    ja: 店主
    reading: てんしゅ
    firstPerson: 私
    register: Owner of a small stationery and copy shop in the prologue case. Brusque neighborhood shop speech, plain form; softens into an apology at the end.
  - zh: 學生
    ja: 学生
    reading: がくせい
    firstPerson: 僕
    register: Student customer in the prologue case. Casual, a little defensive, then relieved.
  - zh: 路人甲
    ja: 通行人A
    reading: つうこうにん エー
    register: Passer-by reacting to a news board. Casual plain speech.
  - zh: 路人乙
    ja: 通行人B
    reading: つうこうにん ビー
    register: Passer-by reacting to a news board. Casual plain speech.
  - zh: 路人丙
    ja: 通行人C
    reading: つうこうにん シー
    register: Passer-by reacting to a news board. Casual plain speech.
  - zh: 旁白
    ja: ナレーション
    reading: ナレーション
    register: Narration. Terse written Japanese in plain form (〜た / noun endings), present-tense captions where the Chinese is a caption.
