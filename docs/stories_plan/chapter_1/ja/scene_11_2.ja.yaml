lines:
  - id: L001
    speaker: 旁白
    zh: 那天深夜，相馬回到事務所。
    ja: その夜遅く、相馬は事務所に戻った。
  - id: L002
    speaker: 相馬律
    zh: 增田先生……到底想藏什麼。
    ja: 増田さん……いったい何を隠したかったんだ。
    voice:
      clip: ch1_soma_ritsu_0304
  - id: L003
    speaker: 旁白
    zh: 裡頭只有一個檔案。
    ja: 中には、ファイルが一つだけ。
  - id: L004
    speaker: 相馬律
    zh: 加密的。
    ja: 暗号化されてる。
    voice:
      clip: ch1_soma_ritsu_0305
  - id: L005
    speaker: 旁白
    zh: 權限不足。
    ja: 権限不足。
    note: On-screen system message; read flat.
  - id: L006
    speaker: 早坂茜
    zh: 還沒回家？
    ja: まだ帰ってないの？
    note: Over the phone.
    voice:
      clip: ch1_hayasaka_akane_0178
  - id: L007
    speaker: 相馬律
    zh: "增田那支隨身碟的副本，我打開了。"
    ja: "増田さんのUSBメモリの複製、開けた。"
    voice:
      clip: ch1_soma_ritsu_0306
  - id: L008
    speaker: 早坂茜
    zh: 北見的資料？
    ja: 北見のデータ？
    voice:
      clip: ch1_hayasaka_akane_0179
  - id: L009
    speaker: 相馬律
    zh: ……不像。
    ja: ……そうは見えない。
    voice:
      clip: ch1_soma_ritsu_0307
  - id: L010
    speaker: 早坂茜
    zh: 那是什麼？
    ja: じゃあ、何？
    voice:
      clip: ch1_hayasaka_akane_0180
  - id: L011
    speaker: 相馬律
    zh: 我也還不知道。
    ja: 僕にも、まだわからない。
    voice:
      clip: ch1_soma_ritsu_0308
  - id: L012
    speaker: 旁白
    zh: 警方移交清單最後一頁，附著匿名「雨宮」訊息的來源比對。
    ja: 警察の引き継ぎリストの最後のページに、匿名の「雨宮」メッセージの送信元照合が添付されていた。
  - id: L013
    speaker: 早坂茜
    zh: 北見的手機、電腦和承包帳號，都不是發訊來源。
    ja: 北見のスマホも、パソコンも、業者アカウントも、送信元じゃない。
    voice:
      clip: ch1_hayasaka_akane_0181
  - id: L014
    speaker: 相馬律
    zh: ……不是他。
    ja: ……彼じゃない。
    voice:
      clip: ch1_soma_ritsu_0309
  - id: L015
    speaker: 早坂茜
    zh: 來源不明，先按移交紀錄留檔。
    ja: 送信元は不明。ひとまず引き継ぎ記録として保管しておく。
    voice:
      clip: ch1_hayasaka_akane_0182
  - id: L016
    speaker: 旁白
    zh: 地方科技新聞報導雨鐘案與 KAGAMI 外包資料外洩，後續調查已經開始。
    ja: 地元のテックニュースが、雨鐘事件とKAGAMIの外注データ流出を報じた。後続の調査も、すでに始まっている。
  - id: L017
    speaker: 旁白
    zh: 節目接入如月真白的短預告。
    ja: 番組は、如月真白の短い予告に切り替わった。
  - id: L018
    speaker: 旁白
    zh: 如月真白在預告裡說：「下一期，我想回看——2016 年青葉記憶研究所火災。」
    ja: 如月真白は予告でこう語った。「次回、振り返りたいのは――2016年、青葉記憶研究所の火災です。」
    note: Narration quoting Mashiro's bright on-air preview; the dash is a short beat before the subject.
  - id: L019
    speaker: 早坂茜
    zh: 要關掉嗎？
    ja: 消す？
    voice:
      clip: ch1_hayasaka_akane_0183
  - id: L020
    speaker: 相馬律
    zh: 先靜一會。
    ja: 今は、少し静かにしたい。
    voice:
      clip: ch1_soma_ritsu_0310
  - id: L021
    speaker: 旁白
    zh: 事務所的燈熄了，雨鐘門邊的傘架還留著一點微光。
    ja: 事務所の明かりが消え、雨鐘のドア脇の傘立てには、まだかすかな光が残っていた。
