schemaVersion: 1
locale: ja
source: docs/stories_plan/chapter_1/analysis_scene_p1_5.md
lines:
  - id: L001
    speaker: 相馬律
    zh: 先不用猜誰說謊。
    ja: 誰が嘘をついたのか、当て推量はやめましょう。
  - id: L002
    speaker: 相馬律
    zh: 選出能一起解釋這張重印收據的東西，再比對一次。
    ja: この再印刷のレシートをまとめて説明できるものを選んで、もう一度照らし合わせます。
  - id: L003
    speaker: 相馬律
    zh: 收據是真的。
    ja: レシートは本物です。
  - id: L004
    speaker: 相馬律
    zh: 但它記下的是收銀機卡紙後，在十七點四十二分重印的時間。
    ja: ただ、記録されているのは、レジが紙詰まりしたあと、十七時四十二分に再印刷した時刻です。
  - id: L005
    speaker: 相馬律
    zh: 帳本記著十七點三十七分的影印費。
    ja: 帳簿には、十七時三十七分のコピー代が記されています。
  - id: L006
    speaker: 相馬律
    zh: 監視器也看見店主找零後，學生在十七點三十八分離開。
    ja: 防犯カメラにも、店主さんがお釣りを渡し、十七時三十八分に学生さんが店を出るところが映っています。
  - id: L007
    speaker: 相馬律
    zh: 學生付過錢，店主也沒有造假。
    ja: 学生さんは支払っていたし、店主さんも何もごまかしていません。
  - id: L008
    speaker: 相馬律
    zh: 只是兩個人把同一張真的收據，讀成了不同的時間。
    ja: ただ二人が、同じ本物のレシートを、違う時刻として読んでいただけです。
  - id: L009
    speaker: 學生
    zh: ……所以我沒有漏付。
    ja: ……じゃあ、僕は払い忘れてなかったんだ。
  - id: L010
    speaker: 店主
    zh: 是我太快把四十二分當成付款了。對不起。
    ja: 四十二分を支払いの時間だと早合点したのは、私だ。すまなかった。
  - id: L011
    speaker: 早坂茜
    zh: 這份紙本我帶走。小事也要留一個能回頭看的版本。
    ja: この控えは私がもらっていく。小さなことでも、あとで見返せる形で残しておく。
  - id: L012
    speaker: 相馬律
    zh: 你連這種小事都留？
    ja: こんな小さなことまで残すのか？
  - id: L013
    speaker: 早坂茜
    zh: 小事才最容易被當成沒必要留。
    ja: 小さなことほど、残さなくていいと思われやすい。
  - id: L014
    speaker: 旁白
    zh: 整理板上的練習卡隨著這件小委託收起，沒有被放進任何卷宗。
    ja: 整理ボードの練習カードは、この小さな依頼とともに片付けられ、どの事件ファイルにも綴じられなかった。
