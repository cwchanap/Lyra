# ja script for docs/stories_plan/chapter_1/investigation_scene_7.md.
# Each entry is linked to its scene line by `id` (the line's {#L012} tag);
# `speaker`, `expression` and `zh` record what was translated. Edit `ja`,
# `note`, `voice.direction` and `voice.tts` only. After the scene changes, run
# `bun run voice:sync <chapter>`, then `bun run voice:validate <chapter>`.
schemaVersion: 1
locale: ja
source: docs/stories_plan/chapter_1/investigation_scene_7.md
lines:
  - id: L001
    speaker: 相馬律
    zh: 雨比昨晚還大。站一下，讓呼吸順過來。
    ja: 雨、昨夜より強いな。少し止まって、息を整える。
    voice:
      clip: ch1_soma_ritsu_0146
  - id: L002
    speaker: 早坂茜
    zh: 濕成這樣，鑑識那邊也快收了。趁還沒收，把後巷這條走完。
    ja: ここまで濡れたら、鑑識もじき引き上げる。その前に、裏路地の動線を歩き切ろう。
    voice:
      clip: ch1_hayasaka_akane_0067
  - id: L003
    speaker: 相馬律
    zh: 前場那條是三宅的。後巷這條，摘要只當旁註。
    ja: 店内側の動線は三宅さんのもの。裏路地のほうは、サマリーじゃ注記扱いだった。
    voice:
      clip: ch1_soma_ritsu_0147
  - id: L004
    speaker: 早坂茜
    zh: 旁註不代表不存在。進去走完。
    ja: 注記だからって、存在しないわけじゃない。中まで歩いて。
    voice:
      clip: ch1_hayasaka_akane_0068
  - id: L005
    speaker: 黑瀨徹
    zh: 你們要看摘要漏掉的動線？就是這裡。
    ja: サマリーが取りこぼした動線を見たいんだろ？ここだ。
    voice:
      clip: ch1_kurose_toru_0002
  - id: L006
    speaker: 黑瀨徹
    zh: 進來看。外面雨大。
    ja: 入って見ろ。外は雨がひどい。
    voice:
      clip: ch1_kurose_toru_0003
  - id: L087
    speaker: 相馬律
    zh: 摘要裡的死亡和進場時間，站不住了。
    ja: サマリーにある死亡時刻と入室時刻は、もう成り立たない。
    voice:
      clip: ch1_soma_ritsu_0148
  - id: L088
    speaker: 早坂茜
    zh: 水痕和出杯紀錄都比摘要更早。
    ja: 水の跡と抽出記録は、どっちもサマリーより早い。
    voice:
      clip: ch1_hayasaka_akane_0069
  - id: L089
    speaker: 相馬律
    zh: 可能有第三個人，比三宅更早就進來了。
    ja: 三宅さんより先に、三人目が入っていたのかもしれない。
    voice:
      clip: ch1_soma_ritsu_0149
  - id: L090
    speaker: 黑瀨徹
    zh: 截圖我不收。要往下走，就讓鑑識把這些一條條固定。
    ja: スクショは受け取らん。先へ進みたきゃ、鑑識にこいつを一つずつ保全させろ。
    voice:
      clip: ch1_kurose_toru_0004
  - id: L007
    speaker: 相馬律
    zh: 有一則署名雨宮的匿名訊息，只有一句話和一張圖。
    ja: 雨宮と署名した匿名メッセージが一通。一文と、画像が一枚だけだ。
    voice:
      clip: ch1_soma_ritsu_0150
  - id: L008
    speaker: 早坂茜
    zh: 別急著回。先看現場對不對得上。
    ja: 返信は急がないで。まず、現場と合うかどうか見る。
    voice:
      clip: ch1_hayasaka_akane_0070
  - id: L009
    speaker: 相馬律
    zh: 只有這句，還有一張縮圖。
    ja: この一文だけ。あとはサムネイルが一枚。
    voice:
      clip: ch1_soma_ritsu_0151
  - id: L010
    speaker: 黑瀨徹
    zh: 匿名訊息十條有九條是鬧事。剩下一條也未必幫得上忙。
    ja: 匿名のメッセージなんて、十件のうち九件はいたずらだ。残り一件も、役に立つとは限らん。
    voice:
      clip: ch1_kurose_toru_0005
  - id: L011
    speaker: 早坂茜
    zh: 不是核准片段，像某個外包縮圖板流出的一角。
    ja: 承認済み抜粋じゃない。どこかの外注のサムネイル一覧から漏れた切れ端に見える。
    voice:
      clip: ch1_hayasaka_akane_0071
  - id: L012
    speaker: 相馬律
    zh: 不像案發前的警告。也不是剛發現屍體時送來的。
    ja: 事件前の警告とは思えない。遺体が見つかった直後に届いたわけでもない。
    voice:
      clip: ch1_soma_ritsu_0152
  - id: L013
    speaker: 相馬律
    zh: 縮圖裡就是這塊墊子，水痕位置也對得上。
    ja: サムネイルに写ってるのは、このマットだ。水の跡の位置も合ってる。
    voice:
      clip: ch1_soma_ritsu_0153
  - id: L014
    speaker: 早坂茜
    zh: 它在警方把儲藏入口照片匯進摘要後才送來。
    ja: 届いたのは、警察が倉庫入口の写真をサマリーに取り込んだあと。
    voice:
      clip: ch1_hayasaka_akane_0072
  - id: L015
    speaker: 相馬律
    zh: 縮圖只拍到墊子、水痕和一角傘套。
    ja: 縮小画像に写っているのは、マットと水の跡と、傘袋の端だけだ。
    voice:
      clip: ch1_soma_ritsu_0154
  - id: L016
    speaker: 黑瀨徹
    zh: 今晚的水痕不能算，雨沒停過，這一天也有人進出。要比，就比案發那晚的初勘照片。
    ja: 今夜の水の跡は使えない。雨はやんでないし、今日一日、人の出入りもあった。比べるなら、事件の夜の初動写真だ。
    voice:
      clip: ch1_kurose_toru_0006
  - id: L017
    speaker: 黑瀨徹
    zh: 雨大的夜，店裡總有人把傘套掛錯地方。明早開門，還得一個個分。
    ja: 雨のひどい夜は、決まって誰かが傘袋を違う場所に掛ける。明日の朝、開店したら一つずつ仕分けだ。
    voice:
      clip: ch1_kurose_toru_0007
  - id: L018
    speaker: 早坂茜
    zh: 明早還是得開門。
    ja: それでも明日の朝は、店を開けなきゃならない。
    voice:
      clip: ch1_hayasaka_akane_0073
  - id: L019
    speaker: 相馬律
    zh: 雨下成這樣，什麼都會被沖走。
    ja: こんなに降ったら、何もかも流されてしまう。
    voice:
      clip: ch1_soma_ritsu_0155
  - id: L020
    speaker: 早坂茜
    zh: 先看地上的。還沒被沖乾淨的，才是線索。
    ja: まず地面を見て。流されきってないものが、手がかりになる。
    voice:
      clip: ch1_hayasaka_akane_0074
  - id: L021
    speaker: 相馬律
    zh: 片瀨美咲的杯子還在。拖鞋也磨薄了。
    ja: 片瀬美咲さんのカップがまだある。スリッパもすり減ってる。
    voice:
      clip: ch1_soma_ritsu_0156
  - id: L022
    speaker: 早坂茜
    zh: 站一整天的人，鞋比什麼都先壞。
    ja: 一日中立ってる人は、何より先に靴がだめになる。
    voice:
      clip: ch1_hayasaka_akane_0075
  - id: L023
    speaker: 相馬律
    zh: 裡面還沒看。
    ja: 奥はまだ見てない。
    voice:
      clip: ch1_soma_ritsu_0157
  - id: L024
    speaker: 黑瀨徹
    zh: 感應燈在。進去吧。
    ja: センサーライトがある。入るぞ。
    voice:
      clip: ch1_kurose_toru_0008
  - id: L025
    speaker: 黑瀨徹
    zh: 關店前的單子最容易亂。人都盯著門鎖、垃圾和末班車。
    ja: 閉店前の伝票は一番散らかる。みんな、戸締まりとゴミと終電で頭がいっぱいだ。
    voice:
      clip: ch1_kurose_toru_0009
  - id: L026
    speaker: 黑瀨徹
    zh: 誰還記得杯子喝沒喝完。
    ja: カップが空になったかどうかなんて、誰も覚えちゃいない。
    voice:
      clip: ch1_kurose_toru_0010
  - id: L027
    speaker: 早坂茜
    zh: 所以店裡才有這麼多寫到一半的備註。
    ja: だから店に、書きかけのメモがこんなに残ってる。
    voice:
      clip: ch1_hayasaka_akane_0076
  - id: L028
    speaker: 相馬律
    zh: 摘要裡那些時間，都是從這裡來的。
    ja: サマリーの時刻は、全部ここから来てる。
    voice:
      clip: ch1_soma_ritsu_0158
  - id: L029
    speaker: 相馬律
    zh: 入口這台。店長說它走得準，就是秒針常頓一下。
    ja: 入口のこの時計だ。店長は、時間は合ってるけど、秒針がよく一瞬止まるって言ってた。
    voice:
      clip: ch1_soma_ritsu_0159
  - id: L030
    speaker: 黑瀨徹
    zh: 開店的人記得這種東西。客人不會走到這。
    ja: 店をやってる人間は、こういうのを覚えてる。客はここまで来ない。
    voice:
      clip: ch1_kurose_toru_0011
  - id: L031
    speaker: 相馬律
    zh: 手機掉在這。最後一則通知，大概 22:58。
    ja: スマホはここに落ちてた。最後の通知は、22:58ごろ。
    voice:
      clip: ch1_soma_ritsu_0160
  - id: L032
    speaker: 早坂茜
    zh: 跟掛鐘的 22:59 幾乎貼在一起。
    ja: 掛け時計の22:59と、ほとんど重なる。
    voice:
      clip: ch1_hayasaka_akane_0077
  - id: L033
    speaker: 黑瀨徹
    zh: 這種罐，店裡用到字都磨掉。明天還要補豆，誰也不會特地換。
    ja: この手の缶は、字が擦り切れるまで使う。明日も豆を足すんだ、わざわざ替える奴はいない。
    voice:
      clip: ch1_kurose_toru_0012
  - id: L034
    speaker: 早坂茜
    zh: 小店就是這樣。能用的東西，總要撐到用不動。
    ja: 小さな店はそういうもの。使えるものは、使えなくなるまで使う。
    voice:
      clip: ch1_hayasaka_akane_0078
  - id: L035
    speaker: 相馬律
    zh: 書背磨成這樣，放很久了。
    ja: 背表紙がこんなにすり減ってる。長いこと置いてあったんだな。
    voice:
      clip: ch1_soma_ritsu_0161
  - id: L036
    speaker: 黑瀨徹
    zh: 增田等人的時候會看書？
    ja: 増田は、人を待つあいだに本を読むのか？
    voice:
      clip: ch1_kurose_toru_0013
  - id: L037
    speaker: 相馬律
    zh: 可能。跟案子對不上，先放著。
    ja: かもしれません。事件とはつながらないので、置いておきます。
    voice:
      clip: ch1_soma_ritsu_0162
  - id: L038
    speaker: 相馬律
    zh: 從這裡……看不到裡面。
    ja: ここからだと……奥が見えない。
    voice:
      clip: ch1_soma_ritsu_0163
  - id: L039
    speaker: 早坂茜
    zh: 高貨架擋死了視線。
    ja: 背の高い棚が、視線を完全に塞いでる。
    voice:
      clip: ch1_hayasaka_akane_0079
  - id: L040
    speaker: 相馬律
    zh: 所以他站在這，不代表他知道屍體在裡面。
    ja: だから三宅さんがここに立ってても、奥に遺体があると知ってたことにはならない。
    voice:
      clip: ch1_soma_ritsu_0164
  - id: L041
    speaker: 早坂茜
    zh: 只能說他看不見。不能說他全程不在場。
    ja: 言えるのは、見えなかったってことだけ。ずっとその場にいなかったとは言えない。
    voice:
      clip: ch1_hayasaka_akane_0080
  - id: L042
    speaker: 相馬律
    zh: 擦痕比三宅平常的動線更往裡。
    ja: 擦れた跡が、三宅さんのいつもの動線より奥にある。
    voice:
      clip: ch1_soma_ritsu_0165
  - id: L043
    speaker: 黑瀨徹
    zh: 只說有人急著在這轉彎。是誰，得再對。
    ja: わかるのは、誰かが急いでここを曲がったってことだけだ。誰なのかは、まだ突き合わせが要る。
    voice:
      clip: ch1_kurose_toru_0014
  - id: L044
    speaker: 相馬律
    zh: 前場對帳卡住，片瀨美咲趕末班車，漏了紀錄冊確認。
    ja: 店内でレジ締めが手間取って、片瀬美咲さんは終電に急いでた。記録簿の確認が抜けた。
    voice:
      clip: ch1_soma_ritsu_0166
  - id: L045
    speaker: 早坂茜
    zh: 店長為了白板上沒勾的項目走到後場。
    ja: ホワイトボードにチェックのない項目があって、店長はバックヤードへ向かった。
    voice:
      clip: ch1_hayasaka_akane_0081
  - id: L046
    speaker: 相馬律
    zh: 燈一亮，高貨架後先露出增田的鞋尖。
    ja: 明かりがついて、背の高い棚の陰から、まず増田さんの靴の先がのぞいた。
    voice:
      clip: ch1_soma_ritsu_0167
  - id: L047
    speaker: 早坂茜
    zh: 流程漏掉，發現就晚到 23:20。
    ja: 作業が抜けたから、発見が23:20までずれ込んだ。
    voice:
      clip: ch1_hayasaka_akane_0082
  - id: L048
    speaker: 黑瀨徹
    zh: 法醫初步。後頭部鈍器傷。死亡時間給的是一段範圍。
    ja: 検視の初見だ。後頭部に鈍器による傷。死亡時刻は幅で出てる。
    voice:
      clip: ch1_kurose_toru_0015
  - id: L049
    speaker: 相馬律
    zh: 範圍。不是某一分鐘。
    ja: 幅、ですか。何時何分ではなく。
    voice:
      clip: ch1_soma_ritsu_0168
  - id: L050
    speaker: 黑瀨徹
    zh: 對。但那段範圍，跟 22:58 那個衝突點，不衝突。我只能給你這些。
    ja: そうだ。だがその幅は、22:58の争いの時刻と食い違わない。俺から渡せるのはこれだけだ。
    voice:
      clip: ch1_kurose_toru_0016
  - id: L051
    speaker: 黑瀨徹
    zh: 店長說，她聽到一聲悶響。但那台咖啡機排氣的時候，也常那樣。
    ja: 店長は、鈍い音を一度聞いたと言ってる。だが、あのコーヒーマシンも排気のとき、よくああいう音を立てる。
    voice:
      clip: ch1_kurose_toru_0017
  - id: L052
    speaker: 相馬律
    zh: 所以悶響被蓋過去了。
    ja: じゃあ、その音はかき消されたんですね。
    voice:
      clip: ch1_soma_ritsu_0169
  - id: L053
    speaker: 黑瀨徹
    zh: 兩個來源。一個是咖啡機排氣，一個是收銀抽屜的硬幣盤。
    ja: 音の出どころは二つ。コーヒーマシンの排気と、レジの引き出しの小銭トレーだ。
    voice:
      clip: ch1_kurose_toru_0018
  - id: L054
    speaker: 黑瀨徹
    zh: 別問我更多。聲音這種事，要用就讓鑑識去固定。
    ja: それ以上は聞くな。音の件を使いたきゃ、鑑識に保全させろ。
    voice:
      clip: ch1_kurose_toru_0019
  - id: L055
    speaker: 相馬律
    zh: 黑瀨刑警，你每到一個地方，都先看地？
    ja: 黒瀬刑事は、どこに行ってもまず地面を見るんですか？
    voice:
      clip: ch1_soma_ritsu_0170
  - id: L056
    speaker: 黑瀨徹
    zh: 一雙鞋撐不過半年。看地看出來的。
    ja: 靴は一足、半年ももたん。地面ばかり見て歩いてきたからな。
    voice:
      clip: ch1_kurose_toru_0020
  - id: L057
    speaker: 黑瀨徹
    zh: 二十年了。回家也改不掉。
    ja: 二十年だ。家に帰っても抜けん。
    voice:
      clip: ch1_kurose_toru_0021
  - id: L058
    speaker: 早坂茜
    zh: 職業病。
    ja: 職業病。
    voice:
      clip: ch1_hayasaka_akane_0083
  - id: L059
    speaker: 黑瀨徹
    zh: 地不會替人圓話。看久了，就信這個。
    ja: 地面は人の話を取り繕っちゃくれん。長く見てると、こっちを信じるようになる。
    voice:
      clip: ch1_kurose_toru_0022
  - id: L060
    speaker: 相馬律
    zh: 刑警，你晚餐就吃那個？
    ja: 刑事、夕飯はそれですか？
    voice:
      clip: ch1_soma_ritsu_0171
  - id: L061
    speaker: 黑瀨徹
    zh: 便利商店的飯糰。站著吃，五分鐘解決。
    ja: コンビニのおにぎりだ。立って食えば、五分で済む。
    voice:
      clip: ch1_kurose_toru_0023
  - id: L062
    speaker: 黑瀨徹
    zh: 夜班的人不挑嘴。能吞下去就行。
    ja: 夜勤の人間は、好き嫌いを言わん。飲み込めりゃそれでいい。
    voice:
      clip: ch1_kurose_toru_0024
  - id: L063
    speaker: 早坂茜
    zh: ……至少坐下來吃。
    ja: ……せめて座って食べてください。
    voice:
      clip: ch1_hayasaka_akane_0084
  - id: L064
    speaker: 黑瀨徹
    zh: 坐下就會想睡。站著比較清醒。
    ja: 座ると眠くなる。立ってるほうが頭が冴える。
    voice:
      clip: ch1_kurose_toru_0025
  - id: L065
    speaker: 黑瀨徹
    zh: 久了，胃已經不知道什麼叫餓了。
    ja: 続けてるうちに、胃が空腹ってもんを忘れちまった。
    voice:
      clip: ch1_kurose_toru_0026
  - id: L066
    speaker: 相馬律
    zh: 一句話加一張縮圖。沒指名要我看哪裡。
    ja: 一文と、サムネイルが一枚。どこを見ろとも書いてない。
    voice:
      clip: ch1_soma_ritsu_0172
  - id: L069
    speaker: 相馬律
    zh: 墊子、水痕，都對得上。
    ja: マットも、水の跡も、合ってる。
    voice:
      clip: ch1_soma_ritsu_0174
  - id: L070
    speaker: 黑瀨徹
    zh: 那晚 23:34 拍的時候，它就已經乾了一半。
    ja: あの夜、23時34分に撮った時点で、もう半分乾いてた。
    voice:
      clip: ch1_kurose_toru_0027
  - id: L071
    speaker: 相馬律
    zh: 這個還在滴水。
    ja: これは、まだ滴ってる。
    voice:
      clip: ch1_soma_ritsu_0175
  - id: L072
    speaker: 早坂茜
    zh: 傘套乾得慢，排不出先後。只說明有人走過後巷。
    ja: 傘袋は乾きにくいから、前後は決められない。裏路地を誰かが通ったってことだけ。
    voice:
      clip: ch1_hayasaka_akane_0086
  - id: L073
    speaker: 相馬律
    zh: 這不能告訴我們他幾點死。
    ja: これじゃ、増田さんが何時に死んだかはわからない。
    voice:
      clip: ch1_soma_ritsu_0176
  - id: L074
    speaker: 早坂茜
    zh: 但能告訴我們，那個人不是 23:08 之後才出現。
    ja: でも、その人物が23:08より後に現れたんじゃないことはわかる。
    voice:
      clip: ch1_hayasaka_akane_0087
  - id: L075
    speaker: 相馬律
    zh: 22:59。
    ja: 22:59。
    note: Read off the stopped wall clock's hands.
    voice:
      clip: ch1_soma_ritsu_0177
  - id: L076
    speaker: 黑瀨徹
    zh: 鐘是被撞停的，不是壞的。
    ja: 時計は衝撃で止まったんだ。壊れてたわけじゃない。
    voice:
      clip: ch1_kurose_toru_0028
  - id: L078
    speaker: 早坂茜
    zh: 22:58 那則是他最後點開的。之後手機沒再被解鎖，後面的訊息都沒讀。他那刻就停手了。
    ja: 22:58のメッセージが、最後に開かれたもの。そのあとスマホは一度もロック解除されてなくて、残りは未読のまま。彼はその時点で手を止めたんだ。
    voice:
      clip: ch1_hayasaka_akane_0088
  - id: L079
    speaker: 相馬律
    zh: 擦過，罐口還凹了。
    ja: 拭いた跡がある。缶の口もへこんでる。
    voice:
      clip: ch1_soma_ritsu_0179
  - id: L080
    speaker: 黑瀨徹
    zh: 順手抄起來就能打人。沒那麼玄。
    ja: とっさにつかめば、人を殴れる。そんな大層な話じゃない。
    voice:
      clip: ch1_kurose_toru_0029
  - id: L081
    speaker: 相馬律
    zh: 是範圍，不是某一分鐘。
    ja: 幅だ。何時何分じゃない。
    voice:
      clip: ch1_soma_ritsu_0180
  - id: L083
    speaker: 相馬律
    zh: 從那個點，看不到屍體。
    ja: あの位置からは、遺体は見えない。
    voice:
      clip: ch1_soma_ritsu_0181
  - id: L085
    speaker: 相馬律
    zh: 23:20 才發現，原來是白板上那條沒做完的流程。
    ja: 発見が23:20だったのは、ホワイトボードのやり残した作業のせいだったのか。
    voice:
      clip: ch1_soma_ritsu_0182
