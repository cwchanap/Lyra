schemaVersion: 1
locale: ja
source: docs/stories_plan/chapter_1/investigation_scene_7.md
lines:
  - id: L001
    speaker: 相馬律
    zh: 雨比昨晚還大。站一下，讓呼吸順過來。
    ja: 雨、昨夜より強いな。少し止まって、息を整える。
  - id: L002
    speaker: 早坂茜
    zh: 濕成這樣，鑑識那邊也快收了。趁還沒收，把後巷這條走完。
    ja: ここまで濡れたら、鑑識もじき引き上げる。その前に、裏路地の動線を歩き切ろう。
  - id: L003
    speaker: 相馬律
    zh: 前場那條是三宅的。後巷這條，摘要只當旁註。
    ja: 店内側の動線は三宅さんのもの。裏路地のほうは、サマリーじゃ注記扱いだった。
  - id: L004
    speaker: 早坂茜
    zh: 旁註不代表不存在。進去走完。
    ja: 注記だからって、存在しないわけじゃない。中まで歩いて。
  - id: L005
    speaker: 黑瀨徹
    zh: 你們要看摘要漏掉的動線？就是這裡。
    ja: サマリーが取りこぼした動線を見たいんだろ？ここだ。
  - id: L006
    speaker: 黑瀨徹
    zh: 進來看。外面雨大。
    ja: 入って見ろ。外は雨がひどい。
  - id: L087
    speaker: 相馬律
    zh: 摘要裡的死亡和進場時間，站不住了。
    ja: サマリーにある死亡時刻と入室時刻は、もう成り立たない。
  - id: L088
    speaker: 早坂茜
    zh: 水痕、傘套、出杯紀錄，全比摘要更早。
    ja: 水の跡、傘袋、抽出記録。どれもサマリーより早い。
  - id: L089
    speaker: 相馬律
    zh: 可能有第三個人，比三宅更早就進來了。
    ja: 三宅さんより先に、三人目が入っていたのかもしれない。
  - id: L090
    speaker: 黑瀨徹
    zh: 截圖我不收。要往下走，就讓鑑識把這些一條條固定。
    ja: スクショは受け取らん。先へ進みたきゃ、鑑識にこいつを一つずつ保全させろ。
  - id: L007
    speaker: 相馬律
    zh: 有一則署名雨宮的匿名訊息，只有一句話和一張圖。
    ja: 雨宮と署名した匿名メッセージが一通。一文と、画像が一枚だけだ。
  - id: L008
    speaker: 早坂茜
    zh: 別急著回。先看現場對不對得上。
    ja: 返信は急がないで。まず、現場と合うかどうか見る。
  - id: L009
    speaker: 相馬律
    zh: 只有這句，還有一張縮圖。
    ja: この一文だけ。あとはサムネイルが一枚。
  - id: L010
    speaker: 黑瀨徹
    zh: 匿名訊息十條有九條是鬧事。剩下一條也未必幫得上忙。
    ja: 匿名のメッセージなんて、十件のうち九件はいたずらだ。残り一件も、役に立つとは限らん。
  - id: L011
    speaker: 早坂茜
    zh: 不是核准片段，像某個外包縮圖板流出的一角。
    ja: 承認済み抜粋じゃない。どこかの外注のサムネイル一覧から漏れた切れ端に見える。
  - id: L012
    speaker: 相馬律
    zh: 不像案發前的警告。也不是剛發現屍體時送來的。
    ja: 事件前の警告とは思えない。遺体が見つかった直後に届いたわけでもない。
  - id: L013
    speaker: 相馬律
    zh: 縮圖裡就是這塊墊子，水痕位置也對得上。
    ja: サムネイルに写ってるのは、このマットだ。水の跡の位置も合ってる。
  - id: L014
    speaker: 早坂茜
    zh: 它在警方把儲藏入口照片匯進摘要後才送來。
    ja: 届いたのは、警察が倉庫入口の写真をサマリーに取り込んだあと。
  - id: L015
    speaker: 相馬律
    zh: 對方看見的是資料缺口，不是整件事的答案。
    ja: 相手が見たのはデータの穴だ。事件全体の答えじゃない。
  - id: L016
    speaker: 黑瀨徹
    zh: 水痕不像剛踩的。邊緣都收乾了。
    ja: 水の跡は、さっき踏んだもんじゃない。縁がもう乾いてる。
  - id: L017
    speaker: 黑瀨徹
    zh: 雨大的夜，店裡總有人把傘套掛錯地方。明早開門，還得一個個分。
    ja: 雨のひどい夜は、決まって誰かが傘袋を違う場所に掛ける。明日の朝、開店したら一つずつ仕分けだ。
  - id: L018
    speaker: 早坂茜
    zh: 明早還是得開門。
    ja: それでも明日の朝は、店を開けなきゃならない。
  - id: L019
    speaker: 相馬律
    zh: 雨下成這樣，什麼都會被沖走。
    ja: こんなに降ったら、何もかも流されてしまう。
  - id: L020
    speaker: 早坂茜
    zh: 先看地上的。還沒被沖乾淨的，才是線索。
    ja: まず地面を見て。流されきってないものが、手がかりになる。
  - id: L021
    speaker: 相馬律
    zh: 片瀨美咲的杯子還在。拖鞋也磨薄了。
    ja: 片瀬美咲さんのカップがまだある。スリッパもすり減ってる。
  - id: L022
    speaker: 早坂茜
    zh: 站一整天的人，鞋比什麼都先壞。
    ja: 一日中立ってる人は、何より先に靴がだめになる。
  - id: L023
    speaker: 相馬律
    zh: 裡面還沒看。
    ja: 奥はまだ見てない。
  - id: L024
    speaker: 黑瀨徹
    zh: 感應燈在。進去吧。
    ja: センサーライトがある。入るぞ。
  - id: L025
    speaker: 黑瀨徹
    zh: 關店前的單子最容易亂。人都盯著門鎖、垃圾和末班車。
    ja: 閉店前の伝票は一番散らかる。みんな、戸締まりとゴミと終電で頭がいっぱいだ。
  - id: L026
    speaker: 黑瀨徹
    zh: 誰還記得杯子喝沒喝完。
    ja: カップが空になったかどうかなんて、誰も覚えちゃいない。
  - id: L027
    speaker: 早坂茜
    zh: 所以店裡才有這麼多寫到一半的備註。
    ja: だから店に、書きかけのメモがこんなに残ってる。
  - id: L028
    speaker: 相馬律
    zh: 摘要裡那些時間，都是從這裡來的。
    ja: サマリーの時刻は、全部ここから来てる。
  - id: L029
    speaker: 相馬律
    zh: 入口這台。店長說它常慢。
    ja: 入口のこの時計だ。店長がよく遅れるって言ってた。
  - id: L030
    speaker: 黑瀨徹
    zh: 開店的人記得這種東西。客人不會走到這。
    ja: 店をやってる人間は、こういうのを覚えてる。客はここまで来ない。
  - id: L031
    speaker: 相馬律
    zh: 手機掉在這。最後一則通知，大概 22:58。
    ja: スマホはここに落ちてた。最後の通知は、22:58ごろ。
  - id: L032
    speaker: 早坂茜
    zh: 跟掛鐘的 22:59 幾乎貼在一起。
    ja: 掛け時計の22:59と、ほとんど重なる。
  - id: L033
    speaker: 黑瀨徹
    zh: 這種罐，店裡用到字都磨掉。明天還要補豆，誰也不會特地換。
    ja: この手の缶は、字が擦り切れるまで使う。明日も豆を足すんだ、わざわざ替える奴はいない。
  - id: L034
    speaker: 早坂茜
    zh: 小店就是這樣。能用的東西，總要撐到用不動。
    ja: 小さな店はそういうもの。使えるものは、使えなくなるまで使う。
  - id: L035
    speaker: 相馬律
    zh: 書背磨成這樣，放很久了。
    ja: 背表紙がこんなにすり減ってる。長いこと置いてあったんだな。
  - id: L036
    speaker: 黑瀨徹
    zh: 增田等人的時候會看書？
    ja: 増田は、人を待つあいだに本を読むのか？
  - id: L037
    speaker: 相馬律
    zh: 可能。跟案子對不上，先放著。
    ja: かもしれません。事件とはつながらないので、置いておきます。
  - id: L038
    speaker: 相馬律
    zh: 從這裡……看不到裡面。
    ja: ここからだと……奥が見えない。
  - id: L039
    speaker: 早坂茜
    zh: 高貨架擋死了視線。
    ja: 背の高い棚が、視線を完全に塞いでる。
  - id: L040
    speaker: 相馬律
    zh: 所以他站在這，不代表他知道屍體在裡面。
    ja: だから三宅さんがここに立ってても、奥に遺体があると知ってたことにはならない。
  - id: L041
    speaker: 早坂茜
    zh: 只能說他看不見。不能說他全程不在場。
    ja: 言えるのは、見えなかったってことだけ。ずっとその場にいなかったとは言えない。
  - id: L042
    speaker: 相馬律
    zh: 擦痕比三宅平常的動線更往裡。
    ja: 擦れた跡が、三宅さんのいつもの動線より奥にある。
  - id: L043
    speaker: 黑瀨徹
    zh: 只說有人急著在這轉彎。是誰，得再對。
    ja: わかるのは、誰かが急いでここを曲がったってことだけだ。誰なのかは、まだ突き合わせが要る。
  - id: L044
    speaker: 相馬律
    zh: 前場對帳卡住，片瀨美咲趕末班車，漏了紀錄冊確認。
    ja: 店内でレジ締めが手間取って、片瀬美咲さんは終電に急いでた。記録簿の確認が抜けた。
  - id: L045
    speaker: 早坂茜
    zh: 店長為了白板上沒勾的項目走到後場。
    ja: ホワイトボードにチェックのない項目があって、店長はバックヤードへ向かった。
  - id: L046
    speaker: 相馬律
    zh: 燈一亮，高貨架後先露出增田的鞋尖。
    ja: 明かりがついて、背の高い棚の陰から、まず増田さんの靴の先がのぞいた。
  - id: L047
    speaker: 早坂茜
    zh: 流程漏掉，發現就晚到 23:20。
    ja: 作業が抜けたから、発見が23:20までずれ込んだ。
  - id: L048
    speaker: 黑瀨徹
    zh: 法醫初步。後頭部鈍器傷。死亡時間給的是一段範圍。
    ja: 検視の初見だ。後頭部に鈍器による傷。死亡時刻は幅で出てる。
  - id: L049
    speaker: 相馬律
    zh: 範圍。不是某一分鐘。
    ja: 幅、ですか。何時何分ではなく。
  - id: L050
    speaker: 黑瀨徹
    zh: 對。但那段範圍，跟 22:58 那個衝突點，不衝突。我只能給你這些。
    ja: そうだ。だがその幅は、22:58の争いの時刻と食い違わない。俺から渡せるのはこれだけだ。
  - id: L051
    speaker: 黑瀨徹
    zh: 店長說，她聽到一聲悶響。但那台洗杯機排氣的時候，也常那樣。
    ja: 店長は、鈍い音を一度聞いたと言ってる。だが、あの食洗機も排気のとき、よくああいう音を立てる。
  - id: L052
    speaker: 相馬律
    zh: 所以悶響被蓋過去了。
    ja: じゃあ、その音はかき消されたんですね。
  - id: L053
    speaker: 黑瀨徹
    zh: 兩個來源。一個是洗杯機排氣，一個是收銀抽屜的硬幣盤。
    ja: 音の出どころは二つ。食洗機の排気と、レジの引き出しの小銭トレーだ。
  - id: L054
    speaker: 黑瀨徹
    zh: 別問我更多。聲音這種事，要用就讓鑑識去固定。
    ja: それ以上は聞くな。音の件を使いたきゃ、鑑識に保全させろ。
  - id: L055
    speaker: 相馬律
    zh: 黑瀨刑警，你每到一個地方，都先看地？
    ja: 黒瀬刑事は、どこに行ってもまず地面を見るんですか？
  - id: L056
    speaker: 黑瀨徹
    zh: 一雙鞋撐不過半年。看地看出來的。
    ja: 靴は一足、半年ももたん。地面ばかり見て歩いてきたからな。
  - id: L057
    speaker: 黑瀨徹
    zh: 二十年了。回家也改不掉。
    ja: 二十年だ。家に帰っても抜けん。
  - id: L058
    speaker: 早坂茜
    zh: 職業病。
    ja: 職業病。
  - id: L059
    speaker: 黑瀨徹
    zh: 地不會替人圓話。看久了，就信這個。
    ja: 地面は人の話を取り繕っちゃくれん。長く見てると、こっちを信じるようになる。
  - id: L060
    speaker: 相馬律
    zh: 刑警，你晚餐就吃那個？
    ja: 刑事、夕飯はそれですか？
  - id: L061
    speaker: 黑瀨徹
    zh: 便利商店的飯糰。站著吃，五分鐘解決。
    ja: コンビニのおにぎりだ。立って食えば、五分で済む。
  - id: L062
    speaker: 黑瀨徹
    zh: 夜班的人不挑嘴。能吞下去就行。
    ja: 夜勤の人間は、好き嫌いを言わん。飲み込めりゃそれでいい。
  - id: L063
    speaker: 早坂茜
    zh: ……至少坐下來吃。
    ja: ……せめて座って食べてください。
  - id: L064
    speaker: 黑瀨徹
    zh: 坐下就會想睡。站著比較清醒。
    ja: 座ると眠くなる。立ってるほうが頭が冴える。
  - id: L065
    speaker: 黑瀨徹
    zh: 久了，胃已經不知道什麼叫餓了。
    ja: 続けてるうちに、胃が空腹ってもんを忘れちまった。
  - id: L066
    speaker: 相馬律
    zh: 一句話加一張縮圖。沒指名要我看哪裡。
    ja: 一文と、サムネイルが一枚。どこを見ろとも書いてない。
  - id: L067
    speaker: 早坂茜
    zh: 時間點是關鍵。它在照片匯進摘要之後才來。
    ja: 肝心なのはタイミング。写真がサマリーに取り込まれたあとで届いてる。
  - id: L068
    speaker: 相馬律
    zh: 對方看見的是資料缺口，不是答案本身。
    ja: 相手が見たのはデータの穴で、答えそのものじゃない。
  - id: L069
    speaker: 相馬律
    zh: 墊子、水痕，都對得上。
    ja: マットも、水の跡も、合ってる。
  - id: L070
    speaker: 黑瀨徹
    zh: 而且乾了一半。不是剛剛才踩的。
    ja: しかも半分乾いてる。さっき踏んだもんじゃない。
  - id: L071
    speaker: 相馬律
    zh: 這個比水痕新。
    ja: これは、水の跡より新しい。
  - id: L072
    speaker: 早坂茜
    zh: 先濕後乾。兩個時間點。
    ja: 乾きかけと、濡れたまま。時点が二つある。
  - id: L073
    speaker: 相馬律
    zh: 這不能告訴我們他幾點死。
    ja: これじゃ、増田さんが何時に死んだかはわからない。
  - id: L074
    speaker: 早坂茜
    zh: 但能告訴我們，那個人不是 23:08 之後才出現。
    ja: でも、その人物が23:08より後に現れたんじゃないことはわかる。
  - id: L075
    speaker: 相馬律
    zh: 22:59。
    ja: 22:59。
    note: Read off the stopped wall clock's hands.
  - id: L076
    speaker: 黑瀨徹
    zh: 一台舊鐘。別只靠它。
    ja: 古い時計一台だ。それだけを当てにするな。
  - id: L077
    speaker: 相馬律
    zh: 22:58。跟掛鐘貼在一起。
    ja: 22:58。掛け時計とほぼ同じだ。
  - id: L078
    speaker: 早坂茜
    zh: 兩個獨立的點，指向同一刻。
    ja: 独立した二つの点が、同じ時刻を指してる。
  - id: L079
    speaker: 相馬律
    zh: 擦過，罐口還凹了。
    ja: 拭いた跡がある。缶の口もへこんでる。
  - id: L080
    speaker: 黑瀨徹
    zh: 順手抄起來就能打人。沒那麼玄。
    ja: とっさにつかめば、人を殴れる。そんな大層な話じゃない。
  - id: L081
    speaker: 相馬律
    zh: 是範圍，不是某一分鐘。
    ja: 幅だ。何時何分じゃない。
  - id: L082
    speaker: 黑瀨徹
    zh: 但跟 22:58 不衝突。我只給你這些。
    ja: だが、22:58とは矛盾しない。俺が渡せるのはそれだけだ。
  - id: L083
    speaker: 相馬律
    zh: 從那個點，看不到屍體。
    ja: あの位置からは、遺体は見えない。
  - id: L084
    speaker: 早坂茜
    zh: 看不見，不等於不在場。先記著這條界線。
    ja: 見えないことは、いなかったことにはならない。その線引きは覚えておいて。
  - id: L085
    speaker: 相馬律
    zh: 23:20 才發現，原來是白板上那條沒做完的流程。
    ja: 発見が23:20だったのは、ホワイトボードのやり残した作業のせいだったのか。
  - id: L086
    speaker: 早坂茜
    zh: 流程沒走完，發現就會晚。這條線，從閉店白板一路接上了。
    ja: 作業が終わってなければ、発見は遅れる。閉店作業のホワイトボードから、一本につながった。
