  - speaker: 相馬律
    zh: 雨聲也有它的節奏。資料排好了，人就不會慌。
    ja: ""
  - speaker: 相馬律
    zh: 先收好。別漏頁。
    ja: ""
  - speaker: 相馬律
    zh: 七點四十。她今天早了。
    ja: ""
  - speaker: 相馬律
    zh: 約的是八點。早到的人，通常手上有事要交代。
    ja: ""
  - speaker: 相馬律
    zh: 資料、場勘、程序，她管後面那一段，我走前面。
    ja: ""
  - speaker: 早坂茜
    zh: 三宅蒼太的母親就拜託我們了。先去見她，再走審查會程序。
    ja: ""
  - speaker: 相馬律
    zh: 好。我先把人和程序都擺到位，再回頭看這份摘要。
    ja: ""
  - speaker: 早坂茜
    zh: 別折。審查會會先挑折角的頁。
    ja: ""
  - speaker: 早坂茜
    zh: 我見過太多「差一張紙」輸掉的案子。
    ja: ""
  - speaker: 早坂茜
    zh: 咖啡機還是只出熱水？
    ja: ""
  - speaker: 相馬律
    zh: 還在排隊等修。
    ja: ""
  - speaker: 早坂茜
    zh: 上次文書偽造案那台，你也是這樣說。
    ja: ""
  - speaker: 相馬律
    zh: 地方小，東西多。但每一樣我都知道在哪。
    ja: ""
  - speaker: 相馬律
    zh: 按時間排，誰先來、誰後到一眼就清楚；人會記錯，紙不會。
    ja: ""
  - speaker: 相馬律
    zh: 又只有水。先靠罐咖啡，等有空再修。
    ja: ""
  - speaker: 相馬律
    zh: 機器壞著，就先靠這個。便利店的，省一點。
    ja: ""
  - speaker: 相馬律
    zh: 時間、門、鏡頭，三條線都對上了。
    ja: ""
  - speaker: 早坂茜
    zh: 三宅蒼太的母親委託我們，案子已經走到審查會那一關。我把來源和收據收齊了，先看程序。
    ja: ""
  - speaker: 相馬律
    zh: 審查會的文件都備齊了？
    ja: ""
  - speaker: 早坂茜
    zh: 程序我接。你先把現場走完，走完再信摘要。
    ja: ""
  - speaker: 相馬律
    zh: 好。那邊歸你，這邊歸我。
    ja: ""
  - speaker: 相馬律
    zh: 正式的摘要，先收好。這是這件案子的入口。
    ja: ""
