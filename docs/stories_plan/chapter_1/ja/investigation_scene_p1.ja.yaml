lines:
  - id: L001
    speaker: 旁白
    zh: 雨從下午就開始下，一直沒停。
    ja: 雨は昼過ぎから降り出して、一度も止んでいない。
  - id: L033
    speaker: 相馬律
    zh: 事務所的印表機又沒碳粉了。意見書只好來這裡印。
    ja: 事務所のプリンター、またトナー切れだ。意見書はここで刷るしかない。
    voice:
      clip: ch1_soma_ritsu_0311
  - id: L034
    speaker: 相馬律
    zh: 開業還不到一年，壞掉的東西倒是比委託多。
    ja: 開業して一年も経たないのに、壊れた物のほうが依頼より多い。
    voice:
      clip: ch1_soma_ritsu_0312
  - id: L035
    speaker: 相馬律
    zh: ……今天店裡好像不太平靜。
    ja: ……今日は店の中、なんだか穏やかじゃないな。
    voice:
      clip: ch1_soma_ritsu_0313
  - id: L028
    speaker: 相馬律
    zh: 先別急著替誰定罪。
    ja: 誰が悪いと決めるのは、まだ早いです。
    voice:
      clip: ch1_soma_ritsu_0004
      ttsHash: ec1b2682cc89
      generatedAt: 2026-10-22T02:36:55.060Z
  - id: L029
    speaker: 相馬律
    zh: 把能說明「十七點四十二分是什麼」的資料挑出來，比一比。
    ja: 「十七時四十二分が何なのか」を説明できる資料を選んで、比べてみましょう。
    voice:
      clip: ch1_soma_ritsu_0005
      ttsHash: 32d3b99e99f7
      generatedAt: 2026-10-22T02:36:56.632Z
  - id: L030
    speaker: 店主
    zh: ……好。你說怎麼看，我就怎麼看。
    ja: ……分かった。あんたが言うとおりに見るよ。
  - id: L031
    speaker: 旁白
    zh: 四個小小的痕跡都在眼前。
    ja: 四つの小さな痕跡が、目の前に並んでいる。
  - id: L032
    speaker: 旁白
    zh: 下一步，不是再找一張紙，而是決定哪些能放在同一個答案裡。
    ja: 次は紙をもう一枚探すことではない。どれを同じ答えに収められるか、決めることだ。
  - id: L036
    speaker: 店主
    zh: 啊，相馬先生。你的二十頁印好了，在那邊。
    ja: ああ、相馬さん。あんたの二十ページ、刷り上がってるよ。そこにある。
  - id: L037
    speaker: 相馬律
    zh: 謝謝。……出什麼事了？
    ja: ありがとうございます。……何かあったんですか？
    voice:
      clip: ch1_soma_ritsu_0314
  - id: L038
    speaker: 店主
    zh: 這孩子五點多來印講義，剛才又回來拿忘在機器上的原稿。
    ja: この子、五時過ぎに講義資料を刷りに来てね。さっき、機械に置き忘れた原稿を取りに戻ってきたんだ。
  - id: L007
    speaker: 店主
    zh: 收據和監視器的時間對不上，才吵起來。
    ja: レシートと防犯カメラの時間が合わないから、揉めてるんだ。
  - id: L008
    speaker: 學生
    zh: 我只記得付完錢就離開了。
    ja: 払ってから店を出た。僕が覚えてるのは、それだけです。
  - id: L039
    speaker: 店主
    zh: 我本來想直接打給他學校。
    ja: 本当は、この子の学校に直接電話しようと思ってたんだ。
  - id: L040
    speaker: 學生
    zh: 拜託不要……我下個月要交推薦入學的資料。
    ja: やめてください……来月、推薦入試の書類を出すんです。
  - id: L041
    speaker: 店主
    zh: 相馬先生，你以前在警視廳外包那邊看資料的吧？這種東西你在行。
    ja: 相馬さん、前は警視庁の外部委託で資料を見てたんだろ？こういうのは得意じゃないか。
  - id: L042
    speaker: 相馬律
    zh: 我看的是報表。現場……還在學。
    ja: 僕が見ていたのは報告書です。現場は……まだ勉強中で。
    voice:
      clip: ch1_soma_ritsu_0315
  - id: L043
    speaker: 店主
    zh: 那也比我們兩個瞪著收據強。費用照算。
    ja: それでも、俺たち二人でレシートを睨んでるよりましだ。料金はちゃんと払うよ。
  - id: L044
    speaker: 相馬律
    zh: ……這個月的影印費打個折就好。
    ja: ……今月のコピー代を、少し割り引いてもらえれば十分です。
    voice:
      clip: ch1_soma_ritsu_0316
  - id: L045
    speaker: 店主
    zh: 成交。
    ja: 決まりだ。
  - id: L009
    speaker: 相馬律
    zh: 先不要急著判斷。我想把留下的東西各看一遍，再拿來比。
    ja: 判断を急ぐのはやめましょう。残っているものを一つずつ見てから、比べたいんです。
    voice:
      clip: ch1_soma_ritsu_0006
      ttsHash: f5cab26c65d5
      generatedAt: 2026-10-22T02:36:58.047Z
  - id: L046
    speaker: 早坂茜
    zh: 六點整。意見書呢？
    ja: 六時ちょうど。意見書は？
    voice:
      clip: ch1_hayasaka_akane_0184
  - id: L047
    speaker: 相馬律
    zh: 印好了。不過……我剛接了一件。
    ja: 刷り上がってる。ただ……今、一件引き受けたところで。
    voice:
      clip: ch1_soma_ritsu_0317
  - id: L048
    speaker: 店主
    zh: 這位是……？
    ja: こちらは……？
  - id: L049
    speaker: 相馬律
    zh: 早坂律師。我替她的案子看證據、寫意見書。
    ja: 早坂弁護士です。僕は彼女の案件で証拠を見て、意見書を書いています。
    voice:
      clip: ch1_soma_ritsu_0318
  - id: L050
    speaker: 早坂茜
    zh: 上次那件文書偽造，你也說是「順手看一下」。
    ja: 前の文書偽造の件も、「ついでに見るだけ」って言ってた。
    voice:
      clip: ch1_hayasaka_akane_0185
  - id: L051
    speaker: 相馬律
    zh: 這次真的很小。
    ja: 今回は本当に小さいんだ。
    voice:
      clip: ch1_soma_ritsu_0319
  - id: L052
    speaker: 早坂茜
    zh: 收費？
    ja: 報酬は？
    voice:
      clip: ch1_hayasaka_akane_0186
  - id: L053
    speaker: 相馬律
    zh: 影印費打折。
    ja: コピー代の割引。
    voice:
      clip: ch1_soma_ritsu_0320
  - id: L054
    speaker: 早坂茜
    zh: 那也是委託。結束記得開收據。
    ja: それでも依頼は依頼。終わったら領収書を切って。
    voice:
      clip: ch1_hayasaka_akane_0187
  - id: L011
    speaker: 早坂茜
    zh: 你先做完，我不插手。
    ja: 先に終わらせて。私は口を出さない。
    voice:
      clip: ch1_hayasaka_akane_0002
  - id: L012
    speaker: 相馬律
    zh: 「REPRINT」。
    ja: 「REPRINT」。
    note: Reading the English word printed on the receipt.
    voice:
      clip: ch1_soma_ritsu_0007
      ttsHash: 415b84f2af4f
      generatedAt: 2026-10-22T02:37:01.780Z
  - id: L013
    speaker: 相馬律
    zh: 這不是第一次印出的那張，是重印收據。
    ja: これは最初に印刷されたものじゃなく、再印刷されたレシートです。
    voice:
      clip: ch1_soma_ritsu_0008
      ttsHash: b3654bda39cb
      generatedAt: 2026-10-22T02:37:03.172Z
  - id: L014
    speaker: 店主
    zh: 可是時間是真的。機器不會自己亂打。
    ja: でも時間は本物だ。機械が勝手にでたらめを打つわけないだろ。
  - id: L015
    speaker: 相馬律
    zh: 真的時間，也要先問它記的是哪一件事。
    ja: 本物の時間でも、まずそれが何を記録した時間なのか、確かめないといけません。
    voice:
      clip: ch1_soma_ritsu_0009
      ttsHash: 2b9dae9b15b2
      generatedAt: 2026-10-22T02:37:04.649Z
  - id: L016
    speaker: 相馬律
    zh: 這裡剛卡過紙。
    ja: ここ、ついさっき紙詰まりを起こしてますね。
    voice:
      clip: ch1_soma_ritsu_0010
      ttsHash: 057092a18adc
      generatedAt: 2026-10-22T02:37:05.559Z
  - id: L017
    speaker: 店主
    zh: 舊機器偶爾會卡，那又怎樣？
    ja: 古い機械だから、たまに詰まるんだよ。それがどうした？
  - id: L018
    speaker: 相馬律
    zh: 如果原本的收據卡在裡面，後來重印就不等於當時付款。
    ja: もし元のレシートが中で詰まっていたなら、あとの再印刷は、その時の支払いと同じとは言えません。
    voice:
      clip: ch1_soma_ritsu_0011
      ttsHash: 3dfb06f3f046
      generatedAt: 2026-10-22T02:37:07.394Z
  - id: L019
    speaker: 相馬律
    zh: 店主先找了錢，學生才離開。
    ja: 店主さんがお釣りを渡してから、学生さんが店を出ていますね。
    voice:
      clip: ch1_soma_ritsu_0012
      ttsHash: e2d24f26ea39
      generatedAt: 2026-10-22T02:37:08.674Z
  - id: L020
    speaker: 學生
    zh: 我那時候還低頭看了一下零錢。
    ja: 僕、そのとき下を向いて、お釣りを確かめてました。
  - id: L021
    speaker: 相馬律
    zh: 這段影像是真的，也支持你們之間有一筆交易。
    ja: この映像は本物ですし、お二人の間で取引があったことも裏づけています。
    voice:
      clip: ch1_soma_ritsu_0013
      ttsHash: 7ce9ca889fe8
      generatedAt: 2026-10-22T02:37:10.118Z
  - id: L022
    speaker: 相馬律
    zh: 但它只告訴我們你在十七點三十八分前離開。
    ja: でもこれで分かるのは、十七時三十八分より前に店を出た、ということだけです。
    voice:
      clip: ch1_soma_ritsu_0014
      ttsHash: a6ee16773f76
      generatedAt: 2026-10-22T02:37:11.710Z
  - id: L023
    speaker: 相馬律
    zh: 還不能單獨解釋十七點四十二分的收據。
    ja: これだけでは、十七時四十二分のレシートは説明できません。
    voice:
      clip: ch1_soma_ritsu_0015
      ttsHash: 30c2a21a8fc3
      generatedAt: 2026-10-22T02:37:12.927Z
  - id: L024
    speaker: 相馬律
    zh: 十七點三十七分，影印費。
    ja: 十七時三十七分、コピー代。
    note: Reading an entry aloud from the handwritten ledger.
    voice:
      clip: ch1_soma_ritsu_0016
      ttsHash: 90a6713b6b86
      generatedAt: 2026-10-22T02:37:13.735Z
  - id: L025
    speaker: 店主
    zh: 那是我手寫的，不像機器那麼漂亮。
    ja: それは私の手書きだよ。機械みたいにきれいじゃない。
  - id: L026
    speaker: 相馬律
    zh: 漂亮不漂亮不重要。這一行記的是收入發生的時間。
    ja: きれいかどうかは関係ありません。この行に書かれているのは、お金を受け取った時刻です。
    voice:
      clip: ch1_soma_ritsu_0017
      ttsHash: b5e57c163634
