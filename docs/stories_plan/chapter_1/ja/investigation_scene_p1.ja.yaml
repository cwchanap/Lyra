  - id: L003
    speaker: 相馬律
    zh: 委託單上只寫了影印費糾紛。金額不大，但店主那邊說得很急。
    ja: 依頼票には、コピー代のトラブルとしか書いてない。額は小さいけど、店主の口ぶりはずいぶん急いでいた。
    voice:
      clip: ch1_soma_ritsu_0002
      ttsHash: 3d5d15022cf6
      generatedAt: 2026-10-22T02:36:53.246Z
  - id: L004
    speaker: 旁白
    zh: 委託很小。店主和一個學生，為了幾張影印費起了爭執。
    ja: 小さな依頼だ。店主と一人の学生が、数枚分のコピー代で揉めている。
  - id: L005
    speaker: 旁白
    zh: 這種事，通常不會找上偵探。
    ja: こういう話は、普通なら探偵のところまでは来ない。
  - id: L006
    speaker: 相馬律
    zh: ……既然接了，就從門口開始看。
    ja: ……引き受けた以上、入口から見ていこう。
    voice:
      clip: ch1_soma_ritsu_0003
      ttsHash: f29389941118
      generatedAt: 2026-10-22T02:36:54.142Z
  - id: L028
    speaker: 相馬律
    zh: 先別急著替誰定罪。
    ja: 誰が悪いと決めるのは、まだ早いです。
    voice:
      clip: ch1_soma_ritsu_0004
      ttsHash: ec1b2682cc89
      generatedAt: 2026-10-22T02:36:55.060Z
  - id: L029
    speaker: 相馬律
    zh: 把能說明「十七點四十二分是什麼」的資料挑出來，比一比。
    ja: 「十七時四十二分が何なのか」を説明できる資料を選んで、比べてみましょう。
    voice:
      clip: ch1_soma_ritsu_0005
      ttsHash: 32d3b99e99f7
      generatedAt: 2026-10-22T02:36:56.632Z
  - id: L030
    speaker: 店主
    zh: ……好。你說怎麼看，我就怎麼看。
    ja: ……分かった。あんたが言うとおりに見るよ。
  - id: L031
    speaker: 旁白
    zh: 四個小小的痕跡都在眼前。
    ja: 四つの小さな痕跡が、目の前に並んでいる。
  - id: L032
    speaker: 旁白
    zh: 下一步，不是再找一張紙，而是決定哪些能放在同一個答案裡。
    ja: 次は紙をもう一枚探すことではない。どれを同じ答えに収められるか、決めることだ。
  - id: L007
    speaker: 店主
    zh: 收據和監視器的時間對不上，才吵起來。
    ja: レシートと防犯カメラの時間が合わないから、揉めてるんだ。
  - id: L008
    speaker: 學生
    zh: 我只記得付完錢就離開了。
    ja: 払ってから店を出た。僕が覚えてるのは、それだけです。
  - id: L009
    speaker: 相馬律
    zh: 先不要急著判斷。我想把留下的東西各看一遍，再拿來比。
    ja: 判断を急ぐのはやめましょう。残っているものを一つずつ見てから、比べたいんです。
    voice:
      clip: ch1_soma_ritsu_0006
      ttsHash: f5cab26c65d5
      generatedAt: 2026-10-22T02:36:58.047Z
  - id: L010
    speaker: 早坂茜
    zh: 我來取你上一份小型證據審查的意見書。
    ja: 前回の小規模な証拠審査の意見書、受け取りに来た。
    voice:
      clip: ch1_hayasaka_akane_0001
      ttsHash: 0c045a533bce
      generatedAt: 2026-10-22T02:36:59.407Z
  - id: L011
