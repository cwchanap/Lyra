    ja: 「REPRINT」。
    note: Reading the English word printed on the receipt.
    voice:
      clip: ch1_soma_ritsu_0007
      ttsHash: 415b84f2af4f
      generatedAt: 2026-10-22T02:37:01.780Z
  - id: L013
    speaker: 相馬律
    zh: 這不是第一次印出的那張，是重印收據。
    ja: これは最初に印刷されたものじゃなく、再印刷されたレシートです。
    voice:
      clip: ch1_soma_ritsu_0008
      ttsHash: b3654bda39cb
      generatedAt: 2026-10-22T02:37:03.172Z
  - id: L014
    speaker: 店主
    zh: 可是時間是真的。機器不會自己亂打。
    ja: でも時間は本物だ。機械が勝手にでたらめを打つわけないだろ。
  - id: L015
    speaker: 相馬律
    zh: 真的時間，也要先問它記的是哪一件事。
    ja: 本物の時間でも、まずそれが何を記録した時間なのか、確かめないといけません。
    voice:
      clip: ch1_soma_ritsu_0009
      ttsHash: 2b9dae9b15b2
      generatedAt: 2026-10-22T02:37:04.649Z
  - id: L016
    speaker: 相馬律
    zh: 這裡剛卡過紙。
    ja: ここ、ついさっき紙詰まりを起こしてますね。
    voice:
      clip: ch1_soma_ritsu_0010
      ttsHash: 057092a18adc
      generatedAt: 2026-10-22T02:37:05.559Z
  - id: L017
    speaker: 店主
    zh: 舊機器偶爾會卡，那又怎樣？
    ja: 古い機械だから、たまに詰まるんだよ。それがどうした？
  - id: L018
    speaker: 相馬律
    zh: 如果原本的收據卡在裡面，後來重印就不等於當時付款。
    ja: もし元のレシートが中で詰まっていたなら、あとの再印刷は、その時の支払いと同じとは言えません。
    voice:
      clip: ch1_soma_ritsu_0011
      ttsHash: 3dfb06f3f046
      generatedAt: 2026-10-22T02:37:07.394Z
  - id: L019
    speaker: 相馬律
    zh: 店主先找了錢，學生才離開。
    ja: 店主さんがお釣りを渡してから、学生さんが店を出ていますね。
    voice:
      clip: ch1_soma_ritsu_0012
      ttsHash: e2d24f26ea39
      generatedAt: 2026-10-22T02:37:08.674Z
  - id: L020
