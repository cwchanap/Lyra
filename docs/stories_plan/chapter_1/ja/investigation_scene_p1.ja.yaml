    zh: 但它只告訴我們你在十七點三十八分前離開。
    ja: でもこれで分かるのは、十七時三十八分より前に店を出た、ということだけです。
    voice:
      clip: ch1_soma_ritsu_0014
      ttsHash: a6ee16773f76
