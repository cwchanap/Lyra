    speaker: 旁白
    zh: 雨從下午就開始下，一直沒停。
    ja: 雨は昼過ぎから降り出して、一度も止んでいない。
  - id: L002
    speaker: 相馬律
    zh: ……就是這家。
    ja: ……ここか。
    voice:
      clip: ch1_soma_ritsu_0001
