# ja script for docs/stories_plan/chapter_1/investigation_scene_8.md.
# Each entry is linked to its scene line by `id` (the line's {#L012} tag);
# `speaker`, `expression` and `zh` record what was translated. Edit `ja`,
# `note`, `voice.direction` and `voice.tts` only. After the scene changes, run
# `bun run voice:sync <chapter>`, then `bun run voice:validate <chapter>`.
schemaVersion: 1
locale: ja
source: docs/stories_plan/chapter_1/investigation_scene_8.md
lines:
  - id: L001
    speaker: 相馬律
    zh: "又回來了。上次看表面，這次把那扇門固定下來。"
    ja: "また戻ってきた。前回は表面を見ただけだ。今度は、あのドアを保全する。"
    voice:
      clip: ch1_soma_ritsu_0183
  - id: L002
    speaker: 早坂茜
    zh: 程序我接。鑑識待會到，先把店長那段問清楚。
    ja: 手続きは私がやる。鑑識はもうすぐ来るから、先に店長の話をきちんと聞いておいて。
    voice:
      clip: ch1_hayasaka_akane_0091
  - id: L003
    speaker: 店長高瀨
    zh: 我想起來，那晚拍過維護頁。只是怕隔天門又卡住。
    ja: 思い出したんです。あの夜、メンテナンス画面を撮ってました。次の日にまたドアが引っかかったら困ると思って。
  - id: L004
    speaker: 店長高瀨
    zh: 如果早點拿出來，三宅是不是就不用坐那麼久？
    ja: もっと早く出していれば、三宅はあんなに長く座らされずに済んだんでしょうか？
  - id: L005
    speaker: 早坂茜
    zh: 截圖不能直接救人，但能告訴我們該固定哪裡。
    ja: スクリーンショットで直接人を救うことはできません。でも、どこを保全すべきかは教えてくれます。
    voice:
      clip: ch1_hayasaka_akane_0092
  - id: L006
    speaker: 黑瀨徹
    zh: 手機給我看，不收。面板還在，就拍面板。
    ja: 携帯は見るだけだ。受け取らん。パネルが残ってるなら、パネルを撮れ。
    voice:
      clip: ch1_kurose_toru_0031
  - id: L007
    speaker: 店長高瀨
    zh: 那天晚上，後場那扇門其實一直在維護模式。
    ja: あの夜、バックヤードのあのドアは、実はずっとメンテナンスモードだったんです。
  - id: L008
    speaker: 相馬律
    zh: 維護模式？手機裡那張截圖，能看出什麼？
    ja: メンテナンスモード？スマホのそのスクリーンショットで、何がわかるんですか？
    voice:
      clip: ch1_soma_ritsu_0184
  - id: L009
    speaker: 早坂茜
    zh: 先看看那頁面記了什麼。
    ja: まず、その画面に何が記録されているか見てみましょう。
    voice:
      clip: ch1_hayasaka_akane_0093
  - id: L070
    speaker: 相馬律
    zh: 所以那晚，三宅進門之前，已經有一個外部憑證開過後門。
    ja: つまりあの夜、三宅さんが入る前に、もう外部認証で裏口が開けられていた。
    voice:
      clip: ch1_soma_ritsu_0185
  - id: L071
    speaker: 早坂茜
    zh: 對。第三者的事件成立了。
    ja: そう。第三者による解錠は、これで成立した。
    voice:
      clip: ch1_hayasaka_akane_0094
  - id: L072
    speaker: 相馬律
    zh: 可是我們還不知道那是誰。
    ja: でも、それが誰なのかはまだわからない。
    voice:
      clip: ch1_soma_ritsu_0186
  - id: L073
    speaker: 早坂茜
    zh: 身份未定。下一步，才是把這個事件對到一個人。
    ja: 身元は未確定。その解錠を一人の人間に結びつけるのは、次の段階。
    voice:
      clip: ch1_hayasaka_akane_0095
  - id: L074
    speaker: 早坂茜
    zh: 鑑識收完，這張桌子就空了。我們留在這裡，把手上的東西理一理。
    ja: 鑑識が引き上げたら、この机は空く。私たちはここに残って、手持ちの材料を整理する。
    voice:
      clip: ch1_hayasaka_akane_0096
  - id: L010
    speaker: 店長高瀨
    zh: 我只是想證明那扇門在維護，沒別的意思。
    ja: あのドアがメンテナンス中だったって、それを証明したかっただけです。ほかに意味はないんです。
  - id: L011
    speaker: 相馬律
    zh: 四條：1841 維護模式，1842 外部憑證開後門，1843 員工憑證開後走廊，1844 同步完成。
    ja: 四件。1841、メンテナンスモード。1842、外部認証で裏口を解錠。1843、従業員認証で裏の廊下を解錠。1844、同期完了。
    note: Reading the event list off the phone screenshot; 1841-1844 are event numbers, not years or clock times.
    voice:
      clip: ch1_soma_ritsu_0187
  - id: L012
    speaker: 早坂茜
    zh: 只有先後，沒有秒數，也沒有使用者全名。
    ja: 順番だけ。秒数もないし、利用者のフルネームもない。
    voice:
      clip: ch1_hayasaka_akane_0097
  - id: L013
    speaker: 相馬律
    zh: 截圖不能進審查會。讓鑑識把面板正式固定。
    ja: スクリーンショットは審査会に出せない。鑑識にパネルを正式に保全してもらおう。
    voice:
      clip: ch1_soma_ritsu_0188
  - id: L014
    speaker: 相馬律
    zh: 你也從早上站到現在。
    ja: 早坂さんだって、朝からずっと立ちっぱなしだ。
    voice:
      clip: ch1_soma_ritsu_0189
  - id: L015
    speaker: 早坂茜
    zh: 別管我。你眼下的青色比這些帳本還深。
    ja: 私はいい。相馬こそ、目の下のクマがこの帳簿より濃い。
    voice:
      clip: ch1_hayasaka_akane_0098
  - id: L016
    speaker: 相馬律
    zh: ……等收工再說。
    ja: ……片付いてからにしよう。
    voice:
      clip: ch1_soma_ritsu_0190
  - id: L017
    speaker: 早坂茜
    zh: 嗯。收工再說。
    ja: うん。片付いてから。
    voice:
      clip: ch1_hayasaka_akane_0099
  - id: L018
    speaker: 早坂茜
    zh: 先別管它。跟我們手上的案子對不上。
    ja: 今はそれはいい。手元の案件とはつながらない。
    voice:
      clip: ch1_hayasaka_akane_0100
  - id: L019
    speaker: 相馬律
    zh: 這間店，什麼時候都聞得到這股甜味。
    ja: この店は、いつ来てもこの甘い匂いがする。
    voice:
      clip: ch1_soma_ritsu_0191
  - id: L020
    speaker: 早坂茜
    zh: 招牌拿鐵。先看面板。
    ja: 看板メニューのラテ。先にパネルを見て。
    voice:
      clip: ch1_hayasaka_akane_0101
  - id: L021
    speaker: 相馬律
    zh: 店長，這頁面平常你都怎麼看？
    ja: 店長、この画面、普段はどう見てるんですか？
    voice:
      clip: ch1_soma_ritsu_0192
  - id: L022
    speaker: 店長高瀨
    zh: 我平常只看這頁確認門有沒有卡住、維護模式有沒有關掉。
    ja: 普段はこの画面で、ドアが引っかかってないか、メンテナンスモードがオフになってるか、それだけ確認してます。
  - id: L023
    speaker: 店長高瀨
    zh: 我不知道它不能拿來判斷幾點幾分有人進門。
    ja: これで何時何分に人が入ったかまではわからないなんて、知らなかったんです。
  - id: L024
    speaker: 店長高瀨
    zh: 所以之前一直沒提，是我疏忽了。
    ja: だから、今までずっと言わずにいました。私の不注意です。
  - id: L025
    speaker: 早坂茜
    zh: 不是疏忽。這頁本來就不是給你判斷時間用的。
    ja: 不注意じゃありません。この画面は、もともと時刻を判断するためのものじゃないんです。
    voice:
      clip: ch1_hayasaka_akane_0102
  - id: L026
    speaker: 相馬律
    zh: 店長，你從早上撐到現在，都沒坐下？
    ja: 店長、朝からずっと、一度も座ってないんですか？
    voice:
      clip: ch1_soma_ritsu_0193
  - id: L027
    speaker: 店長高瀨
    zh: 這間店是我扛起來的，總不能這時候丟著。
    ja: この店は私が背負ってきたんです。こんな時に放り出すわけにはいきません。
  - id: L028
    speaker: 店長高瀨
    expression: tired
    zh: ……其實腿早就軟了。只是不想在你們面前坐下。
    ja: ……本当は、とっくに足が限界なんです。ただ、お二人の前で座りたくなくて。
  - id: L029
    speaker: 相馬律
    zh: 沒關係。先靠一下也好。
    ja: かまいませんよ。少し寄りかかるだけでも。
    voice:
      clip: ch1_soma_ritsu_0194
  - id: L030
    speaker: 店長高瀨
    zh: 等鑑識那邊收完再說。
    ja: 鑑識の方が終わってからにします。
  - id: L031
    speaker: 店長高瀨
    zh: 一個人顧店，連生病都不敢。倒了就沒人開門。
    ja: 一人で店を回してると、病気にもなれないんです。私が倒れたら、店を開ける人がいない。
  - id: L032
    speaker: 相馬律
    zh: 十年都這樣？
    ja: 十年、ずっとですか？
    voice:
      clip: ch1_soma_ritsu_0195
  - id: L033
    speaker: 店長高瀨
    zh: 習慣了。開店的人沒有在請假的。
    ja: 慣れました。店をやってる人間に、休みなんてないんです。
  - id: L034
    speaker: 相馬律
    zh: 店長，這頁的事件順序，有沒有可能被人動過？
    ja: 店長、この画面のイベントの順番、誰かがいじった可能性はありませんか？
    voice:
      clip: ch1_soma_ritsu_0196
  - id: L035
    speaker: 店長高瀨
    zh: 我……我不會動那個。我只會看門卡不卡。
    ja: 私……私はあれには触りません。ドアが引っかかってないか、見るだけで。
  - id: L036
    speaker: 店長高瀨
    zh: 你們是覺得，是我改的？
    ja: 私が書き換えたって、思ってるんですか？
  - id: L037
    speaker: 早坂茜
    zh: 她連這頁能判斷時間都不知道。
    ja: 店長は、この画面で時刻がわかるかどうかさえ知らなかった。
    voice:
      clip: ch1_hayasaka_akane_0103
  - id: L038
    speaker: 早坂茜
    zh: 要重排這種紀錄，得碰得到設備本身，不是手機拍一張就能改。
    ja: この手の記録を並べ替えるには、機器そのものに触れないと無理。スマホで一枚撮って変えられるものじゃない。
    voice:
      clip: ch1_hayasaka_akane_0104
  - id: L039
    speaker: 相馬律
    zh: ……也是。順序是機器自己存的。
    ja: ……そうだな。順番は機械が自分で保存してる。
    voice:
      clip: ch1_soma_ritsu_0197
  - id: L040
    speaker: 店長高瀨
    zh: 我開店十年，從沒碰過那台機器的設定。
    ja: 店を十年やってきて、あの機械の設定には一度も触ったことがありません。
  - id: L041
    speaker: 相馬律
    zh: 店長，這間店為什麼叫「雨鐘」？
    ja: 店長、この店はどうして「雨鐘」っていうんですか？
    voice:
      clip: ch1_soma_ritsu_0198
  - id: L042
    speaker: 店長高瀨
    zh: 前任老闆取的。他說吉祥寺常下雨，鐘聲又響得遠。
    ja: 前のオーナーがつけたんです。吉祥寺はよく雨が降るし、鐘の音は遠くまで響くからって。
  - id: L043
    speaker: 店長高瀨
    zh: 我接手的時候想過改名字，最後沒改。
    ja: 引き継いだとき、名前を変えようかとも思ったんですけど、結局そのままで。
  - id: L044
    speaker: 相馬律
    zh: 為什麼沒改？
    ja: どうして変えなかったんですか？
    voice:
      clip: ch1_soma_ritsu_0199
  - id: L045
    speaker: 店長高瀨
    zh: 常客都叫習慣了。改了，他們反而找不到門。
    ja: 常連さんがこの名前で呼び慣れてますから。変えたら、かえって店の入り口がわからなくなる。
  - id: L046
    speaker: 店長高瀨
    zh: 開店的人，有些東西不是自己的，也得替別人留著。
    ja: 店をやってると、自分のものじゃなくても、誰かのために残しておかなきゃいけないものがあるんです。
  - id: L047
    speaker: 黑瀨徹
    zh: 截圖我不收。要用，就讓鑑識把它固定下來。
    ja: スクショは受け取らん。使うなら、鑑識に保全させろ。
    voice:
      clip: ch1_kurose_toru_0032
  - id: L048
    speaker: 相馬律
    zh: 設備、機身、畫面時間都登記在案；底下是 1841 到 1844 的本機順序。
    ja: 機器、本体番号、画面の時刻まで記録済み。その下に、1841から1844までの本体の記録順。
    note: 1841-1844 are event numbers, not years.
    voice:
      clip: ch1_soma_ritsu_0200
  - id: L049
    speaker: 黑瀨徹
    zh: 手機截圖只是線索。這份才是能進審查會的材料。
    ja: 携帯のスクショは手がかりにすぎん。審査会に出せるのは、こっちだ。
    voice:
      clip: ch1_kurose_toru_0033
  - id: L050
    speaker: 早坂茜
    zh: 記住，這是本機順序，不是核准片段。
    ja: 覚えておいて。これは本体の記録順で、承認済み抜粋じゃない。
    voice:
      clip: ch1_hayasaka_akane_0105
  - id: L051
    speaker: 相馬律
    zh: 1842 是外包憑證開後門，排在 1843 的三宅憑證前面。
    ja: 1842は外注認証での裏口の解錠。1843の三宅さんの認証より前に並んでる。
    note: 1842 and 1843 are event numbers, not years.
    voice:
      clip: ch1_soma_ritsu_0201
  - id: L052
    speaker: 相馬律
    zh: 那就是兇手吧？
    ja: じゃあ、これが犯人だろう？
    voice:
      clip: ch1_soma_ritsu_0202
  - id: L053
    speaker: 早坂茜
    zh: 只能說有外部憑證比三宅早。還沒對到人。
    ja: 言えるのは、三宅さんより早い外部認証があったということだけ。まだ人には結びついてない。
    voice:
      clip: ch1_hayasaka_akane_0106
  - id: L054
    speaker: 相馬律
    zh: 摘要上的 23:07:50，本機順序裡沒有。
    ja: サマリーの23:07:50は、本体の記録順にはない。
    voice:
      clip: ch1_soma_ritsu_0203
  - id: L055
    speaker: 早坂茜
    zh: 本機順序沒被改，摘要怎麼讀，留到核准片段再定。
    ja: 本体の記録順は書き換えられてない。サマリーをどう読むかは、承認済み抜粋を見てから決める。
    voice:
      clip: ch1_hayasaka_akane_0107
  - id: L056
    speaker: 黑瀨徹
    zh: 電信方的回覆也到了。三宅那通電話，手機履歷和通信紀錄都對上。
    ja: 通信会社の回答も届いた。三宅のあの電話、端末の履歴とも通信記録とも一致した。
    voice:
      clip: ch1_kurose_toru_0034
  - id: L057
    speaker: 早坂茜
    zh: 原本的待確認項留著。這張是正式核實後的新紀錄。
    ja: 元の要確認の項目はそのまま残す。これは正式に確認が取れた、新しい記録。
    voice:
      clip: ch1_hayasaka_akane_0108
  - id: L058
    speaker: 相馬律
    zh: 刑警，店長那張截圖到底差在哪？
    ja: 刑事、店長のあのスクリーンショットは、結局何が足りないんですか？
    voice:
      clip: ch1_soma_ritsu_0204
  - id: L059
    speaker: 黑瀨徹
    zh: 截圖只是線索，誰都能拍、誰都能裁。
    ja: スクショは手がかりにすぎん。誰でも撮れるし、誰でも切り取れる。
    voice:
      clip: ch1_kurose_toru_0035
  - id: L060
    speaker: 黑瀨徹
    zh: 固定紀錄從設備到畫面時間都有簽字。
    ja: 保全記録には、機器から画面の時刻まで、全部署名がある。
    voice:
      clip: ch1_kurose_toru_0036
  - id: L061
    speaker: 黑瀨徹
    zh: 審查會看的是這個，不是手機相簿。
    ja: 審査会が見るのはこっちだ。携帯の写真フォルダじゃない。
    voice:
      clip: ch1_kurose_toru_0037
  - id: L062
    speaker: 相馬律
    zh: 這份是程序固定過的，能進審查會。
    ja: これは手続きどおりに保全されたものだ。審査会に出せる。
    voice:
      clip: ch1_soma_ritsu_0205
  - id: L063
    speaker: 早坂茜
    zh: 但它只是本機順序，別把它當成核准片段。
    ja: ただ、あくまで本体の記録順。承認済み抜粋と取り違えないで。
    voice:
      clip: ch1_hayasaka_akane_0109
  - id: L064
    speaker: 相馬律
    zh: 原來店裡只拿這頁看門有沒有關好。
    ja: 店では、この画面をドアがちゃんと閉まってるかの確認にしか使ってなかったのか。
    voice:
      clip: ch1_soma_ritsu_0206
  - id: L065
    speaker: 早坂茜
    zh: 所以這頁告訴你的，只有門卡沒卡、模式關沒關。
    ja: だからこの画面でわかるのは、ドアが引っかかってるかどうかと、モードがオフかどうかだけ。
    voice:
      clip: ch1_hayasaka_akane_0110
  - id: L066
    speaker: 相馬律
    zh: 外部憑證，排在三宅前面。
    ja: 外部認証が、三宅さんより前に並んでる。
    voice:
      clip: ch1_soma_ritsu_0207
  - id: L067
    speaker: 早坂茜
    zh: 先別填名字。我們只證明了有第三方的事件。
    ja: 名前はまだ入れないで。証明できたのは、第三者による解錠があったことだけ。
    voice:
      clip: ch1_hayasaka_akane_0111
  - id: L068
    speaker: 相馬律
    zh: 舊的待確認項不改，正式核實另留一筆。
    ja: 古い要確認の項目は変えない。正式な確認は、別の一件として残す。
    voice:
      clip: ch1_soma_ritsu_0208
  - id: L069
    speaker: 黑瀨徹
    zh: 對。誰確認、什麼時候確認，都在這張。
    ja: そうだ。誰がいつ確認したか、全部この一枚に書いてある。
    voice:
      clip: ch1_kurose_toru_0038
