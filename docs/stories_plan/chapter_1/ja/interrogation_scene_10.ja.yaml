schemaVersion: 1
locale: ja
source: docs/stories_plan/chapter_1/interrogation_scene_10.md
lines:
  - speaker: 相馬律
    zh: 三條都帶到了。今天看能不能一次推到位。
    ja: ""
  - speaker: 早坂茜
    zh: 穩著問。她信摘要，別想一步到位。
    ja: ""
  - speaker: 早坂茜
    zh: 辯方手上，有好幾條彼此獨立的矛盾。
    ja: ""
  - speaker: 早坂茜
    zh: 時間、動線、動機，都對不上摘要那條主時間線。
    ja: ""
  - speaker: 神谷澪
    zh: 辯方準備好了，我這邊隨時可以開始。
    ja: ""
  - speaker: 早坂茜
    zh: 不過我先講清楚程序。
    ja: ""
  - speaker: 早坂茜
    zh: 那段後場門鎖的核准片段，現在還沒核准調出。
    ja: ""
  - speaker: 神谷澪
    zh: 對。我不會因為你們說「有矛盾」就准許調出核准片段。
    ja: ""
  - speaker: 神谷澪
    zh: 先用你們已經拿到的材料，把摘要那條時間線動搖了。
    ja: ""
  - speaker: 神谷澪
    zh: 我才會考慮開那扇門。
    ja: ""
  - speaker: 相馬律
    zh: 可以。我們一條一條來。
    ja: ""
  - speaker: 相馬律
    zh: ……第一次坐在這邊。
    ja: ""
  - speaker: 早坂茜
    zh: 材料都在桌上了。你只管問。
    ja: ""
  - speaker: 神谷澪
    expression: conceding
    zh: ……工單和憑證把那個空位對到北見。
    ja: ""
  - speaker: 神谷澪
    expression: conceding
    zh: 水痕與傘套，只保留後巷動線的前後脈絡。
    ja: ""
  - speaker: 神谷澪
    expression: conceding
    zh: 北見修一，指認成立。三宅蒼太的主嫌方向，撤回。
    ja: ""
  - speaker: 神谷澪
    expression: conceding
    zh: 審查會保留這條鏈，轉入重新調查。原本那條主時間線，不再採用。
    ja: ""
  - speaker: 早坂茜
    zh: 程序上，三宅這邊洗清了。重新調查的入口，我們守住了。
    ja: ""
  - speaker: 相馬律
    zh: 三宅的母親，可以把那袋飯糰帶回家了。
    ja: ""
  - speaker: 相馬律
    zh: 剩下的，交給重新調查。
    ja: ""
  - speaker: 早坂茜
    zh: 走。重新調查那邊，明天先遞狀。
    ja: ""
  - speaker: 神谷澪
    zh: 第一條，從證詞可信度開始。
    ja: ""
  - speaker: 神谷澪
    zh: 哪一句還對不上，你再指一次。
    ja: ""
  - speaker: 相馬律
    zh: 哪一句對不上，我再確認一次。
    ja: ""
  - speaker: 相馬律
    zh: 這句先停一下。
    ja: ""
  - speaker: 神谷澪
    zh: 這一句我沒說錯，換個東西再來。
    ja: ""
  - speaker: 相馬律
    zh: 不是比人品，要對的是那句謊話。
    ja: ""
  - speaker: 神谷澪
    expression: skeptical
    zh: 三宅有兩個小謊，摘要因此把他列為主嫌。
    ja: ""
  - speaker: 神谷澪
    expression: skeptical
    zh: 小謊既然成立，摘要的可信度就高於他的說法。
    ja: ""
  - speaker: 神谷澪
    expression: skeptical
    zh: 這一條，先按程序確認。
    ja: ""
  - speaker: 相馬律
    zh: 他說的那兩個謊，我都能對上該有的東西。先看那段閉店流程。
    ja: ""
  - speaker: 相馬律
    zh: 蛋糕盒與母親通話都對得上閉店流程；是小謊，不是殺人。
    ja: ""
  - speaker: 神谷澪
    zh: 人格不是證據。他孝不孝順，跟那一晚有沒有殺人，是兩回事。拿能對上那句謊話的東西來。
    ja: ""
  - speaker: 神谷澪
    zh: 要往前移那條死亡時間，你再指一次。
    ja: ""
  - speaker: 相馬律
    zh: 那條死亡時間，我再看一次。
    ja: ""
  - speaker: 相馬律
    zh: 這句，我想再確認一下。
    ja: ""
  - speaker: 神谷澪
    zh: 這對不上死亡那一分鐘，換一個。
    ja: ""
  - speaker: 相馬律
    zh: 這換不到死亡那一刻，我再找別的。
    ja: ""
  - speaker: 神谷澪
    zh: 摘要把死亡排在三宅進後場之後，並以他的動線作主錨。
    ja: ""
  - speaker: 神谷澪
    zh: 要往前移，必須有更硬的時間紀錄。
    ja: ""
  - speaker: 相馬律
    zh: 那條死亡時間，得往前移。看死者手機那則通知停在幾分。
    ja: ""
  - speaker: 相馬律
    zh: 手機通知與後場紀錄顯示衝突早於摘要；摘要的主時間線不成立。
    ja: ""
  - speaker: 神谷澪
    zh: 那杯咖啡只證明第二個人被等著、提早到了，證不到死亡的那一分鐘。別拿它當死亡時刻。
    ja: ""
  - speaker: 神谷澪
    zh: 要把他從那個位置拉開，你再指一次。
    ja: ""
  - speaker: 相馬律
    zh: 把他放在那個位置的理由，再擺一次。
    ja: ""
  - speaker: 相馬律
    zh: 這句，先讓我對一下。
    ja: ""
  - speaker: 神谷澪
    zh: 這證不到是哪一個人，換一個。
    ja: ""
  - speaker: 相馬律
    zh: 這對不到是哪一個人，下一步找工單和憑證。
    ja: ""
  - speaker: 神谷澪
    zh: 時間往前移，不等於換了人；三宅仍可能在後場。
    ja: ""
  - speaker: 神谷澪
    zh: 要排除他，必須證明更早的進場者另有其人。
    ja: ""
  - speaker: 相馬律
    zh: 要把他從那個位置拉開，就看他那時的視線回放。
    ja: ""
  - speaker: 相馬律
    zh: L 型轉角擋住三宅視線；半乾水跡證明有人在他之前走過承包商動線。
    ja: ""
  - speaker: 神谷澪
    zh: 傘套只留下後來的雨水，不能替更早水痕認人。要把那個空位對到人，得靠工單和外包憑證。
    ja: ""
  - speaker: 神谷澪
    zh: 書記官，補一筆。三宅站位無法目視屍體，第三條矛盾成立。
    ja: ""
  - speaker: 早坂茜
    zh: 三條矛盾已成立：小謊、死亡時間、第三者先行進場。
    ja: ""
  - speaker: 早坂茜
    expression: stern
    zh: 請核准限定片段，只比對摘要與本機順序。
    ja: ""
  - speaker: 神谷澪
    zh: 要我開那扇門，先把理由再擺一次。
    ja: ""
  - speaker: 相馬律
    zh: 要動那扇門，我把理由再理一次。
    ja: ""
  - speaker: 相馬律
    zh: 不是這個，我得先找到那份摘要。
    ja: ""
  - speaker: 神谷澪
    zh: 本機順序已固定，但摘要那行秒數仍未對上。
    ja: ""
  - speaker: 神谷澪
    zh: 先說清楚，你們要核准哪一筆、限定到哪裡。
    ja: ""
  - speaker: 相馬律
    zh: 本機順序固定；請只核對摘要主時間線與它的來源。
    ja: ""
  - speaker: 神谷澪
    zh: 三條矛盾加上本機順序，足以核准限定片段；範圍外不給。
    ja: ""
  - speaker: 神谷澪
    zh: 這動搖不了那行時間。拿那份把門鎖排成主時間線的摘要來，我才知道你們要翻哪一筆。
    ja: ""
  - speaker: 黑瀨徹
    zh: 核准片段到手，證物鏈沒有斷點。
    ja: ""
  - speaker: 神谷澪
    zh: 第四條。門鎖紀錄未被偽造，三宅那個時間可信。
    ja: ""
  - speaker: 神谷澪
    zh: 這行時間你要翻，再指一次。
    ja: ""
  - speaker: 相馬律
    zh: 這行時間，我再讀一次。
    ja: ""
  - speaker: 相馬律
    zh: 這句，先讓我比一下。
    ja: ""
  - speaker: 神谷澪
    zh: 這一句沒問題，換個東西。
    ja: ""
  - speaker: 相馬律
    zh: 不是造假的事，要拿的是本機那份事件順序。
    ja: ""
  - speaker: 神谷澪
    zh: 門鎖紀錄未被改過，二十三點零七分五十秒也清楚。
    ja: ""
  - speaker: 神谷澪
    zh: 門、鏡頭、憑證都對得上三宅；摘要抓到的是最好對上的一筆。
    ja: ""
  - speaker: 相馬律
    zh: 紀錄沒造假，錯的是讀法；請對照核准片段的本機順序。
    ja: ""
  - speaker: 相馬律
    zh: 外包憑證早於三宅憑證；摘要在其後合併，二十三點零七分五十秒是合併時間，不是進門時間。
    ja: ""
  - speaker: 神谷澪
    zh: 本機順序沒有被動過手腳。錯的不是門鎖，是摘要對它的讀法。別把這頂帽子扣到造假上。
    ja: ""
  - speaker: 神谷澪
    zh: 最後一條。就算三宅的嫌疑降下來了，你也證不了是北見殺的人。
    ja: ""
  - speaker: 神谷澪
    zh: 要把他放進那一刻，你再指一次。
    ja: ""
  - speaker: 相馬律
    zh: 把他放進那一刻，我再想一次。
    ja: ""
  - speaker: 神谷澪
    zh: 這放不進那一刻，換一個。
    ja: ""
  - speaker: 相馬律
    zh: 不是靠印象定他，我得找那張把他放進後場的東西。
    ja: ""
  - speaker: 神谷澪
    zh: 拆掉三宅，不等於補上北見。
    ja: ""
  - speaker: 神谷澪
    zh: 沒有人證、沒有兇手的時間，你憑什麼說是他？
    ja: ""
  - speaker: 神谷澪
    zh: 你拆了摘要那條線，那一格現在是空的。空格不會自己填上北見的名字。
    ja: ""
  - speaker: 相馬律
    zh: 那一格能填。臨時維護工單對上那組外包憑證，權限名單再把它們只對到北見一個人。
    ja: ""
  - speaker: 相馬律
    zh: 權限名單只對到北見。備忘、第二杯咖啡的 K、盜賣紀錄和帳號審核壓力，補上動機和壓力。水痕與傘套留在承包商動線前後。摘要把三宅排進了那個時間。
    ja: ""
  - speaker: 神谷澪
    zh: 動線你已經在第三條證過了，傘套再擺一次也只回到原處。要填進北見的名字，缺的是把他和那個空位對上的工單與憑證。
    ja: ""
  - speaker: 相馬律
    zh: 核准片段裡，本機順序和摘要擺在一起，前後卻對不上。
    ja: ""
  - speaker: 相馬律
    zh: 二十三點零七分五十秒，是摘要排上的時間；不是三宅進門那一刻。
    ja: ""
  - speaker: 早坂茜
    zh: 這段的來路對得上，可以拿上桌。
    ja: ""
