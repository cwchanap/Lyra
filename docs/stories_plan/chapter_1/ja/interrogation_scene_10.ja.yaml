# ja script for docs/stories_plan/chapter_1/interrogation_scene_10.md.
# Each entry is linked to its scene line by `id` (the line's {#L012} tag);
# `speaker`, `expression` and `zh` record what was translated. Edit `ja`,
# `note`, `voice.direction` and `voice.tts` only. After the scene changes, run
# `bun run voice:sync <chapter>`, then `bun run voice:validate <chapter>`.
schemaVersion: 1
locale: ja
source: docs/stories_plan/chapter_1/interrogation_scene_10.md
lines:
  - id: L001
    speaker: 相馬律
    zh: 三條都帶到了。今天看能不能一次推到位。
    ja: 三つとも揃えてきた。今日で一気に押し切れるかどうかだ。
    voice:
      clip: ch1_soma_ritsu_0264
  - id: L002
    speaker: 早坂茜
    zh: 穩著問。她信摘要，別想一步到位。
    ja: 焦らずに詰めて。向こうはサマリーを信じてる。一度で押し切ろうとしないで。
    voice:
      clip: ch1_hayasaka_akane_0165
  - id: L003
    speaker: 早坂茜
    zh: 辯方手上，有好幾條彼此獨立的矛盾。
    ja: 弁護側には、互いに独立した矛盾がいくつもあります。
    voice:
      clip: ch1_hayasaka_akane_0166
  - id: L004
    speaker: 早坂茜
    zh: 時間、動線、動機，都對不上摘要那條主時間線。
    ja: 時間、動線、動機。いずれもサマリーの主タイムラインと合いません。
    voice:
      clip: ch1_hayasaka_akane_0167
  - id: L005
    speaker: 神谷澪
    zh: 辯方準備好了，我這邊隨時可以開始。
    ja: 弁護側の準備が整っているのでしたら、こちらはいつでも始められます。
    voice:
      clip: ch1_kamiya_mio_0028
  - id: L008
    speaker: 神谷澪
    zh: 先說好，我不會因為你們說「有矛盾」就調出核准片段。
    ja: 先にお断りしておきます。「矛盾がある」と言われただけで、承認済み抜粋を開示することはありません。
    voice:
      clip: ch1_kamiya_mio_0029
  - id: L009
    speaker: 神谷澪
    zh: 先用手上的材料動搖摘要，我才考慮開那扇門。
    ja: まず、手元の材料でサマリーを揺るがしてください。扉を開けるかどうかは、それから考えます。
    voice:
      clip: ch1_kamiya_mio_0030
  - id: L011
    speaker: 相馬律
    zh: 可以。我們一條一條來。
    ja: 分かりました。一つずつ進めます。
    voice:
      clip: ch1_soma_ritsu_0265
  - id: L012
    speaker: 相馬律
    zh: ……上次坐在這裡，什麼都沒推動。
    ja: ……前にここに座ったときは、何も動かせなかった。
    voice:
      clip: ch1_soma_ritsu_0266
  - id: L013
    speaker: 早坂茜
    zh: 這次材料都在桌上了。你只管問。
    ja: 今回は材料が全部、机に出てる。あとは聞くことだけ考えて。
    voice:
      clip: ch1_hayasaka_akane_0170
  - id: L014
    speaker: 相馬律
    zh: ……嗯。
    ja: ……うん。
  - id: L085
    speaker: 神谷澪
    expression: conceding
    zh: ……那晚只有北見能用那組憑證，增田要檢舉的，正是他。
    ja: ……あの夜、あの認証を使えたのは北見さんだけです。増田さんが告発しようとしていたのは、まさに彼でした。
    voice:
      clip: ch1_kamiya_mio_0032
  - id: L086
    speaker: 神谷澪
    expression: conceding
    zh: 傘套排不出先後，只說明有人走過承包商的後巷動線，不是員工動線。
    ja: 傘袋では前後を決められません。示せるのは、誰かが委託業者の裏路地の動線を通ったことだけで、従業員の動線ではありません。
    voice:
      clip: ch1_kamiya_mio_0033
  - id: L087
    speaker: 神谷澪
    expression: conceding
    zh: 北見修一，指認成立。三宅蒼太的主嫌方向，撤回。
    ja: 北見修一、特定が成立。三宅蒼太を主たる被疑者とする方向は、撤回します。
    voice:
      clip: ch1_kamiya_mio_0034
  - id: L088
    speaker: 神谷澪
    expression: conceding
    zh: 審查會保留這條鏈，轉入重新調查。原本那條主時間線，不再採用。
    ja: 審査会はこの証拠の連鎖を保持し、再捜査に移します。当初の主タイムラインは、今後採用しません。
    voice:
      clip: ch1_kamiya_mio_0035
  - id: L089
    speaker: 早坂茜
    zh: 程序上，三宅這邊洗清了。重新調查的入口，我們守住了。
    ja: 手続きの上では、三宅さんの嫌疑は晴れた。再捜査への入口は、私たちが守り切った。
    voice:
      clip: ch1_hayasaka_akane_0171
  - id: L090
    speaker: 相馬律
    zh: 三宅的母親，可以把那袋飯糰帶回家了。
    ja: これで三宅さんのお母さんも、あのおにぎりの袋を家に持って帰れる。
    voice:
      clip: ch1_soma_ritsu_0267
  - id: L091
    speaker: 相馬律
    zh: 剩下的，交給重新調查。
    ja: 残りは、再捜査に任せよう。
    voice:
      clip: ch1_soma_ritsu_0268
  - id: L092
    speaker: 早坂茜
    zh: 走。重新調查那邊，明天先遞狀。
    ja: 行こう。再捜査のほうは、明日まず書面を出す。
    voice:
      clip: ch1_hayasaka_akane_0172
  - id: L015
    speaker: 神谷澪
    zh: 第一條，從證詞可信度開始。
    ja: 第一の点。供述の信用性から始めます。
    voice:
      clip: ch1_kamiya_mio_0036
  - id: L016
    speaker: 神谷澪
    zh: 哪一句還對不上，你再指一次。
    ja: どの発言がまだ合わないのか、もう一度示してください。
    voice:
      clip: ch1_kamiya_mio_0037
  - id: L017
    speaker: 相馬律
    zh: 哪一句對不上，我再確認一次。
    ja: どの発言が合わないのか、もう一度確かめます。
    voice:
      clip: ch1_soma_ritsu_0269
  - id: L018
    speaker: 相馬律
    zh: 這句先停一下。
    ja: その発言、一度止めてください。
    voice:
      clip: ch1_soma_ritsu_0270
  - id: L019
    speaker: 神谷澪
    zh: 這一句我沒說錯，換個東西再來。
    ja: この発言に誤りはありません。別のものを持って、出直してください。
    voice:
      clip: ch1_kamiya_mio_0038
  - id: L020
    speaker: 相馬律
    zh: 不是比人品，我得先弄清楚那兩句謊話在遮什麼。
    ja: 人柄を比べる話じゃない。まず、あの二つの嘘が何を隠しているのかを確かめないと。
    voice:
      clip: ch1_soma_ritsu_0271
  - id: L021
    speaker: 神谷澪
    expression: skeptical
    zh: 三宅有兩個小謊，摘要因此把他列為主嫌。
    ja: 三宅さんには小さな嘘が二つあります。サマリーはそれを理由に、彼を主たる被疑者としました。
    voice:
      clip: ch1_kamiya_mio_0039
  - id: L022
    speaker: 神谷澪
    expression: skeptical
    zh: 小謊既然成立，摘要的可信度就高於他的說法。
    ja: 小さな嘘が認められる以上、サマリーの信用性は彼の供述を上回ります。
    voice:
      clip: ch1_kamiya_mio_0040
  - id: L023
    speaker: 神谷澪
    expression: skeptical
    zh: 這一條，先按程序確認。
    ja: この点は、まず手続きどおりに確認します。
    voice:
      clip: ch1_kamiya_mio_0041
  - id: L024
    speaker: 相馬律
    zh: 他那兩個謊，我能一個一個對上去。
    ja: 彼の二つの嘘は、一つずつ突き合わせられます。
    voice:
      clip: ch1_soma_ritsu_0272
  - id: L025
    speaker: 相馬律
    zh: 打給母親、藏蛋糕盒，都是為了家裡的小事。兩個謊都不是在掩蓋殺人。
    ja: 母親への電話も、ケーキの箱を隠したのも、家のちょっとした事情のためです。どちらの嘘も、殺人を隠すためのものではありません。
    voice:
      clip: ch1_soma_ritsu_0273
  - id: L026
    speaker: 神谷澪
    zh: 這只能說他確實說了謊，看不出謊是為了什麼。孝不孝順，也不等於那晚沒殺人。
    ja: それは彼が嘘をついたことを示すだけで、何のための嘘かは分かりません。親孝行かどうかも、あの夜に殺していないことにはなりません。
    voice:
      clip: ch1_kamiya_mio_0042
  - id: L027
    speaker: 神谷澪
    zh: 要往前移那條死亡時間，你再指一次。
    ja: 死亡時刻を前に動かしたいのなら、もう一度示してください。
    voice:
      clip: ch1_kamiya_mio_0043
  - id: L028
    speaker: 相馬律
    zh: 那條死亡時間，我再看一次。
    ja: 死亡時刻を、もう一度見直します。
    voice:
      clip: ch1_soma_ritsu_0274
  - id: L029
    speaker: 相馬律
    zh: 這句，我想再確認一下。
    ja: その点、もう一度確認させてください。
    voice:
      clip: ch1_soma_ritsu_0275
  - id: L030
    speaker: 神谷澪
    zh: 這對不上死亡那一分鐘，換一個。
    ja: それでは、死亡したその一分には結びつきません。別のものを。
    voice:
      clip: ch1_kamiya_mio_0044
  - id: L031
    speaker: 相馬律
    zh: 這換不到死亡那一刻，我再找別的。
    ja: これじゃ死亡の瞬間まで届かない。別のものを探そう。
    voice:
      clip: ch1_soma_ritsu_0276
  - id: L032
    speaker: 神谷澪
    zh: 摘要把死亡排在三宅進後場之後，並以他的動線作主錨。
    ja: サマリーは、死亡を三宅さんがバックヤードに入った後に置き、彼の動線を主たる基準に据えています。
    voice:
      clip: ch1_kamiya_mio_0045
  - id: L033
    speaker: 神谷澪
    zh: 要往前移，必須有更硬的時間紀錄。
    ja: 前に動かすのなら、より確かな時刻の記録が必要です。
    voice:
      clip: ch1_kamiya_mio_0046
  - id: L034
    speaker: 相馬律
    zh: 那條死亡時間，得往前移。看死者手機那則通知停在幾分。
    ja: 死亡時刻は、前に動かす必要があります。被害者のスマホの通知が、何分で止まっているかを見てください。
    voice:
      clip: ch1_soma_ritsu_0277
  - id: L035
    speaker: 相馬律
    zh: 手機通知與後場紀錄顯示衝突早於摘要；摘要的主時間線不成立。
    ja: スマホの通知とバックヤードの記録は、衝突がサマリーより早かったことを示しています。サマリーの主タイムラインは成り立ちません。
    voice:
      clip: ch1_soma_ritsu_0278
  - id: L036
    speaker: 神谷澪
    zh: 這釘不住衝突那一分鐘；要一筆不靠人記憶的時間。
    ja: それでは衝突のあの一分は押さえられません。人の記憶に頼らない時刻が必要です。
    voice:
      clip: ch1_kamiya_mio_0047
  - id: L037
    speaker: 神谷澪
    zh: 要把他從那個位置拉開，你再指一次。
    ja: 彼をあの位置から引き離したいのなら、もう一度示してください。
    voice:
      clip: ch1_kamiya_mio_0048
  - id: L038
    speaker: 相馬律
    zh: 把他放在那個位置的理由，再擺一次。
    ja: 彼をあの位置に置いた根拠を、もう一度並べ直します。
    voice:
      clip: ch1_soma_ritsu_0279
  - id: L039
    speaker: 相馬律
    zh: 這句，先讓我對一下。
    ja: そこを一度、照合させてください。
    voice:
      clip: ch1_soma_ritsu_0280
  - id: L040
    speaker: 神谷澪
    zh: 這證不到是哪一個人，換一個。
    ja: それでは、誰なのかまでは証明できません。別のものを。
    voice:
      clip: ch1_kamiya_mio_0049
  - id: L041
    speaker: 相馬律
    zh: 這排不到二十三點零六分之前，我再找更早的痕跡。
    ja: 二十三時六分より前には並べられない。もっと早い痕跡を探そう。
    voice:
      clip: ch1_soma_ritsu_0281
  - id: L042
    speaker: 神谷澪
    zh: 時間往前移，不等於換了人；三宅仍可能在後場。
    ja: 時刻が前に動いても、人が替わったことにはなりません。三宅さんがバックヤードにいた可能性は残ります。
    voice:
      clip: ch1_kamiya_mio_0050
  - id: L043
    speaker: 神谷澪
    zh: 要排除他，必須證明更早的進場者另有其人。
    ja: 彼を外すのなら、それより早く入った者が別にいると証明しなければなりません。
    voice:
      clip: ch1_kamiya_mio_0051
  - id: L044
    speaker: 相馬律
    zh: 要把他從那個位置拉開，得有比他進場更早的痕跡。
    ja: 彼をあの位置から引き離すには、彼の入場より早い痕跡が要ります。
    voice:
      clip: ch1_soma_ritsu_0282
  - id: L045
    speaker: 相馬律
    zh: 後門那灘水最晚二十三點零一分前就帶進來了，早於三宅二十三點零六分那趟。而且他站的位置，被 L 型轉角擋住，看不到屍體。
    ja: 裏口の水は、遅くとも二十三時一分より前に持ち込まれていました。三宅さんが入った二十三時六分より早いんです。それに彼の立っていた位置は、L字の曲がり角に遮られて、遺体が見えません。
    voice:
      clip: ch1_soma_ritsu_0283
  - id: L046
    speaker: 神谷澪
    zh: 這排不出比二十三點零六分更早的痕跡。我要的是能證明有人先進來的東西。
    ja: それでは二十三時六分より早い痕跡は示せません。私が求めているのは、先に誰かが入ったと証明できるものです。
    voice:
      clip: ch1_kamiya_mio_0052
  - id: L047
    speaker: 神谷澪
    zh: 書記官，補一筆。三宅之前已有人進場，第三條矛盾成立。
    ja: 書記官、一点追記を。三宅さんより前に、すでに誰かが入っていました。第三の矛盾は成立とします。
    voice:
      clip: ch1_kamiya_mio_0053
  - id: L048
    speaker: 早坂茜
    zh: 三條矛盾已成立：小謊、死亡時間、有人先於三宅進場。
    ja: 矛盾は三つとも成立しました。小さな嘘、死亡時刻、そして三宅さんより先に入った人物です。
    voice:
      clip: ch1_hayasaka_akane_0173
  - id: L049
    speaker: 早坂茜
    expression: stern
    zh: 請核准限定片段，只比對摘要與本機順序。
    ja: 限定抜粋の承認をお願いします。照合するのは、サマリーと本体の記録順だけです。
    voice:
      clip: ch1_hayasaka_akane_0174
  - id: L050
    speaker: 神谷澪
    zh: 要我開那扇門，先把理由再擺一次。
    ja: その扉を開けさせたいのなら、まず理由をもう一度並べてください。
    voice:
      clip: ch1_kamiya_mio_0054
  - id: L051
    speaker: 相馬律
    zh: 要動那扇門，我把理由再理一次。
    ja: あの扉を動かすために、理由をもう一度整理します。
    voice:
      clip: ch1_soma_ritsu_0284
  - id: L052
    speaker: 相馬律
    zh: 這還不夠指到那一行，我得找出它是怎麼排進去的。
    ja: これだけでは、あの一行までは指せない。どう組み込まれたのかを突き止めないと。
    voice:
      clip: ch1_soma_ritsu_0285
  - id: L053
    speaker: 神谷澪
    zh: 本機順序已固定，但摘要那行秒數仍未對上。
    ja: 本体の記録順は保全されました。ですが、サマリーのあの行の秒数は、まだ合っていません。
    voice:
      clip: ch1_kamiya_mio_0055
  - id: L054
    speaker: 神谷澪
    zh: 先說清楚，你們要核准哪一筆、限定到哪裡。
    ja: まず明確にしてください。どの記録の承認を求め、どこまでに限定するのか。
    voice:
      clip: ch1_kamiya_mio_0056
  - id: L055
    speaker: 相馬律
    zh: 本機順序固定；請只核對摘要主時間線與它的來源。
    ja: 本体の記録順は保全済みです。照合は、サマリーの主タイムラインとその出どころだけに限ってください。
    voice:
      clip: ch1_soma_ritsu_0286
  - id: L056
    speaker: 神谷澪
    zh: 三條矛盾加上本機順序，足以核准限定片段；範圍外不給。
    ja: 三つの矛盾に、本体の記録順。限定抜粋を承認するには十分です。範囲外は出しません。
    voice:
      clip: ch1_kamiya_mio_0057
  - id: L057
    speaker: 神谷澪
    zh: 摘要整份我看過；我要的是把門鎖那一行排進主時間線的那張表。
    ja: サマリー全体には目を通しています。私が求めているのは、ドアロックの行を主タイムラインに組み込んだ、あの表です。
    voice:
      clip: ch1_kamiya_mio_0058
  - id: L058
    speaker: 黑瀨徹
    zh: 核准片段到手，證物鏈沒有斷點。
    ja: 承認済み抜粋は受け取った。証拠の保管記録に切れ目はない。
    voice:
      clip: ch1_kurose_toru_0044
  - id: L059
    speaker: 神谷澪
    zh: 第四條。門鎖紀錄未被偽造，三宅那個時間可信。
    ja: 第四の点。ドアロックの記録は偽造されていません。三宅さんのあの時刻は信用できます。
    voice:
      clip: ch1_kamiya_mio_0059
  - id: L060
    speaker: 神谷澪
    zh: 這行時間你要翻，再指一次。
    ja: この行の時刻を覆したいのなら、もう一度示してください。
    voice:
      clip: ch1_kamiya_mio_0060
  - id: L061
    speaker: 相馬律
    zh: 這行時間，我再讀一次。
    ja: この行の時刻を、もう一度読み直します。
    voice:
      clip: ch1_soma_ritsu_0287
  - id: L062
    speaker: 相馬律
    zh: 這句，先讓我比一下。
    ja: そこを一度、比べさせてください。
    voice:
      clip: ch1_soma_ritsu_0288
  - id: L063
    speaker: 神谷澪
    zh: 這一句沒問題，換個東西。
    ja: この発言に問題はありません。ほかのものを。
    voice:
      clip: ch1_kamiya_mio_0061
  - id: L064
    speaker: 相馬律
    zh: 沒人說造假。要對的是核准片段和摘要，兩邊並排。
    ja: 偽造だと言った人はいない。照らし合わせるのは、承認済み抜粋とサマリーだ。二つを並べて。
    voice:
      clip: ch1_soma_ritsu_0289
  - id: L065
    speaker: 神谷澪
    zh: 門鎖紀錄未被改過，二十三點零七分五十秒也清楚。
    ja: ドアロックの記録は改ざんされていません。二十三時七分五十秒も明確です。
    voice:
      clip: ch1_kamiya_mio_0062
  - id: L066
    speaker: 神谷澪
    zh: 門、鏡頭、憑證都對得上三宅；摘要抓到的是最好對上的一筆。
    ja: 扉、カメラ、認証。いずれも三宅さんと合致します。サマリーが拾ったのは、最もよく合う一件です。
    voice:
      clip: ch1_kamiya_mio_0063
  - id: L067
    speaker: 相馬律
    zh: 紀錄沒造假，錯的是讀法；請對照核准片段的本機順序。
    ja: 記録は偽造されていません。誤っているのは読み方です。承認済み抜粋にある本体の記録順と照らし合わせてください。
    voice:
      clip: ch1_soma_ritsu_0290
  - id: L068
    speaker: 相馬律
    zh: 外包憑證早於三宅憑證；摘要在其後合併，二十三點零七分五十秒是合併時間，不是進門時間。
    ja: 外注認証は、三宅さんの認証より先です。サマリーはその後で統合しました。二十三時七分五十秒は統合時刻であって、入室時刻ではありません。
    voice:
      clip: ch1_soma_ritsu_0291
  - id: L069
    speaker: 神谷澪
    zh: 本機順序沒被動過手腳，但它不在核准範圍裡。把核准的片段和摘要並排，才看得出讀法哪裡錯。
    ja: 本体の記録順に手は加えられていません。ですが、それは承認の範囲に入っていません。承認された抜粋とサマリーを並べれば、読み方のどこが誤りか分かります。
    voice:
      clip: ch1_kamiya_mio_0064
  - id: L070
    speaker: 神谷澪
    zh: 最後一條。就算三宅的嫌疑降下來了，你也證不了是北見殺的人。
    ja: 最後の点。三宅さんの嫌疑が薄れたとしても、北見さんが殺したとは証明できません。
    voice:
      clip: ch1_kamiya_mio_0065
  - id: L071
    speaker: 神谷澪
    zh: 要把他放進那一刻，你再指一次。
    ja: 彼をあの瞬間に置きたいのなら、もう一度示してください。
    voice:
      clip: ch1_kamiya_mio_0066
  - id: L072
    speaker: 相馬律
    zh: 把他放進那一刻，我再想一次。
    ja: 彼をあの瞬間に置く根拠を、もう一度考えます。
    voice:
      clip: ch1_soma_ritsu_0292
  - id: L073
    speaker: 相馬律
    zh: 這句，先讓我對一下。
    ja: そこを一度、照合させてください。
  - id: L074
    speaker: 神谷澪
    zh: 這放不進那一刻，換一個。
    ja: それでは、彼をあの瞬間に置けません。別のものを。
    voice:
      clip: ch1_kamiya_mio_0067
  - id: L075
    speaker: 相馬律
    zh: 不是靠印象定他，我得找那張把他放進後場的東西。
    ja: 印象で決めるんじゃない。彼をバックヤードに置く、あの一枚を探さないと。
    voice:
      clip: ch1_soma_ritsu_0293
  - id: L076
    speaker: 神谷澪
    zh: 拆掉三宅，不等於補上北見。
    ja: 三宅さんを外したからといって、そこに北見さんが収まるわけではありません。
    voice:
      clip: ch1_kamiya_mio_0068
  - id: L077
    speaker: 神谷澪
    zh: 沒有人證、沒有兇手的時間，你憑什麼說是他？
    ja: 証人もいなければ、犯人がいた時刻もありません。何をもって彼だと言うのですか？
    voice:
      clip: ch1_kamiya_mio_0069
  - id: L078
    speaker: 神谷澪
    zh: 你拆了摘要那條線，那一格現在是空的。空格不會自己填上北見的名字。
    ja: サマリーの線を崩したことで、あの欄は今、空欄です。空欄に、北見さんの名前がひとりでに入ることはありません。
    voice:
      clip: ch1_kamiya_mio_0070
  - id: L079
    speaker: 相馬律
    zh: 那一格能填。那晚誰能用那組外包憑證，查得出來。
    ja: あの欄は埋められます。あの夜、あの外注認証を使えたのが誰か、調べれば分かります。
    voice:
      clip: ch1_soma_ritsu_0294
  - id: L080
    speaker: 相馬律
    zh: 事件一八四二的外包憑證，那晚只有北見能用。增田二十二點五十備忘裡的 K，和第二杯咖啡的 K.，都是他；他也承認那個時間見過增田。
    ja: イベント1842の外注認証を、あの夜使えたのは北見さんだけです。増田さんの二十二時五十分のメモにあるKも、二杯目のコーヒーのK.も、彼のことです。彼自身も、その時刻に増田さんと会ったと認めています。
    voice:
      clip: ch1_soma_ritsu_0295
  - id: L081
    speaker: 神谷澪
    zh: 這和工單、憑證、傘套都沾邊，但沒有把任何一個人放進那個空位。
    ja: それは作業票にも認証にも傘袋にも関わりますが、あの空欄に人を一人も入れられていません。
    voice:
      clip: ch1_kamiya_mio_0071
  - id: L093
    speaker: 神谷澪
    zh: 動機這一格，你再指一次。
    ja: 動機の欄を、もう一度示してください。
    voice:
      clip: ch1_kamiya_mio_0072
  - id: L094
    speaker: 相馬律
    zh: 他為什麼要動手，我再想一次。
    ja: 彼がなぜ手を下したのか、もう一度考えます。
    voice:
      clip: ch1_soma_ritsu_0332
  - id: L095
    speaker: 相馬律
    zh: 這句，我再核對一下。
    ja: この点、もう一度照合します。
    voice:
      clip: ch1_soma_ritsu_0333
  - id: L096
    speaker: 神谷澪
    zh: 這說不出他為什麼要動手，換一個。
    ja: それでは、彼がなぜ手を下したのかは説明できません。別のものを。
    voice:
      clip: ch1_kamiya_mio_0073
  - id: L097
    speaker: 相馬律
    zh: 光有人在場不夠，我得找他非動手不可的理由。
    ja: その場にいただけでは足りない。彼が手を下さずにいられなかった理由を探さないと。
    voice:
      clip: ch1_soma_ritsu_0334
  - id: L098
    speaker: 神谷澪
    zh: 在場不等於動手。承包商沒有理由殺一個同事。
    ja: その場にいたことは、手を下したことを意味しません。委託業者に、同僚を殺す理由はありません。
    voice:
      clip: ch1_kamiya_mio_0074
  - id: L099
    speaker: 神谷澪
    zh: 沒有動機，這條鏈還是斷的。
    ja: 動機がなければ、この連鎖はまだ途切れています。
    voice:
      clip: ch1_kamiya_mio_0075
  - id: L100
    speaker: 相馬律
    zh: 他有理由。增田那時在查的，就是這件事。
    ja: 彼には理由があります。増田さんがあのとき調べていたのが、まさにそのことです。
    voice:
      clip: ch1_soma_ritsu_0335
  - id: L101
    speaker: 相馬律
    zh: 增田要檢舉北見盜賣 KAGAMI 試點資料。草稿已經備好，他的合約審查就在隔天。
    ja: 増田さんは、北見さんが KAGAMI の試験運用データを横流ししていることを告発しようとしていました。下書きはすでに用意されていて、彼の契約審査は翌日でした。
    voice:
      clip: ch1_soma_ritsu_0336
  - id: L102
    speaker: 神谷澪
    zh: 草稿本身沒離開過草稿匣。我要看的是增田到底要檢舉什麼。
    ja: 下書きそのものは、下書きフォルダから出ていません。私が見たいのは、増田さんが何を告発しようとしていたのか、です。
    voice:
      clip: ch1_kamiya_mio_0076
  - id: L082
    speaker: 相馬律
    zh: 核准片段裡，本機順序和摘要擺在一起，前後卻對不上。
    ja: 承認済み抜粋の中で、本体の記録順とサマリーが並んでいる。なのに、前後が合わない。
    voice:
      clip: ch1_soma_ritsu_0296
  - id: L083
    speaker: 相馬律
    zh: 二十三點零七分五十秒，是摘要排上的時間；不是三宅進門那一刻。
    ja: 二十三時七分五十秒は、サマリーが当てはめた時刻だ。三宅さんが入った瞬間じゃない。
    voice:
      clip: ch1_soma_ritsu_0297
  - id: L084
    speaker: 早坂茜
    zh: 這段的來路對得上，可以拿上桌。
    ja: この抜粋、出どころは合ってる。審査の場に出せる。
    voice:
      clip: ch1_hayasaka_akane_0175
