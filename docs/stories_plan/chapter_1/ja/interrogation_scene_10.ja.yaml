schemaVersion: 1
locale: ja
source: docs/stories_plan/chapter_1/interrogation_scene_10.md
lines:
  - speaker: 相馬律
    zh: 三條都帶到了。今天看能不能一次推到位。
    ja: 三つとも揃えてきた。今日で一気に押し切れるかどうかだ。
  - speaker: 早坂茜
    zh: 穩著問。她信摘要，別想一步到位。
    ja: 焦らずに詰めて。向こうはサマリーを信じてる。一度で押し切ろうとしないで。
  - speaker: 早坂茜
    zh: 辯方手上，有好幾條彼此獨立的矛盾。
    ja: 弁護側には、互いに独立した矛盾がいくつもあります。
  - speaker: 早坂茜
    zh: 時間、動線、動機，都對不上摘要那條主時間線。
    ja: 時間、動線、動機。いずれもサマリーの主タイムラインと合いません。
  - speaker: 神谷澪
    zh: 辯方準備好了，我這邊隨時可以開始。
    ja: 弁護側の準備が整っているのでしたら、こちらはいつでも始められます。
  - speaker: 早坂茜
    zh: 不過我先講清楚程序。
    ja: ただ、先に手続きをはっきりさせておきます。
  - speaker: 早坂茜
    zh: 那段後場門鎖的核准片段，現在還沒核准調出。
    ja: バックヤードのドアロックの承認済み抜粋は、まだ開示の許可が出ていません。
  - speaker: 神谷澪
    zh: 對。我不會因為你們說「有矛盾」就准許調出核准片段。
    ja: そうです。「矛盾がある」と言われただけで、承認済み抜粋の開示を認めることはありません。
  - speaker: 神谷澪
    zh: 先用你們已經拿到的材料，把摘要那條時間線動搖了。
    ja: まず、すでに手元にある材料で、サマリーのタイムラインを揺るがしてください。
  - speaker: 神谷澪
    zh: 我才會考慮開那扇門。
    ja: その扉を開けるかどうかは、それから考えます。
  - speaker: 相馬律
    zh: 可以。我們一條一條來。
    ja: 分かりました。一つずつ進めます。
  - speaker: 相馬律
    zh: ……第一次坐在這邊。
    ja: ……こっち側に座るのは、初めてだ。
  - speaker: 早坂茜
    zh: 材料都在桌上了。你只管問。
    ja: 材料は全部、机に出てる。あとは聞くことだけ考えて。
  - speaker: 神谷澪
    expression: conceding
    zh: ……工單和憑證把那個空位對到北見。
    ja: ……作業票と認証が、あの空欄を北見さんに結びつけました。
  - speaker: 神谷澪
    expression: conceding
    zh: 水痕與傘套，只保留後巷動線的前後脈絡。
    ja: 水の跡と傘袋は、裏路地の動線の前後関係としてのみ扱います。
  - speaker: 神谷澪
    expression: conceding
    zh: 北見修一，指認成立。三宅蒼太的主嫌方向，撤回。
    ja: 北見修一、特定が成立。三宅蒼太を主たる被疑者とする方向は、撤回します。
  - speaker: 神谷澪
    expression: conceding
    zh: 審查會保留這條鏈，轉入重新調查。原本那條主時間線，不再採用。
    ja: 審査会はこの証拠の連鎖を保持し、再捜査に移します。当初の主タイムラインは、今後採用しません。
  - speaker: 早坂茜
    zh: 程序上，三宅這邊洗清了。重新調查的入口，我們守住了。
    ja: 手続きの上では、三宅さんの嫌疑は晴れた。再捜査への入口は、私たちが守り切った。
  - speaker: 相馬律
    zh: 三宅的母親，可以把那袋飯糰帶回家了。
    ja: これで三宅さんのお母さんも、あのおにぎりの袋を家に持って帰れる。
  - speaker: 相馬律
    zh: 剩下的，交給重新調查。
    ja: 残りは、再捜査に任せよう。
  - speaker: 早坂茜
    zh: 走。重新調查那邊，明天先遞狀。
    ja: 行こう。再捜査のほうは、明日まず書面を出す。
  - speaker: 神谷澪
    zh: 第一條，從證詞可信度開始。
    ja: 第一の点。供述の信用性から始めます。
  - speaker: 神谷澪
    zh: 哪一句還對不上，你再指一次。
    ja: どの発言がまだ合わないのか、もう一度示してください。
  - speaker: 相馬律
    zh: 哪一句對不上，我再確認一次。
    ja: どの発言が合わないのか、もう一度確かめます。
  - speaker: 相馬律
    zh: 這句先停一下。
    ja: その発言、一度止めてください。
  - speaker: 神谷澪
    zh: 這一句我沒說錯，換個東西再來。
    ja: この発言に誤りはありません。別のものを持って、出直してください。
  - speaker: 相馬律
    zh: 不是比人品，要對的是那句謊話。
    ja: 人柄を比べる話じゃない。突き合わせるべきは、あの嘘のほうだ。
  - speaker: 神谷澪
    expression: skeptical
    zh: 三宅有兩個小謊，摘要因此把他列為主嫌。
    ja: 三宅さんには小さな嘘が二つあります。サマリーはそれを理由に、彼を主たる被疑者としました。
  - speaker: 神谷澪
    expression: skeptical
    zh: 小謊既然成立，摘要的可信度就高於他的說法。
    ja: 小さな嘘が認められる以上、サマリーの信用性は彼の供述を上回ります。
  - speaker: 神谷澪
    expression: skeptical
    zh: 這一條，先按程序確認。
    ja: この点は、まず手続きどおりに確認します。
  - speaker: 相馬律
    zh: 他說的那兩個謊，我都能對上該有的東西。先看那段閉店流程。
    ja: 彼の二つの嘘は、どちらも本来あるべきものと突き合わせられます。まずは、あの閉店作業を見てください。
  - speaker: 相馬律
    zh: 蛋糕盒與母親通話都對得上閉店流程；是小謊，不是殺人。
    ja: ケーキの箱も、母親との通話も、閉店作業と辻褄が合います。小さな嘘であって、殺人ではありません。
  - speaker: 神谷澪
    zh: 人格不是證據。他孝不孝順，跟那一晚有沒有殺人，是兩回事。拿能對上那句謊話的東西來。
    ja: 人柄は証拠ではありません。親孝行かどうかと、あの夜に人を殺したかどうかは別の問題です。あの嘘と突き合わせられるものを出してください。
  - speaker: 神谷澪
    zh: 要往前移那條死亡時間，你再指一次。
    ja: 死亡時刻を前に動かしたいのなら、もう一度示してください。
  - speaker: 相馬律
    zh: 那條死亡時間，我再看一次。
    ja: 死亡時刻を、もう一度見直します。
  - speaker: 相馬律
    zh: 這句，我想再確認一下。
    ja: その点、もう一度確認させてください。
  - speaker: 神谷澪
    zh: 這對不上死亡那一分鐘，換一個。
    ja: それでは、死亡したその一分には結びつきません。別のものを。
  - speaker: 相馬律
    zh: 這換不到死亡那一刻，我再找別的。
    ja: これじゃ死亡の瞬間まで届かない。別のものを探そう。
  - speaker: 神谷澪
    zh: 摘要把死亡排在三宅進後場之後，並以他的動線作主錨。
    ja: サマリーは、死亡を三宅さんがバックヤードに入った後に置き、彼の動線を主たる基準に据えています。
  - speaker: 神谷澪
    zh: 要往前移，必須有更硬的時間紀錄。
    ja: 前に動かすのなら、より確かな時刻の記録が必要です。
  - speaker: 相馬律
    zh: 那條死亡時間，得往前移。看死者手機那則通知停在幾分。
    ja: 死亡時刻は、前に動かす必要があります。被害者のスマホの通知が、何分で止まっているかを見てください。
  - speaker: 相馬律
    zh: 手機通知與後場紀錄顯示衝突早於摘要；摘要的主時間線不成立。
    ja: スマホの通知とバックヤードの記録は、衝突がサマリーより早かったことを示しています。サマリーの主タイムラインは成り立ちません。
  - speaker: 神谷澪
    zh: 那杯咖啡只證明第二個人被等著、提早到了，證不到死亡的那一分鐘。別拿它當死亡時刻。
    ja: あのコーヒーが示すのは、もう一人が待たれていて、早めに着いていたことだけです。死亡したその一分までは証明できません。あれを死亡時刻と見なさないでください。
  - speaker: 神谷澪
    zh: 要把他從那個位置拉開，你再指一次。
    ja: 彼をあの位置から引き離したいのなら、もう一度示してください。
  - speaker: 相馬律
    zh: 把他放在那個位置的理由，再擺一次。
    ja: 彼をあの位置に置いた根拠を、もう一度並べ直します。
  - speaker: 相馬律
    zh: 這句，先讓我對一下。
    ja: そこを一度、照合させてください。
  - speaker: 神谷澪
    zh: 這證不到是哪一個人，換一個。
    ja: それでは、誰なのかまでは証明できません。別のものを。
  - speaker: 相馬律
    zh: 這對不到是哪一個人，下一步找工單和憑證。
    ja: これじゃ誰なのかまでは届かない。次に当たるのは作業票と認証だ。
  - speaker: 神谷澪
    zh: 時間往前移，不等於換了人；三宅仍可能在後場。
    ja: 時刻が前に動いても、人が替わったことにはなりません。三宅さんがバックヤードにいた可能性は残ります。
  - speaker: 神谷澪
    zh: 要排除他，必須證明更早的進場者另有其人。
    ja: 彼を外すのなら、それより早く入った者が別にいると証明しなければなりません。
  - speaker: 相馬律
    zh: 要把他從那個位置拉開，就看他那時的視線回放。
    ja: 彼をあの位置から引き離すなら、そのときの視線の再現を見てください。
  - speaker: 相馬律
    zh: L 型轉角擋住三宅視線；半乾水跡證明有人在他之前走過承包商動線。
    ja: L字の曲がり角が、三宅さんの視界を遮っています。半乾きの水の跡は、彼より先に誰かが業者側の動線を通ったことを証明しています。
  - speaker: 神谷澪
    zh: 傘套只留下後來的雨水，不能替更早水痕認人。要把那個空位對到人，得靠工單和外包憑證。
    ja: 傘袋に残っているのは、後から来た雨水だけです。それより早い水の跡が誰のものかは示せません。あの空欄を人に結びつけるには、作業票と外注認証が必要です。
  - speaker: 神谷澪
    zh: 書記官，補一筆。三宅站位無法目視屍體，第三條矛盾成立。
    ja: 書記官、一点追記を。三宅さんの立ち位置からは、遺体を目視できません。第三の矛盾は成立とします。
  - speaker: 早坂茜
    zh: 三條矛盾已成立：小謊、死亡時間、第三者先行進場。
    ja: 矛盾は三つとも成立しました。小さな嘘、死亡時刻、そして先に入っていた第三者です。
  - speaker: 早坂茜
    expression: stern
    zh: 請核准限定片段，只比對摘要與本機順序。
    ja: 限定抜粋の承認をお願いします。照合するのは、サマリーと本体の記録順だけです。
  - speaker: 神谷澪
    zh: 要我開那扇門，先把理由再擺一次。
    ja: その扉を開けさせたいのなら、まず理由をもう一度並べてください。
  - speaker: 相馬律
    zh: 要動那扇門，我把理由再理一次。
    ja: あの扉を動かすために、理由をもう一度整理します。
  - speaker: 相馬律
    zh: 不是這個，我得先找到那份摘要。
    ja: これじゃない。まず、あのサマリーを見つけないと。
  - speaker: 神谷澪
    zh: 本機順序已固定，但摘要那行秒數仍未對上。
    ja: 本体の記録順は保全されました。ですが、サマリーのあの行の秒数は、まだ合っていません。
  - speaker: 神谷澪
    zh: 先說清楚，你們要核准哪一筆、限定到哪裡。
    ja: まず明確にしてください。どの記録の承認を求め、どこまでに限定するのか。
  - speaker: 相馬律
    zh: 本機順序固定；請只核對摘要主時間線與它的來源。
    ja: 本体の記録順は保全済みです。照合は、サマリーの主タイムラインとその出どころだけに限ってください。
  - speaker: 神谷澪
    zh: 三條矛盾加上本機順序，足以核准限定片段；範圍外不給。
    ja: 三つの矛盾に、本体の記録順。限定抜粋を承認するには十分です。範囲外は出しません。
  - speaker: 神谷澪
    zh: 這動搖不了那行時間。拿那份把門鎖排成主時間線的摘要來，我才知道你們要翻哪一筆。
    ja: それでは、あの行の時刻は動きません。ドアロックを主タイムラインに組み込んだサマリーを出してください。それで初めて、どの記録を覆したいのかが分かります。
  - speaker: 黑瀨徹
    zh: 核准片段到手，證物鏈沒有斷點。
    ja: 承認済み抜粋は受け取った。証拠の保管記録に切れ目はない。
  - speaker: 神谷澪
    zh: 第四條。門鎖紀錄未被偽造，三宅那個時間可信。
    ja: 第四の点。ドアロックの記録は偽造されていません。三宅さんのあの時刻は信用できます。
  - speaker: 神谷澪
    zh: 這行時間你要翻，再指一次。
    ja: この行の時刻を覆したいのなら、もう一度示してください。
  - speaker: 相馬律
    zh: 這行時間，我再讀一次。
    ja: この行の時刻を、もう一度読み直します。
  - speaker: 相馬律
    zh: 這句，先讓我比一下。
    ja: そこを一度、比べさせてください。
  - speaker: 神谷澪
    zh: 這一句沒問題，換個東西。
    ja: この発言に問題はありません。ほかのものを。
  - speaker: 相馬律
    zh: 不是造假的事，要拿的是本機那份事件順序。
    ja: 偽造の話じゃない。出すべきは、本体の記録順のほうだ。
  - speaker: 神谷澪
    zh: 門鎖紀錄未被改過，二十三點零七分五十秒也清楚。
    ja: ドアロックの記録は改ざんされていません。二十三時七分五十秒も明確です。
  - speaker: 神谷澪
    zh: 門、鏡頭、憑證都對得上三宅；摘要抓到的是最好對上的一筆。
    ja: 扉、カメラ、認証。いずれも三宅さんと合致します。サマリーが拾ったのは、最もよく合う一件です。
  - speaker: 相馬律
    zh: 紀錄沒造假，錯的是讀法；請對照核准片段的本機順序。
    ja: 記録は偽造されていません。誤っているのは読み方です。承認済み抜粋にある本体の記録順と照らし合わせてください。
  - speaker: 相馬律
    zh: 外包憑證早於三宅憑證；摘要在其後合併，二十三點零七分五十秒是合併時間，不是進門時間。
    ja: 外注認証は、三宅さんの認証より先です。サマリーはその後で統合しました。二十三時七分五十秒は統合時刻であって、入室時刻ではありません。
  - speaker: 神谷澪
    zh: 本機順序沒有被動過手腳。錯的不是門鎖，是摘要對它的讀法。別把這頂帽子扣到造假上。
    ja: 本体の記録順に、手は加えられていません。誤っているのはドアロックではなく、サマリーの読み方です。偽造のレッテルを貼らないでください。
  - speaker: 神谷澪
    zh: 最後一條。就算三宅的嫌疑降下來了，你也證不了是北見殺的人。
    ja: 最後の点。三宅さんの嫌疑が薄れたとしても、北見さんが殺したとは証明できません。
  - speaker: 神谷澪
    zh: 要把他放進那一刻，你再指一次。
    ja: 彼をあの瞬間に置きたいのなら、もう一度示してください。
  - speaker: 相馬律
    zh: 把他放進那一刻，我再想一次。
    ja: 彼をあの瞬間に置く根拠を、もう一度考えます。
  - speaker: 神谷澪
    zh: 這放不進那一刻，換一個。
    ja: それでは、彼をあの瞬間に置けません。別のものを。
  - speaker: 相馬律
    zh: 不是靠印象定他，我得找那張把他放進後場的東西。
    ja: 印象で決めるんじゃない。彼をバックヤードに置く、あの一枚を探さないと。
  - speaker: 神谷澪
    zh: 拆掉三宅，不等於補上北見。
    ja: 三宅さんを外したからといって、そこに北見さんが収まるわけではありません。
  - speaker: 神谷澪
    zh: 沒有人證、沒有兇手的時間，你憑什麼說是他？
    ja: 証人もいなければ、犯人がいた時刻もありません。何をもって彼だと言うのですか？
  - speaker: 神谷澪
    zh: 你拆了摘要那條線，那一格現在是空的。空格不會自己填上北見的名字。
    ja: サマリーの線を崩したことで、あの欄は今、空欄です。空欄に、北見さんの名前がひとりでに入ることはありません。
  - speaker: 相馬律
    zh: 那一格能填。臨時維護工單對上那組外包憑證，權限名單再把它們只對到北見一個人。
    ja: あの欄は埋められます。臨時のメンテナンス作業票はあの外注認証と合致し、権限リストがそれを北見さん一人に絞り込みます。
  - speaker: 相馬律
    zh: 權限名單只對到北見。備忘、第二杯咖啡的 K、盜賣紀錄和帳號審核壓力，補上動機和壓力。水痕與傘套留在承包商動線前後。摘要把三宅排進了那個時間。
    ja: 権限リストが指すのは、北見さんだけです。メモ、二杯目のコーヒーのK、横流しの記録、アカウント審査の重圧。それが動機と、追い詰められていた事情を補います。水の跡と傘袋は、業者側の動線の前後にとどまります。サマリーは、三宅さんをあの時刻に当てはめていたんです。
  - speaker: 神谷澪
    zh: 動線你已經在第三條證過了，傘套再擺一次也只回到原處。要填進北見的名字，缺的是把他和那個空位對上的工單與憑證。
    ja: 動線は、第三の点ですでに証明されています。傘袋を並べ直しても、元の場所に戻るだけです。北見さんの名前を入れるのに足りないのは、彼とあの空欄を結びつける作業票と認証です。
  - speaker: 相馬律
    zh: 核准片段裡，本機順序和摘要擺在一起，前後卻對不上。
    ja: 承認済み抜粋の中で、本体の記録順とサマリーが並んでいる。なのに、前後が合わない。
  - speaker: 相馬律
    zh: 二十三點零七分五十秒，是摘要排上的時間；不是三宅進門那一刻。
    ja: 二十三時七分五十秒は、サマリーが当てはめた時刻だ。三宅さんが入った瞬間じゃない。
  - speaker: 早坂茜
    zh: 這段的來路對得上，可以拿上桌。
    ja: この抜粋、出どころは合ってる。審査の場に出せる。
