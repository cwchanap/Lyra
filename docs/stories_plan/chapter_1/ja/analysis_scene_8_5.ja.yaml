schemaVersion: 1
locale: ja
source: docs/stories_plan/chapter_1/analysis_scene_8_5.md
lines:
  - id: L001
    speaker: 早坂茜
    zh: 坐下。
    ja: 座って。
    voice:
      clip: ch1_hayasaka_akane_0112
  - id: L002
    speaker: 相馬律
    zh: 我還站得住。
    ja: まだ立ってられる。
    voice:
      clip: ch1_soma_ritsu_0209
  - id: L003
    speaker: 早坂茜
    zh: 你剛才把外包憑證直接叫成兇手。
    ja: さっき、外注認証をそのまま犯人呼ばわりした。
    voice:
      clip: ch1_hayasaka_akane_0113
  - id: L004
    speaker: 相馬律
    zh: ……坐一下。
    ja: ……少しだけ座る。
    voice:
      clip: ch1_soma_ritsu_0210
  - id: L005
    speaker: 早坂茜
    zh: 水。
    ja: 水。
    voice:
      clip: ch1_hayasaka_akane_0114
  - id: L006
    speaker: 相馬律
    zh: 妳包裡到底裝了多少東西？
    ja: その鞄、いったい何がどれだけ入ってるんだ？
    voice:
      clip: ch1_soma_ritsu_0211
  - id: L007
    speaker: 早坂茜
    zh: 能讓搭檔不倒下的東西。
    ja: 相棒を倒れさせないためのもの。
    voice:
      clip: ch1_hayasaka_akane_0115
  - id: L008
    speaker: 相馬律
    zh: 又回到這張桌子。
    ja: また、この机に戻ってきた。
    voice:
      clip: ch1_soma_ritsu_0212
  - id: L009
    speaker: 早坂茜
    zh: 又說了一次「收工再吃」。
    ja: 「片付いてから食べる」、また言った。
    voice:
      clip: ch1_hayasaka_akane_0116
  - id: L010
    speaker: 相馬律
    zh: 妳記仇？
    ja: 根に持ってるのか？
    voice:
      clip: ch1_soma_ritsu_0213
  - id: L011
    speaker: 早坂茜
    zh: 我留紀錄。
    ja: 記録を残してるだけ。
    voice:
      clip: ch1_hayasaka_akane_0117
  - id: L012
    speaker: 相馬律
    zh: 這張也放上來。
    ja: これも並べておく。
    voice:
      clip: ch1_soma_ritsu_0214
  - id: L013
    speaker: 早坂茜
    zh: 正式證物，放小謊那欄。
    ja: 正式な証拠品。小さな嘘の欄へ。
    voice:
      clip: ch1_hayasaka_akane_0118
  - id: L014
    speaker: 相馬律
    zh: 其餘先留白。我不替空位猜人。
    ja: 残りはまだ空けておく。空欄に、当て推量で人は入れない。
    voice:
      clip: ch1_soma_ritsu_0215
  - id: L015
    speaker: 相馬律
    zh: 我急著找兇手時，也差點把三宅的小謊塞進同一欄。
    ja: 犯人探しを焦って、三宅さんの小さな嘘まで同じ欄に押し込むところだった。
    voice:
      clip: ch1_soma_ritsu_0216
  - id: L016
    speaker: 早坂茜
    zh: 你肯停手重排，就還來得及。
    ja: 手を止めて並べ直せるなら、まだ間に合う。
    voice:
      clip: ch1_hayasaka_akane_0119
  - id: L018
    speaker: 相馬律
    zh: 本機順序和摘要對不上；二十三點零七分五十秒是合併完成的時間，不是某一個人的事件時間。
    ja: 本体の記録順とサマリーが合わない。二十三時七分五十秒は統合が完了した時刻で、誰か一人のイベントの時刻じゃない。
    voice:
      clip: ch1_soma_ritsu_0218
  - id: L019
    speaker: 早坂茜
    zh: 把這句寫進申請。
    ja: その一文を申請書に。
    voice:
      clip: ch1_hayasaka_akane_0120
  - id: L020
    speaker: 相馬律
    zh: 申請寫好了。我的字開始飄了。
    ja: 申請書、書けた。字が踊ってきた。
    voice:
      clip: ch1_soma_ritsu_0219
  - id: L021
    speaker: 早坂茜
    zh: 先別送。再看一遍，有沒有寫過頭？
    ja: まだ出さないで。もう一度見て、書きすぎてない？
    voice:
      clip: ch1_hayasaka_akane_0121
  - id: L022
    speaker: 相馬律
    zh: 看過了。外部憑證還沒有身分。
    ja: 見た。外部認証には、まだ身元がない。
    voice:
      clip: ch1_soma_ritsu_0220
  - id: L023
    speaker: 早坂茜
    zh: 好。餅乾一人一半。
    ja: よし。クッキー、半分ずつ。
    voice:
      clip: ch1_hayasaka_akane_0122
  - id: L024
    speaker: 早坂茜
    zh: 工單那條線，黑瀨刑警在幫我們談。
    ja: 作業票の線は、黒瀬刑事が掛け合ってくれてる。
    voice:
      clip: ch1_hayasaka_akane_0123
  - id: L030
    speaker: 相馬律
    zh: 那就等他的消息。
    ja: それなら、向こうの知らせを待つ。
    voice:
      clip: ch1_soma_ritsu_0328
  - id: L026
    speaker: 相馬律
    expression: relieved
    zh: 餅乾真的分我一半？
    ja: クッキー、本当に半分くれるのか？
    voice:
      clip: ch1_soma_ritsu_0222
  - id: L027
    speaker: 早坂茜
    zh: 你先把水喝完。
    ja: 先に水を飲み切って。
    voice:
      clip: ch1_hayasaka_akane_0124
  - id: L028
    speaker: 相馬律
    zh: 這算合作默契？
    ja: これって、息が合ってるってことか？
    voice:
      clip: ch1_soma_ritsu_0223
  - id: L029
    speaker: 早坂茜
    zh: 這算避免搭檔倒在證據桌上。
    ja: 相棒が証拠の机に倒れ込まないための予防。
    voice:
      clip: ch1_hayasaka_akane_0125
