schemaVersion: 1
locale: ja
source: docs/stories_plan/chapter_1/scene_p0.md
lines:
  - id: L009
    speaker: 旁白
    zh: 吉祥寺的一間咖啡館，後場有人死了。
    ja: 吉祥寺のあるカフェのバックヤードで、人が死んだ。
  - id: L010
    speaker: 旁白
    zh: 摘要系統只用了一夜，就替這件事找好了兇手。
    ja: サマリーシステムは、たった一晩で、この件の犯人を割り出した。
  - id: L011
    speaker: 旁白
    zh: 一名咖啡館店員。
    ja: カフェの店員、一人。
  - id: L012
    speaker: 旁白
    zh: 每一條紀錄都對得上，沒有一行對不起來。
    ja: どの記録も合っていて、合わない行は一行もなかった。
  - id: L013
    speaker: 旁白
    zh: 只有一個人不信。一位母親。
    ja: 信じなかったのは、ただ一人。ある母親。
  - id: L014
    speaker: 旁白
    zh: 這是之後才會發生的事。
    ja: これは、あとになって起きることだ。
  - id: L015
    speaker: 旁白
    zh: 在那之前，城市還在下雨。
    ja: それより前、街にはまだ雨が降っている。
  - id: L001
    speaker: 旁白
    zh: 東京，下雨的傍晚。
    ja: 東京、雨の夕暮れ。
  - id: L002
    speaker: 旁白
    zh: KAGAMI Evidence Summary Pilot：證據摘要審查會擴大試行。
    ja: KAGAMI Evidence Summary Pilot：証拠サマリー審査会、試行を拡大。
    note: News caption read off a station screen; the English title stays in English.
  - id: L003
    speaker: 路人甲
    zh: 新聞說現在連證據都能先整理好。
    ja: ニュースで言ってた。今は証拠まで先に整理してくれるんだって。
  - id: L004
    speaker: 路人乙
    zh: 有系統整理，也好，總比誰聲音大誰贏。
    ja: システムが整理してくれるなら、それもいいよ。声の大きい方が勝つよりはまし。
  - id: L005
    speaker: 旁白
    zh: 腳步比雨聲還急。
    ja: 雨音よりも、足音のほうがせわしない。
  - id: L006
    speaker: 旁白
    zh: 看板上，影片正在播放。
    ja: 看板の画面に、映像が流れている。
  - id: L007
    speaker: 旁白
    zh: 畫面很乾淨，字也很整齊。
    ja: 画面はきれいで、文字も整然と並んでいる。
  - id: L008
    speaker: 路人丙
    zh: 有系統整理，應該比較不會冤枉人吧。
    ja: システムが整理してくれるなら、濡れ衣を着せられる人も減るんだろうね。
