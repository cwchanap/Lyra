schemaVersion: 1
locale: ja
source: docs/stories_plan/chapter_1/scene_6.md
lines:
  - speaker: 旁白
    zh: 審查會結束後，雨又下起來了。
    ja: 審査会が終わると、また雨が降り出した。
  - speaker: 旁白
    zh: 兩人沒急著走，在便利店的屋簷下停了下來。
    ja: 二人は急いで帰ることもなく、コンビニの軒下で足を止めた。
  - speaker: 早坂茜
    zh: 先喝。你的胃今天只收過一個麵包。
    ja: 先に飲んで。今日、胃に入ったのはパン一個だけ。
  - speaker: 相馬律
    zh: 事務所那台咖啡機還是壞的。中午只啃了個麵包。
    ja: 事務所のコーヒーメーカー、まだ壊れてるんだ。昼はパンをかじっただけ。
  - speaker: 早坂茜
    zh: 等雨小一點，再買飯糰。
    ja: 雨が少し弱まったら、おにぎりを買う。
  - speaker: 相馬律
    zh: 你每次都拿紙本收據。
    ja: いつも紙のレシートをもらうよな。
  - speaker: 早坂茜
    zh: 紙的至少摸得到，放進包裡不會自己換地方。
    ja: 紙なら、少なくとも手で触れる。鞄に入れておけば、勝手に場所が変わらない。
  - speaker: 相馬律
    zh: 你以前帶我跑第一個審查會，也先塞咖啡。
    ja: 初めて審査会に連れていってくれたときも、まずコーヒーを押しつけてきたよな。
  - speaker: 早坂茜
    zh: 那天你空腹站到散會，臉色比收據紙還白。
    ja: あの日は空きっ腹で閉会まで立ってて、顔色がレシートより白かった。
  - speaker: 相馬律
    zh: 你居然記得。
    ja: よく覚えてるな。
  - speaker: 早坂茜
    zh: 你少吃一餐就更愛逞強。我只是不想再扶你一次。
    ja: 一食抜くと、余計に強がる。また肩を貸すのが嫌なだけ。
  - speaker: 相馬律
    zh: 剛才第一次聽見摘要把三宅釘進嫌疑人，我就慌了。
    ja: さっき、サマリーが三宅さんを被疑者に決めつけるのを初めて聞いて、慌てたんだ。
  - speaker: 相馬律
    zh: 我一直想證明三宅不像兇手，差點又拿他的表情替他辯護。
    ja: ずっと三宅さんが犯人に見えないことを示そうとして、また表情で弁護しかけた。
  - speaker: 早坂茜
    zh: 第一次輸在會場，很正常。你還是我的搭檔，別拿那句話撐場。
    ja: 審査会で初めて負けるのは、普通のこと。相馬は今も私の相棒。あの一言で場をもたせようとしないで。
  - speaker: 早坂茜
    zh: 人說的、店裡留下的、系統排的，先分開。
    ja: 人が言ったこと、店に残ってたもの、システムが並べたもの。まず分ける。
  - speaker: 片瀨美咲
    zh: 啊，早坂律師。你們還沒走？我得趕末班車，先走了。
    ja: あ、早坂先生。まだいたんですか？終電なので、お先に失礼します。
  - speaker: 早坂茜
    zh: 路上小心。
    ja: お気をつけて。
  - speaker: 相馬律
    zh: 早坂小姐。我想回雨鐘一趟。
    ja: 早坂さん。雨鐘に一度戻りたい。
  - speaker: 早坂茜
    zh: 再看一次摘要？
    ja: サマリーをもう一度読む？
  - speaker: 相馬律
    zh: 不是。我想再走一遍那間店。
    ja: いや。あの店を、もう一度歩きたいんだ。
  - speaker: 相馬律
    zh: 剛才我只看見它排好的故事。
    ja: さっきは、サマリーが並べた筋書きしか見てなかった。
  - speaker: 早坂茜
    zh: 那就去看它沒寫出的地方。
    ja: なら、サマリーに書かれなかったところを見に行こう。
