schemaVersion: 1
locale: ja
source: docs/stories_plan/chapter_1/scene_5.md
lines:
  - speaker: 相馬律
    zh: 這會場比我想的冷。
    ja: この会場、思ってたより寒いな。
  - speaker: 早坂茜
    zh: 冷氣直直吹。外套穿上。
    ja: 冷房がまともに当たる。コート、着て。
  - speaker: 相馬律
    zh: 等下要站起來講話，穿外套顯得太隨便。
    ja: このあと立って話すんだ。コートを着たままじゃ、だらしなく見える。
  - speaker: 早坂茜
    zh: 隨便總比發抖好。披著，輪到你再脫。
    ja: だらしないほうが、震えるよりまし。羽織っておいて、自分の番で脱げばいい。
  - speaker: 早坂茜
    zh: 今天不是審判，是審查。
    ja: 今日は裁判じゃない。審査。
  - speaker: 早坂茜
    zh: 他們只看摘要站不站得住。
    ja: 向こうが見るのは、サマリーが成り立つかどうかだけ。
  - speaker: 旁白
    zh: 那個袋子，從案發那晚起就沒離開過她的手。
    ja: その袋は、事件の夜から一度も彼女の手を離れていない。
  - speaker: 早坂茜
    zh: 主位那位，是神谷澪。
    ja: 正面の席にいるのが、神谷澪。
  - speaker: 相馬律
    zh: 報告裡常看到這個名字。
    ja: 報告書でよく見る名前だ。
  - speaker: 早坂茜
    zh: 她信摘要。今天這場，不會輕鬆。
    ja: 彼女はサマリーを信じてる。今日は楽にはいかない。
  - speaker: 神谷澪
    zh: 開始吧。
    ja: 始めましょう。
  - speaker: 神谷澪
    zh: 這份摘要，整合了現場、紀錄與供述三方來源。
    ja: このサマリーは、現場、記録、供述の三つの情報源を統合したものです。
  - speaker: 神谷澪
    zh: 不是單一人的判斷。
    ja: 一人の人間の判断ではありません。
  - speaker: 神谷澪
    zh: 三宅蒼太的員工憑證、店內監視器、打卡紀錄。
    ja: 三宅蒼太の従業員認証、店内の防犯カメラ、打刻記録。
  - speaker: 神谷澪
    zh: 三者互相對得上。
    ja: 三者は互いに整合しています。
  - speaker: 神谷澪
    zh: 時間、位置、身分，沒有缺口。
    ja: 時刻、位置、身元。どこにも欠落はありません。
  - speaker: 相馬律
    zh: 可是——
    ja: ですが――
  - speaker: 神谷澪
    zh: 還有一點。
    ja: もう一点あります。
  - speaker: 神谷澪
    zh: 三宅本人，在第一次問話時隱瞞了事。
    ja: 三宅さん本人は、最初の聴取で事実を伏せていました。
  - speaker: 神谷澪
    zh: 他承認自己說了謊。
    ja: 嘘をついたことも、本人が認めています。
  - speaker: 相馬律
    zh: 他買錯飲料那一下，先想的是母親能不能喝。
    ja: 飲み物を買い間違えたとき、彼がまず考えたのは、母親が飲めるかどうかでした。
  - speaker: 相馬律
    zh: 這個細節，不像會動手的人會有的。
    ja: そういう細やかさは、手を下すような人間のものとは思えません。
  - speaker: 神谷澪
    zh: 嫌疑人的態度不是證據。
    ja: 被疑者の態度は証拠ではありません。
  - speaker: 神谷澪
    zh: 我不接受「他看起來不像兇手」這種反駁。
    ja: 「彼は犯人には見えない」という類の反論は、受け入れません。
  - speaker: 相馬律
    zh: 他說謊，是因為當晚母親打了電話。
    ja: 彼が嘘をついたのは、あの夜、母親と電話をしていたからです。
  - speaker: 相馬律
    zh: 還有一個蛋糕盒的事，他怕被誤會。
    ja: それに、ケーキの箱の件もあります。誤解されるのが怖かったんです。
  - speaker: 神谷澪
    zh: 這也許說明他為什麼說謊。
    ja: それで、嘘をついた理由は説明できるかもしれません。
  - speaker: 神谷澪
    zh: 但說明不了他沒有動手。
    ja: ですが、手を下していないことの説明にはなりません。
  - speaker: 神谷澪
    zh: 說謊的理由，洗不掉說謊本身。
    ja: 理由があっても、嘘をついた事実が消えるわけではありません。
  - speaker: 相馬律
    zh: 當晚有「第二杯咖啡」。
    ja: あの夜には、「二杯目のコーヒー」がありました。
  - speaker: 相馬律
    zh: 點單上署名是個「K.」。
    ja: 注文票の名前は「K.」でした。
  - speaker: 相馬律
    zh: 那代表現場還有另一個人。
    ja: つまり、現場にはもう一人いたということです。
  - speaker: 神谷澪
    zh: 「K.」是一個字母。
    ja: 「K.」は、アルファベット一文字です。
  - speaker: 神谷澪
    zh: 它可以是任何人，也可以什麼都不是。
    ja: 誰のことでもあり得ますし、何の意味もないこともあり得ます。
  - speaker: 神谷澪
    zh: 太模糊，不能推翻互相對上的三方紀錄。
    ja: 曖昧すぎます。互いに整合する三つの記録を覆すことはできません。
  - speaker: 相馬律
    zh: 摘要裡那筆外包維護紀錄，很可疑。
    ja: サマリーにある外注のメンテナンス記録。あれは疑わしいです。
  - speaker: 相馬律
    zh: 那段時間，店裡的系統並不單純。
    ja: あの時間帯、店のシステムは単純な状態ではありませんでした。
  - speaker: 神谷澪
    zh: 那筆紀錄的憑證，沒有核實。
    ja: その記録の認証は、確認が取れていません。
  - speaker: 神谷澪
    zh: 監視器上也沒有對應的人影。
    ja: 防犯カメラにも、該当する人影は映っていません。
  - speaker: 神谷澪
    zh: 在摘要裡，它只是一項低權重的旁註。
    ja: サマリーの中では、重みの低い注記にすぎません。
  - speaker: 神谷澪
    zh: 相馬先生，我說一句。
    ja: 相馬さん、一つ言わせてください。
  - speaker: 神谷澪
    zh: 三宅這筆，有員工憑證、監視器、打卡紀錄。
    ja: 三宅さんの記録には、従業員認証、防犯カメラ、打刻記録があります。
  - speaker: 神谷澪
    zh: 外包那筆，只有未核憑證和排程備註。
    ja: 外注の記録にあるのは、未確認の認証と、スケジュールの備考だけです。
  - speaker: 神谷澪
    zh: 你要我採哪一筆？
    ja: 私に、どちらを採れと言うのですか？
  - speaker: 相馬律
    expression: shaken
    zh: 摘要不是在說謊。
    ja: サマリーは嘘をついてるわけじゃない。
    note: Shaken, half to himself after failing to answer Kamiya; plain form is intentional even though he is in the hearing.
  - speaker: 相馬律
    expression: shaken
    zh: 它只是更願意相信「好對上的那一筆」。
    ja: ただ、「よく合う一件」のほうを信じたがるだけだ。
  - speaker: 早坂茜
    zh: 這一輪，我們輸在只有截圖。
    ja: 今回負けたのは、手元にスクリーンショットしかなかったから。
  - speaker: 早坂茜
    zh: 能翻的，不在紙上。在現場。
    ja: ひっくり返せるものは、紙の上にはない。現場にある。
  - speaker: 神谷澪
    zh: 今天到這裡。
    ja: 本日はここまで。
  - speaker: 神谷澪
    zh: 本輪審查暫停，摘要維持原判。
    ja: 今回の審査は一時中断とし、サマリーの判断はそのまま維持します。
  - speaker: 神谷澪
    zh: 相馬先生，先拿更硬的東西再來。
    ja: 相馬さん。もっと確かな材料を揃えてから、出直してください。
  - speaker: 黑瀨徹
    zh: 這張我不收。要用，讓鑑識固定。
    ja: これは受け取らん。使うなら、鑑識に保全させろ。
  - speaker: 早坂茜
    zh: 回現場。
    ja: 現場に戻る。
  - speaker: 相馬律
    zh: 這一輪，摘要贏了。
    ja: 今回は、サマリーの勝ちだな。
  - speaker: 早坂茜
    zh: 那就找它漏掉的地方。
    ja: なら、サマリーの取りこぼしを探す。
