lines:
  - speaker: 旁白
    zh: 三宅蒼太的母親，坐在相馬對面。
    ja: ""
  - speaker: 三宅母親
    zh: 這個……是他平常帶去店裡的。我想，總得帶點什麼來。
    ja: ""
  - speaker: 三宅母親
    zh: 我胃不好，不能喝咖啡。這杯是我自己的。
    ja: ""
  - speaker: 相馬律
    zh: 他呢？
    ja: ""
  - speaker: 三宅母親
    zh: 他啊。忙起來就忘記吃飯。
    ja: ""
  - speaker: 三宅母親
    zh: 他在店裡帶回來的那些蛋糕邊……其實是帶給我的。
    ja: ""
  - speaker: 三宅母親
    zh: 偵探先生。我知道他會說謊。
    ja: ""
  - speaker: 三宅母親
    expression: strained
    zh: 小孩子都會說謊。可是……殺人那種事，他做不到。
    ja: ""
  - speaker: 相馬律
    zh: 這句話，我不能當證據。
    ja: ""
  - speaker: 早坂茜
    zh: 所以我們才需要去找證據。
    ja: ""
  - speaker: 早坂茜
    zh: 阿姨，能不能把他的班表也給我們一份？
    ja: ""
  - speaker: 三宅母親
    zh: 班表……我有影本。他每次排了班，都會抄一張貼在冰箱上。
    ja: ""
  - speaker: 相馬律
    zh: 我會收下委託。
    ja: ""
  - speaker: 相馬律
    zh: 但我得先告訴您，今天我能做的，不是證明他清白。
    ja: ""
  - speaker: 相馬律
    zh: 是替他爭取，把證據重新看一遍的機會。
    ja: ""
  - speaker: 相馬律
    zh: 她沒有哭。比哭還難受。
    ja: ""
  - speaker: 早坂茜
    zh: 委託書我備好了。這次不能只看摘要，檢方打算直接起訴。
    ja: ""
  - speaker: 相馬律
    zh: 那就去敲。
    ja: ""
  - speaker: 相馬律
    zh: 審查會的入口，比我想的要冷清。
    ja: ""
  - speaker: 書記官
    zh: 先生，請出示身分。
    ja: ""
  - speaker: 相馬律
    zh: 我是受委託的偵探——
    ja: ""
  - speaker: 早坂茜
    zh: 辯方聘任書。法院核准函。還有第三方資料分析人的指定文件。
    ja: ""
  - speaker: 書記官
    zh: ……文件齊全。但你們不是警方，能看的只有審查會核准的片段。
    ja: ""
  - speaker: 相馬律
    zh: 所以摘要，不是全部？
    ja: ""
  - speaker: 早坂茜
    zh: 摘要是系統整合的公開版。先去看現場，片段等核准。
    ja: ""
  - speaker: 書記官
    zh: 登記好了。你們先去看現場，核准片段等通知。
    ja: ""
  - speaker: 旁白
    zh: 走出審查會，雨後的街還濕著。
    ja: ""
  - speaker: 相馬律
    zh: 早坂小姐。今天如果我們提不出來，會怎麼樣？
    ja: ""
  - speaker: 早坂茜
    zh: 今天如果證明不了摘要時間線的具體矛盾，三宅會被起訴，之後能要求的片段也會少很多。
    ja: ""
  - speaker: 相馬律
    zh: 今天不是要贏一場辯論，而是保住重新看證據的權利。
    ja: ""
  - speaker: 相馬律
    zh: 我以前做資料分析，總站在系統那邊看摘要；第一次站到這邊，覺得它變重了。
    ja: ""
  - speaker: 早坂茜
    zh: 重就對了。走吧。
    ja: ""
  - speaker: 早坂茜
    expression: stern
    zh: 截圖只能讓我們懷疑；要救他，得拿可以被採用的東西。
    ja: ""
  - speaker: 相馬律
    zh: 我知道了。
    ja: ""
