# ja script for docs/stories_plan/chapter_1/scene_2.md.
# Each entry is linked to its scene line by `id` (the line's {#L012} tag);
# `speaker`, `expression` and `zh` record what was translated. Edit `ja`,
# `note`, `voice.direction` and `voice.tts` only. After the scene changes, run
# `bun run voice:sync <chapter>`, then `bun run voice:validate <chapter>`.
schemaVersion: 1
locale: ja
source: docs/stories_plan/chapter_1/scene_2.md
lines:
  - id: L001
    speaker: 旁白
    zh: 三宅蒼太的母親，坐在相馬對面。
    ja: 三宅蒼太の母親が、相馬の向かいに座っている。
  - id: L002
    speaker: 三宅母親
    zh: 這個……是他平常帶去店裡的。我想，總得帶點什麼來。
    ja: これ……あの子がいつも店に持っていくものなんです。何か持ってこないと、と思って。
  - id: L003
    speaker: 三宅母親
    zh: 我胃不好，不能喝咖啡。這杯是我自己的。
    ja: 私、胃が弱くて、コーヒーは飲めないんです。これは自分の分です。
  - id: L004
    speaker: 相馬律
    zh: 他呢？
    ja: 息子さんは？
    voice:
      clip: ch1_soma_ritsu_0043
  - id: L005
    speaker: 三宅母親
    zh: 他啊。忙起來就忘記吃飯。
    ja: あの子ですか。忙しくなると、ご飯を食べるのを忘れるんです。
  - id: L006
    speaker: 三宅母親
    zh: 他在店裡帶回來的那些蛋糕邊……其實是帶給我的。
    ja: 店から持って帰ってくるケーキの切れ端……あれ、本当は私のためなんです。
  - id: L007
    speaker: 三宅母親
    zh: 偵探先生。我知道他會說謊。
    ja: 探偵さん。あの子が嘘をつくことは、分かってます。
  - id: L008
    speaker: 三宅母親
    expression: strained
    zh: 小孩子都會說謊。可是……殺人那種事，他做不到。
    ja: 子どもは、みんな嘘をつきます。でも……人を殺すなんて、あの子にはできません。
  - id: L009
    speaker: 相馬律
    zh: 這句話，我不能當證據。
    ja: その言葉を、証拠として扱うことはできません。
    voice:
      clip: ch1_soma_ritsu_0044
  - id: L010
    speaker: 早坂茜
    zh: 所以我們才需要去找證據。
    ja: だから、私たちが証拠を探しに行くんです。
    voice:
      clip: ch1_hayasaka_akane_0012
  - id: L011
    speaker: 早坂茜
    zh: 阿姨，能不能把他的班表也給我們一份？
    ja: お母さん、息子さんのシフト表も一部いただけますか？
    voice:
      clip: ch1_hayasaka_akane_0013
  - id: L012
    speaker: 三宅母親
    zh: 班表……我有影本。他每次排了班，都會抄一張貼在冰箱上。
    ja: シフト表……写しがあります。あの子、シフトが決まるたびに書き写して、冷蔵庫に貼っておくんです。
  - id: L013
    speaker: 相馬律
    zh: 我會收下委託。
    ja: ご依頼は、お引き受けします。
    voice:
      clip: ch1_soma_ritsu_0045
  - id: L014
    speaker: 相馬律
    zh: 但我得先告訴您，今天我能做的，不是證明他清白。
    ja: ただ、先にお伝えしておきます。今日僕にできるのは、息子さんの無実を証明することではありません。
    voice:
      clip: ch1_soma_ritsu_0046
  - id: L015
    speaker: 相馬律
    zh: 是替他爭取，把證據重新看一遍的機會。
    ja: 息子さんのために、証拠をもう一度見直す機会を勝ち取ることです。
    voice:
      clip: ch1_soma_ritsu_0047
  - id: L016
    speaker: 相馬律
    zh: 她沒有哭。比哭還難受。
    ja: 泣かなかったな。泣かれるより、ずっときつい。
    voice:
      clip: ch1_soma_ritsu_0048
  - id: L017
    speaker: 早坂茜
    zh: 委託書我備好了。這次不能只看摘要，檢方打算直接起訴。
    ja: 委任状は用意した。今回はサマリーを眺めてるだけじゃ済まない。検察側は、このまま起訴する気だ。
    voice:
      clip: ch1_hayasaka_akane_0014
  - id: L018
    speaker: 相馬律
    zh: 那就去敲。
    ja: なら、扉を叩きに行こう。
    voice:
      clip: ch1_soma_ritsu_0049
  - id: L019
    speaker: 相馬律
    zh: 審查會的入口，比我想的要冷清。
    ja: 審査会の入口、思ってたよりひっそりしてるな。
    voice:
      clip: ch1_soma_ritsu_0050
  - id: L020
    speaker: 書記官
    zh: 先生，請出示身分。
    ja: 失礼ですが、身分を証明するものをご提示ください。
  - id: L021
    speaker: 相馬律
    zh: 我是受委託的偵探——
    ja: 依頼を受けて来た探偵で――
    voice:
      clip: ch1_soma_ritsu_0051
  - id: L022
    speaker: 早坂茜
    zh: 辯方聘任書。法院核准函。還有第三方資料分析人的指定文件。
    ja: 弁護人の選任書です。裁判所の承認書。それから、第三者データ分析人の指定書類です。
    voice:
      clip: ch1_hayasaka_akane_0015
  - id: L023
    speaker: 書記官
    zh: ……文件齊全。但你們不是警方，能看的只有審查會核准的片段。
    ja: ……書類はそろっています。ただ、皆さんは警察ではありませんので、閲覧できるのは審査会の承認済み抜粋のみです。
  - id: L024
    speaker: 相馬律
    zh: 所以摘要，不是全部？
    ja: つまり、サマリーがすべてじゃない？
    voice:
      clip: ch1_soma_ritsu_0052
  - id: L025
    speaker: 早坂茜
    zh: 摘要是系統整合的公開版。先去看現場，片段等核准。
    ja: サマリーは、システムがまとめた公開版。先に現場を見る。抜粋は承認待ち。
    voice:
      clip: ch1_hayasaka_akane_0016
  - id: L026
    speaker: 書記官
    zh: 登記好了。你們先去看現場，核准片段等通知。
    ja: 登録が済みました。先に現場をご確認ください。抜粋の承認は、追ってご連絡いたします。
  - id: L027
    speaker: 旁白
    zh: 走出審查會，雨後的街還濕著。
    ja: 審査会を出ると、雨上がりの街はまだ濡れていた。
  - id: L028
    speaker: 相馬律
    zh: 早坂小姐。明天審查會上如果我們提不出來，會怎麼樣？
    ja: 早坂さん。明日の審査会で、もし何も出せなかったら、どうなる？
    voice:
      clip: ch1_soma_ritsu_0053
  - id: L029
    speaker: 早坂茜
    zh: 明天如果證明不了摘要時間線的具體矛盾，三宅會被起訴，之後能要求的片段也會少很多。
    ja: 明日サマリーのタイムラインに具体的な矛盾を示せなければ、三宅さんは起訴される。あとで請求できる抜粋も、ぐっと減る。
    voice:
      clip: ch1_hayasaka_akane_0017
  - id: L030
    speaker: 相馬律
    zh: 明天不是要贏一場辯論，而是保住重新看證據的權利。
    ja: 明日は議論に勝つ日じゃない。証拠を見直す権利を守る日なんだ。
    voice:
      clip: ch1_soma_ritsu_0054
  - id: L031
    speaker: 相馬律
    zh: 我以前做資料分析，總站在系統那邊看摘要；第一次站到這邊，覺得它變重了。
    ja: データ分析をしてた頃は、いつもシステム側からサマリーを見てた。初めてこっち側に立って、重く感じる。
    voice:
      clip: ch1_soma_ritsu_0055
  - id: L032
    speaker: 早坂茜
    zh: 重就對了。走吧。
    ja: 重くていい。行こう。
    voice:
      clip: ch1_hayasaka_akane_0018
  - id: L033
    speaker: 早坂茜
    expression: stern
    zh: 截圖只能讓我們懷疑；要救他，得拿可以被採用的東西。
    ja: スクリーンショットで持てるのは疑いだけ。救うなら、採用されるもので救う。
    voice:
      clip: ch1_hayasaka_akane_0019
  - id: L034
    speaker: 相馬律
    zh: 我知道了。
    ja: 分かった。
    voice:
      clip: ch1_soma_ritsu_0056
