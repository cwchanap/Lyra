# ja script for docs/stories_plan/chapter_1/scene_10_5.md.
# Each entry is linked to its scene line by `id` (the line's {#L012} tag);
# `speaker`, `expression` and `zh` record what was translated. Edit `ja`,
# `note`, `voice.direction` and `voice.tts` only. After the scene changes, run
# `bun run voice:sync <chapter>`, then `bun run voice:validate <chapter>`.
schemaVersion: 1
locale: ja
source: docs/stories_plan/chapter_1/scene_10_5.md
lines:
  - id: L001
    speaker: 三宅母親
    zh: 相馬先生……他們說，蒼太不是嫌疑人了。
    ja: 相馬さん……蒼太はもう被疑者ではないと、言われました。
    note: 相馬先生 is rendered 相馬さん (先生 is kept for lawyers); she says 探偵さん to Soma in scene_2.
  - id: L002
    speaker: 三宅母親
    zh: 可是那一晚，到底是怎麼回事？蒼太只跟我說，他在那裡。
    ja: でも、あの夜は、いったい何があったんですか？蒼太は、あそこにいた、としか言わなくて。
  - id: L003
    speaker: 相馬律
    zh: （她等了這麼多天，要的是一個故事。我手上，只有證據給的那一半。）
    ja: （彼女が何日も待って求めていたのは、一つの物語だ。僕の手にあるのは、証拠が与えてくれる半分だけ。）
  - id: L004
    speaker: 相馬律
    zh: ……我能說的，只有證據證明的部分。
    ja: ……僕に言えるのは、証拠が証明している部分だけです。
  - id: L005
    speaker: 早坂茜
    expression: stern
    zh: 三宅太太，我們只講證據撐得住的。撐不住的地方，我們不編。
    ja: 三宅さん、私たちが話すのは、証拠で支えられることだけです。支えられないところは、作り話にしません。
  - id: L006
    speaker: 三宅母親
    zh: 好。我看不懂那些紀錄。你照順序，慢慢說就好。
    ja: はい。あの記録は、私には分かりません。順番に、ゆっくり話してもらえれば、それでいいです。
  - id: L007
    speaker: 相馬律
    zh: 好。從雨鐘還沒打烊的時候說起。
    ja: はい。まだ雨鐘が開いていたときから、話します。
  - id: L008
    speaker: 相馬律
    zh: 增田先生那晚，約了一個人在雨鐘見面。備忘裡，那個人只被寫成一個字母：K。
    ja: 増田さんはあの夜、雨鐘で人と会う約束をしていました。メモに相手として書かれていたのは、アルファベット一文字、Kだけです。
  - id: L009
    speaker: 相馬律
    zh: 增田先生有一份檢舉草稿，沒寫完。草稿附的整理表記著，北見的帳號多次在排程外碰試點資料，一部分匯到了外部的傳輸載體。
    ja: 増田さんには、書き終えていない告発の下書きがありました。下書きに添付された整理表には、北見のアカウントがスケジュール外で何度も試験運用データに触れ、その一部が外部の記録媒体に書き出されていたことが記されています。
  - id: L010
    speaker: 相馬律
    zh: 草稿要是寫完送出，北見就會被當成盜賣資料的嫌疑人。那是他那晚的壓力。買家是誰，證據還沒有說。
    ja: 下書きが書き上がって提出されれば、北見はデータ横流しの疑いをかけられることになります。それが、あの夜の彼にかかっていた圧力です。買い手が誰かは、証拠はまだ語っていません。
  - id: L011
    speaker: 相馬律
    zh: 權限名單上，K 開頭的承包商不只一個。把那晚的臨時工單和那組外包憑證一起對，才對到北見修一。
    ja: 権限リストには、Kで始まる委託業者が何人もいます。あの夜の臨時のメンテナンス作業票と、あの外注認証を突き合わせて、ようやく北見修一にたどり着きました。
  - id: L012
    speaker: 相馬律
    zh: 北見先到了後門。門鎖先進了維護模式，接著，是承包商的憑證打開了後門。
    ja: 北見が先に裏口に着きました。ドアロックがまずメンテナンスモードに入り、続いて、委託業者の認証で裏口が解錠されています。
  - id: L013
    speaker: 相馬律
    zh: 那組憑證，那一晚只有北見能用。
    ja: その認証は、あの夜、北見にしか使えませんでした。
  - id: L014
    speaker: 相馬律
    zh: 門內的水痕，比三宅進門更早就有了。
    ja: ドアの内側の水の跡は、三宅さんが入るより前からありました。
  - id: L015
    speaker: 相馬律
    zh: 有人，比他先到。
    ja: 誰かが、彼より先に来ていました。
  - id: L016
    speaker: 相馬律
    zh: 牆角的傘套，和承包商資材包裡的是同一款。可是外面也買得到，它說不出是誰，也說不出幾點。
    ja: 壁の隅の傘袋は、委託業者の資材キットのものと同じ型です。ただ、外でも買えます。誰なのかも、何時なのかも、傘袋は教えてくれません。
  - id: L017
    speaker: 相馬律
    zh: 增田先生的手機，最後一次被點開，在三宅進來之前。
    ja: 増田さんのスマホが最後に操作されたのは、三宅さんが入ってくる前です。
  - id: L018
    speaker: 相馬律
    zh: 入口牆上那座舊掛鐘，被撞得停住，也在他進來之前。
    ja: 入口の壁の古い掛け時計が、衝撃で止まったのも、彼が入ってくる前です。
  - id: L019
    speaker: 三宅母親
    zh: 那……裡面，他們兩個，說了什麼？
    ja: それで……中で、あの二人は、何を話したんですか？
  - id: L020
    speaker: 相馬律
    zh: 沒有人知道。倉庫裡面那幾分鐘，沒有畫面，也沒有證人。
    ja: 誰にも分かりません。倉庫の中のその数分間は、映像もなく、証人もいません。
  - id: L021
    speaker: 相馬律
    zh: 北見和增田說了什麼，誰先動的手，打人的是哪一件東西，都沒有紀錄。兇器只有一個候選，金屬咖啡豆罐，也還沒有確認。
    ja: 北見と増田さんが何を話したのか、どちらが先に手を出したのか、何で殴ったのか。どれも記録がありません。凶器の候補は金属のコーヒー豆の缶ただ一つで、それもまだ確認できていません。
  - id: L022
    speaker: 相馬律
    expression: shaken
    zh: 到這裡，紀錄就停了。我也停在這裡。
    ja: 記録はここで止まっています。僕も、ここで止まります。
  - id: L023
    speaker: 相馬律
    zh: （每一個缺口，都有一個很順的說法在等著。可是那樣說，就和摘要一樣了。）
    ja: （どの欠落にも、すんなり収まる説明が待っている。でも、そう語ったら、サマリーと同じだ。）
  - id: L024
    speaker: 三宅母親
    zh: ……嗯。不知道的，就說不知道。
    ja: ……ええ。分からないことは、分からないと言えばいいんです。
  - id: L025
    speaker: 相馬律
    zh: 紀錄再接上的地方，是三宅。他走進後場，開門用的，是他自己的員工憑證。
    ja: 記録がまたつながるのは、三宅さんです。彼がバックヤードに入るとき、ドアを開けたのは、自分の従業員認証でした。
  - id: L026
    speaker: 相馬律
    zh: 可是走廊在這裡拐了一個彎，高貨架又擋在前面。他看不到裡面。
    ja: ですが、廊下はここで折れ曲がっていて、高い棚がその前をふさいでいます。彼には、中が見えません。
  - id: L027
    speaker: 三宅母親
    zh: 所以他走進去，什麼都沒看到。
    ja: じゃあ、あの子は中に入って、何も見なかったんですね。
  - id: L028
    speaker: 相馬律
    zh: 對。他看不到。
    ja: はい。彼には見えませんでした。
  - id: L029
    speaker: 相馬律
    zh: 後來，店長走了另一條路，才發現增田先生。那已經是很晚的事了。
    ja: そのあと、店長が別の道を通って、増田さんを見つけました。ずいぶん遅くなってからのことです。
    note: The manager found 増田 at 23:20, not Miyake. The Chinese names 增田先生 so the sentence cannot be read as being about Miyake.
  - id: L030
    speaker: 相馬律
    zh: 門鎖最後一格，是同步完成。那是電腦把各段紀錄合在一起的時間。
    ja: ドアロックの最後の一行は、同期完了です。コンピューターが記録の各部分を統合した、その時刻です。
  - id: L031
    speaker: 相馬律
    zh: 摘要把那個時間，讀成了三宅進門的時間。
    ja: サマリーは、その時刻を、三宅さんが入ってきた時刻と読み取りました。
  - id: L032
    speaker: 相馬律
    zh: 所以摘要排出來的故事裡，只有他一個人。
    ja: だから、サマリーが組み立てた物語には、彼一人しかいません。
  - id: L033
    speaker: 相馬律
    expression: relieved
    zh: 門沒有說謊。是人，把它說成了另一個故事。
    ja: ドアは嘘をついていません。人が、それを別の物語にして語ってしまったんです。
  - id: L034
    speaker: 黑瀨徹
    zh: 手續辦完了。人還你們。
    ja: 手続きは済んだ。人は、そっちに返す。
  - id: L035
    speaker: 黑瀨徹
    zh: ……吃飯了沒有？
    ja: ……飯、食ったか？
  - id: L036
    speaker: 三宅蒼太
    expression: strained
    zh: 還、還沒……
    ja: ま、まだ……
  - id: L037
    speaker: 黑瀨徹
    zh: 哼。先吃。
    ja: ふん。先に食え。
  - id: L038
    speaker: 三宅蒼太
    expression: relieved
    zh: 媽……我、我回來了。
    ja: 母さん……た、ただいま。
  - id: L039
    speaker: 三宅母親
    expression: strained
    zh: 蒼、蒼太……蒼太……！
    ja: そ、蒼太……蒼太……！
  - id: L040
    speaker: 三宅母親
    expression: strained
    zh: 你這孩子……我、我以為……我以為……
    ja: この子は……わ、私、てっきり……てっきり……
  - id: L041
    speaker: 三宅母親
    expression: strained
    zh: 回來就好……回來就好……回來就好……
    ja: 帰ってきたなら……それでいい……それでいい……それでいい……
    note: The Chinese repeats the whole phrase three times while sobbing; the Japanese repeats the tail それでいい.
  - id: L042
    speaker: 三宅蒼太
    expression: strained
    zh: 媽……對、對不起……我、我說謊了……
    ja: 母さん……ご、ごめん……ぼ、僕、嘘ついた……
  - id: L043
    speaker: 三宅母親
    expression: strained
    zh: 別說了……不說了……
    ja: 言わないで……もう、いい……
  - id: L044
    speaker: 三宅母親
    expression: strained
    zh: 涼了……我一早才重新捏的，一直……一直拿著，怕你出來，沒有東西吃……
    ja: 冷めてしまった……今朝、握り直したばかりなのに……ずっと……ずっと持っていて……出てきたとき、食べるものがなかったらと、心配で……
  - id: L045
    speaker: 三宅蒼太
    expression: relieved
    zh: 涼的……也、也好吃。
    ja: 冷めてても……お、おいしい。
  - id: L046
    speaker: 相馬律
    zh: （最後，什麼證據都用不上。她等的，只是這個人走出來。）
    ja: （最後は、どんな証拠もいらなかった。彼女が待っていたのは、ただ、この人が出てくることだけだ。）
  - id: L047
    speaker: 早坂茜
    expression: softened
    zh: 走。給他們一點時間。
    ja: 行こう。二人に、少し時間を。
