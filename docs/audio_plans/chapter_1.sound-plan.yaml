      piano pulse, cold institutional air, no melody climax, no percussion, ends
      open, unresolved, and quietly defeated.
    reuseRationale: >-
      Existing generated catalog track retained for the first-round hearing loss
      in scene_5; the final-round victory in scene_10 has its own BGM so the
      emotional arc does not blur.
