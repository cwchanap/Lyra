entries:
  # ---- BGM: new for Chapter 2 ----
  - id: bgm_glass_box_stream
    channel: bgm
    status: generated
    loop: true
    intendedDurationSeconds: 45
    prompt: >-
      Bright polished livestream-event instrumental for a 24-hour glass-booth
      stream in a Shibuya plaza, neutral enough for day or night, glossy synth
      plucks and soft four-on-the-floor pulse, slightly too clean and repetitive
      so it feels staged, an uneasy low pad underneath, no vocals, no drop,
      seamless 45-second loop.
    reuseRationale: >-
      No catalog track fits a staged livestream event; the chapter's on-air
      state recurs at the 01:00 stream start, the afternoon rest block, and on
      Saegusa's second monitor, so one reusable loop carries all three.
    evidence:
      - {
          file: docs/stories_plan/chapter_2/scene_0.md,
          line: 121,
          note: 01:00 開播，玻璃箱與直播牆正對人群
        }
      - { file: docs/stories_plan/chapter_2/scene_1.md, line: 118, note: 直播中的靜音休息時段 }
      - { file: docs/stories_plan/chapter_2/scene_2.md, line: 5, note: 副螢幕開著玻璃箱直播分頁 }
    provider: elevenlabs
    endpoint: https://api.elevenlabs.io/v1/music?output_format=mp3_44100_128
    promptHash: 7ddccc31fa31
    generatedAt: 2026-10-16T05:27:27.357Z
    outputPath: static/assets/audio/bgm/bgm_glass_box_stream.ogg
    forced: false
    normalizationNotes: converted from mp3 to 44.1 kHz ogg with libvorbis (oggenc -q 5, decoded by ffmpeg; the local ffmpeg build has no libvorbis encoder), no loop splice
  - id: bgm_midnight_blind_window
    channel: bgm
    status: generated
    loop: true
    intendedDurationSeconds: 45
    prompt: >-
      Tense restrained instrumental for a midnight sponsor block where something
      is going wrong unseen, muffled sponsor-jingle fragments over a dry ticking
      pulse and low sustained strings, controlled dread without horror stings,
      no vocals, seamless 45-second loop with an open ending.
    reuseRationale: >-
      bgm_breakthrough_pursuit is forward-moving pursuit, not unseen dread; the
      midnight sponsor window and the body discovery share this one
      controlled-dread state.
    evidence:
      - { file: docs/stories_plan/chapter_2/scene_2.md, line: 68, note: 午夜贊助段開始，群眾看牆 }
      - {
          file: docs/stories_plan/chapter_2/scene_2.md,
          line: 109,
          note: 廣場喇叭裡低低的贊助音樂
        }
      - {
          file: docs/stories_plan/chapter_2/scene_3.md,
          line: 5,
          note: 凌晨兩點半，空置樓層發現現場
        }
    provider: elevenlabs
    endpoint: https://api.elevenlabs.io/v1/music?output_format=mp3_44100_128
    promptHash: d4ed7f15ad5c
    generatedAt: 2026-10-16T05:27:34.263Z
    outputPath: static/assets/audio/bgm/bgm_midnight_blind_window.ogg
    forced: false
    normalizationNotes: converted from mp3 to 44.1 kHz ogg with libvorbis (oggenc -q 5, decoded by ffmpeg; the local ffmpeg build has no libvorbis encoder), no loop splice

