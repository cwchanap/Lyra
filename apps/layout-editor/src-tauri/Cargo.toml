[package]
name = "lyra-layout-editor"
version = "0.1.0"
description = "Lyra investigation layout editor"
authors = ["you"]
edition = "2021"

[lib]
name = "lyra_layout_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

# Process-group kill for bounded compile validation (unix only; other
# platforms fall back to the plain child kill plus a bounded drain wait).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
