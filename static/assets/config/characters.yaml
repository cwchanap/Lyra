characters:
  - id: soma_ritsu
    displayNames: ["相馬律"]
    portraitMode: portrait
    visualPrompt: >
      26-year-old Japanese private detective, slim build, slightly disheveled
      dark hair, gray-white shirt sleeves rolled to the elbows, charcoal
      trousers, slightly forward observant posture, muted brown worn leather
      case folder nearby, alert and inexperienced rather than withdrawn.
    referenceAssetId: null
    expressions:
      standard:
        prompt: calm focused expression, restrained concern, eyes attentive
      determined:
        prompt: focused determined expression, jaw set slightly, eyes steady
      shaken:
        prompt: shaken unsettled expression, eyes briefly wide, restrained tension
      relieved:
        prompt: quiet relieved expression, shoulders easing, eyes warm

  - id: hayasaka_akane
    displayNames: ["早坂茜"]
    portraitMode: portrait
    visualPrompt: >
      Japanese woman in her early thirties, practical defense attorney, sturdy
      grounded build, structured navy jacket over a casual off-white inner
      layer, loosely controlled low-tied hair, warm brown organized leather
      document shoulder bag, direct procedural presence; not a lean rigid
      graphite-suited prosecutor.
    referenceAssetId: null
    expressions:
      standard:
        prompt: composed attentive expression, professional calm
      stern:
        prompt: firm serious expression, brows slightly set, controlled voice
      softened:
        prompt: softened expression, protective warmth, small reassuring smile

  - id: miyake_mother
    displayNames: ["三宅母親"]
    portraitMode: portrait
    visualPrompt: >
      Middle-aged Japanese mother with a softly rounded silhouette, modest moss
      green and warm beige everyday layers, tired restrained face, hands held
      close and tense around a convenience-store rice-ball bag, quiet domestic
      dignity, no work apron, not crying.
    referenceAssetId: null
    expressions:
      standard:
        prompt: quiet restrained expression, worried but holding together
      strained:
        prompt: pained controlled expression, fingers tense, short fragile smile

  - id: clerk
    displayNames: ["書記官"]
    portraitMode: portrait
    visualPrompt: >
      Japanese review-board clerk with a compact upright counter posture, plain
      black office suit and cool white shirt, thin practical glasses, dark ID
      lanyard, neat short-to-medium office hair, neutral face and controlled
      gatekeeping manner; administrative rather than prosecutor styling.
    referenceAssetId: null
    expressions:
      standard:
        prompt: neutral procedural expression, professional distance

  - id: takase_manager
    displayNames: ["店長高瀨"]
    portraitMode: portrait
    visualPrompt: >
      Japanese cafe manager in her late thirties to early forties, apron over
      loose olive-brown casual clothes, faded rust-red work apron, shoulders
      slightly lowered from standing for years, tired brow, practical ordinary
      presence, one hand habitually holding a cleaning cloth at a clean counter.
    referenceAssetId: null
    expressions:
      standard:
        prompt: plain practical expression, tired but cooperative
      tired:
        prompt: visibly fatigued expression, shoulders slightly lowered

  - id: katase
    displayNames: ["片瀨美咲"]
    portraitMode: portrait
    visualPrompt: >
      Petite Japanese cafe employee in her early twenties, uniform apron, small
      muted teal uniform apron, colorful hair tie and tiny earrings, quick
      light-footed silhouette with weight tipped toward the exit, hurried
      end-of-shift energy, glancing toward the time; clearly younger than Takase.
    referenceAssetId: null
    expressions:
      standard:
        prompt: hurried polite expression, slightly anxious about catching train

  - id: miyake_sota
    displayNames: ["三宅蒼太"]
    portraitMode: portrait
    visualPrompt: >
      Young Japanese cafe worker in his early twenties, slim build, slightly
      hunched anxious posture with shoulders drawn in, plain cafe staff shirt
      under a practical gray-green jacket, tired downcast eyes from family and
      work pressure, guarded but not foolish; no rolled detective sleeves.
    referenceAssetId: null
    expressions:
      standard:
        prompt: nervous restrained expression, looking down slightly, words held back
      strained:
        prompt: tense quiet expression, shoulders lowered, trying not to panic
      relieved:
        prompt: relieved expression, shoulders easing, tentative grateful smile

  - id: kamiya_mio
    displayNames: ["神谷澪"]
    portraitMode: portrait
    visualPrompt: >
      Japanese female prosecutor in her early thirties, lean angular build and
      sharper cheekbones, rigid vertical institutional posture, glossy black
      hair in a severe sculpted low chignon, cool graphite longline
      double-breasted suit with sharp lapels, high-neck ivory blouse and one
      restrained silver bar pin, no shoulder bag, no casual inner shirt,
      visually distinct from the sturdier warm-toned defense attorney Hayasaka.
    referenceAssetId: null
    expressions:
      standard:
        prompt: cool precise expression, calm procedural confidence
      skeptical:
        prompt: skeptical precise expression, brows slightly narrowed, controlled doubt
      conceding:
        prompt: conceding expression, guarded certainty easing, measured acknowledgment

  - id: kurose_toru
    displayNames: ["黑瀨徹"]
    portraitMode: portrait
    visualPrompt: >
      Japanese police detective nearly fifty, broad sturdy build, weathered
      face with deep eye-corner wrinkles from night shifts, rumpled field coat
      in brown-gray tones as if slept in a car, muddy worn dark dress shoes,
      large steady hands, flattened rice-ball wrapper in one pocket, blunt
      planted field presence rather than neat middle management.
    referenceAssetId: null
    expressions:
      standard:
        prompt: tired watchful expression, blunt field-investigator focus

  - id: kitami_shuichi
    displayNames: ["北見修一"]
    portraitMode: portrait
    visualPrompt: >
      Japanese man in his early forties, medium soft build, forgettable generic
      beige-gray business-casual layers, thin metal-frame glasses slipping
      slightly, dark contractor ID lanyard, deeply creased business card,
      anxious overlooked office-worker face, shoulders drawn inward; not a
      youthful rolled-sleeve detective.
    referenceAssetId: null
    expressions:
      standard:
        prompt: guarded anxious expression, trying to stay forgettable
      defensive:
        prompt: defensive anxious expression, shoulders drawn in, avoiding eye contact
      cornered:
        prompt: cornered strained expression, eyes darting, shoulders tightening

  - id: contractor_supervisor
    displayNames: ["承包商主管"]
    portraitMode: portrait
    visualPrompt: >
      Middle-aged Japanese male supervisor of contractor records with a
      rectangular middle-management posture, pressed cool-gray business shirt,
      conservative low-saturation tie, short neat side-parted hair, record
      clipboard, controlled bureaucratic distance and cautious neutral office
      expression; clean and orderly rather than a rumpled field detective.
    referenceAssetId: null
    expressions:
      standard:
        prompt: neutral guarded expression, procedural reluctance

  - id: stationery_owner
    displayNames: ["店主"]
    portraitMode: portrait
    visualPrompt: >
      Middle-aged Japanese owner of a small stationery and copy shop, practical
      indigo work overshirt and cream utility apron in warm paper tones, relaxed
      neighborhood-shop stance, paper cutter or stack of copy paper nearby,
      accustomed to handling paper goods and copy orders, no cafe uniform,
      distinct from the tired rust-apron Rain Bell cafe manager.
    referenceAssetId: null
    expressions:
      standard:
        prompt: practical attentive expression, ready to help a customer
      flustered:
        prompt: briefly flustered expression, hands paused over a stack of copied papers

  - id: masuda_kei
    displayNames: ["增田圭"]
    portraitMode: portrait
    visualPrompt: >
      KAGAMI outsourced data reviewer with a narrow discreet silhouette and
      guarded slight side angle, slate commuter coat over ordinary low-profile
      work attire, compact USB case or folded memo kept close, cautious
      self-protective presence, no glasses or ID lanyard, distinct from Kitami's
      softer inward office-worker silhouette, no dramatic styling.
    referenceAssetId: null
    expressions:
      standard:
        prompt: quiet reserved expression, ordinary cafe-regular composure

  - id: kisaragi_mashiro
    displayNames: ["如月真白"]
    portraitMode: portrait
    visualPrompt: >
      Popular Japanese livestreamer in her mid-twenties, slim upright
      camera-ready posture that relaxes into tired shoulders off camera,
      long light ash-brown hair worn loosely half-up, soft lavender-gray
      oversized knit cardigan over a plain white top, small in-ear monitor
      earpiece with a thin cable to a mic pack clipped at her waist, bright
      practiced on-camera warmth over quiet fatigue; distinctly younger and
      softer-toned than Hayasaka.
    referenceAssetId: null
    expressions:
      standard:
        prompt: bright practiced on-camera smile, attentive eyes
      tired:
        prompt: off-camera tired expression, smile dropped, eyes flat and dry
      resolute:
        prompt: quiet resolute expression, chin slightly lifted, holding a decision

  - id: hasumi_toru
    displayNames: ["蓮見透"]
    portraitMode: portrait
    visualPrompt: >
      Japanese talent manager in his late thirties, tall neat composed build,
      dark navy slim suit with no tie over a pale gray shirt, wireless headset
      resting around his neck, tablet with a schedule held against his chest,
      soft reasonable face and calm attentive eyes, the most composed person
      in any room; polished agency professional rather than menacing.
    referenceAssetId: null
    expressions:
      standard:
        prompt: calm reasonable expression, soft professional attentiveness
      concerned:
        prompt: measured concerned expression, brows slightly drawn, voice-level calm
      firm:
        prompt: polite firm expression, small closed smile, decision already made

  - id: saegusa_yuma
    displayNames: ["三枝悠真"]
    portraitMode: portrait
    visualPrompt: >
      Japanese rival livestreamer in his late twenties, lanky slouched
      provocative stance, bleached ash hair with dark roots grown out,
      oversized black hoodie with small neon-green accents, gaming headset
      pushed down around his neck, phone ring-light clip in one hand,
      sarcastic restless eyes; abrasive clout-chaser energy, clearly distinct
      from Hasumi's neat suit and Soma's rolled shirt sleeves.
    referenceAssetId: null
    expressions:
      standard:
        prompt: smug sarcastic half-smile, eyes restless
      irritated:
        prompt: irritated scowl, jaw tight, leaning back defensively
      uneasy:
        prompt: uneasy guarded expression, bravado slipping for a moment

  - id: stream_director
    displayNames: ["導播"]
    portraitMode: portrait
    visualPrompt: >
      Japanese livestream event director in his mid-forties, stocky seated
      control-desk posture, black staff t-shirt under a worn charcoal work
      jacket, closed-back headset over short graying hair, reading glasses
      pushed up on his forehead, tired precise technician presence.
    referenceAssetId: null
    expressions:
      standard:
        prompt: focused technical expression, eyes on monitors
      tense:
        prompt: tense expression, jaw set, scanning multiple screens

  - id: assistant_director
    displayNames: ["助理導播"]
    portraitMode: portrait
    visualPrompt: >
      Young Japanese assistant director in her mid-twenties, quick upright
      standing posture, black staff hoodie with a rolled sleeve, short bob
      haircut, handheld radio in one hand and a cue-sheet clipboard in the
      other, alert overworked energy.
    referenceAssetId: null
    expressions:
      standard:
        prompt: alert busy expression, radio held near her mouth
      worried:
        prompt: worried expression, glancing at a radio that will not answer

  - id: pr_officer
    displayNames: ["公關"]
    portraitMode: portrait
    visualPrompt: >
      Japanese event public-relations officer in her early thirties, narrow
      composed standing posture, cream blazer over a black blouse, neat
      shoulder-length straight hair, smartphone held up with a drafted
      statement, polished corporate calm; distinct from the hoodie-wearing
      assistant director.
    referenceAssetId: null
    expressions:
      standard:
        prompt: polished neutral expression, corporate composure
      strained:
        prompt: strained polite expression, composure under pressure

  - id: event_security
    displayNames: ["活動保全"]
    portraitMode: portrait
    visualPrompt: >
      Japanese event security lead in his fifties, broad square standing
      posture, dark security uniform jacket with reflective trim, earpiece
      coil, tablet showing a green status list, short cropped gray hair,
      rule-following steady presence.
    referenceAssetId: null
    expressions:
      standard:
        prompt: steady rule-following expression, neutral
      uneasy:
        prompt: uneasy expression, rechecking a status screen

  - id: togawa_miu
    displayNames: ["戶川美羽"]
    portraitMode: portrait
    visualPrompt: >
      Japanese university student fan around twenty, small earnest upright
      posture hugging a rolled-up damp handmade cheering banner, clear
      lavender-tinted rain poncho over a beige college hoodie, shoulder-length
      dark hair slightly wet at the ends, phone with a cracked case and a
      small lavender charm in one hand, red-rimmed but stubborn eyes; clearly
      younger and plainer than Mashiro, distinct from the black-hoodie
      assistant director.
    referenceAssetId: null
    expressions:
      standard:
        prompt: earnest expression, red-rimmed eyes, holding herself together
      insistent:
        prompt: insistent expression, leaning forward, phone held up as proof
      shaken:
        prompt: shaken expression, certainty slipping, gripping the phone tighter

