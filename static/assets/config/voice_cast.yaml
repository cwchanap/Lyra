# Voice cast for the per-scene locale scripts (docs/stories_plan/<chapter>/<locale>/).
# One entry per voiced character, reused across chapters. Only an `approved`
# entry with a `voiceId` gets clip IDs from `voice:sync` and clips from
# `voice:generate`. Set `approved` only for the exact voice the owner picked
# (from library samples or `voice:audition`). See .claude/skills/voicing-lyra-dialogue.
schemaVersion: 1
locales:
  ja:
    # eleven_v3 takes audio tags such as [calm] and supports Japanese on the
    # text-to-speech endpoint. eleven_v4 is listed for the Text to Dialogue API;
    # try it in the pilot before switching.
    model: eleven_v3
    # ElevenLabs' Japanese text normalization: better kanji readings, slower requests.
    languageTextNormalization: true
    cast:
      - characterId: soma_ritsu
        # Cast record: picked by the owner on 2026-10-21 from library samples.
        # Kenzo: calm, young male voice. The owner found it in the voice
        # library, outside the shortlist below.
        status: approved
        voiceId: b34JylakFZPlGS0BnwyY
        settings:
          { stability: 0.5, similarityBoost: 0.75, style: 0, speed: 1.0 }
        seed: 1101
        expressionDirections:
          standard: "[calm]"
          determined: "[determined]"
          shaken: "[unsettled, quietly]"
          relieved: "[relieved]"
        auditionLines:
          - ja: この会場、思ってたより寒いな。
          - ja: つまり、現場にはもう一人いたということです。
          - expression: shaken
            ja: サマリーは嘘をついてるわけじゃない。
        candidates:
          - { name: Kenzo, voiceId: b34JylakFZPlGS0BnwyY }
          - { name: Calm Japanese voice komi, voiceId: G4sNoJjgWjyp9nhj1Bhj }
          - { name: Nao, voiceId: tBfOvWrqvlfBiyUGpSAS }
          - { name: Hadou v3, voiceId: 3VouIDzZzPEjDgmtbXBJ }
          - { name: Makoto, voiceId: 6wdSVG3CMjPfAthsnMv9 }
      - characterId: hayasaka_akane
